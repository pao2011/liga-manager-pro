/* ---------- Sistema de ligas: divisiones, temporadas y ascensos ---------- */
function seasonName(l, n){

function divisionsSorted(l){ return [...(l.divisions||[])].sort((a,b)=>a.level-b.level); }
/* Los que suben desde una división son los que bajan de la de arriba: así nunca cambia el tamaño */
function promoteCount(l, div){
  const sorted = divisionsSorted(l);
  const i = sorted.findIndex(d=>d.id===div.id);
  if(i<=0) return 0;
  return sorted[i-1].relegate||0;
}
function relegateCount(l, div){
  const sorted = divisionsSorted(l);
  const i = sorted.findIndex(d=>d.id===div.id);
  if(i<0 || i===sorted.length-1) return 0;
  return div.relegate||0;
}
function divisionComp(div){ return div && div.compId ? findComp(div.compId) : null; }
function divisionStarted(div){ return !!divisionComp(div); }
function divisionFinished(div){ const c = divisionComp(div); return !!c && c.status==='finalizada'; }
function leagueSeasonStarted(l){ return divisionsSorted(l).some(d=>divisionStarted(d)); }
function leagueSeasonFinished(l){

function leagueTeamCount(l){ return divisionsSorted(l).reduce((n,d)=>n+(d.teamIds||[]).length, 0); }

function divisionMinTeams(d){ return d.format==='grupos' ? Math.max(6, (d.groupsCount||2)*3) : 4; }

function divisionTargetSize(d){

  if(d.format==='grupos'){
    const g = d.groupsCount||2;
    target = Math.max(min, Math.ceil(target/g)*g);
  }
  return target;
}
function divisionIssues(l, d){

  const out = [];
  if(n < divisionMinTeams(d)) out.push(`necesita al menos ${divisionMinTeams(d)} equipos (tiene ${n})`);
  if(d.format==='grupos'){
    const g = d.groupsCount||2;
    if(n % g !== 0) out.push(`${n} equipos no se reparten en partes iguales entre ${g} grupos`);
    const q = d.qualify||2;
    if(q*g < 2) out.push('deben clasificar al menos 2 equipos en total');
    if(q >= Math.floor(n/g)) out.push('clasifican demasiados equipos por grupo');
  }
  const rel = relegateCount(l, d), pro = promoteCount(l, d);
  if(rel + pro >= n) out.push('entre ascensos y descensos se movería toda la división');
  return out;
}
function leagueIssues(l){
  const ds = divisionsSorted(l);
  const out = [];
  if(!ds.length) out.push('agrega al menos una división');
  ds.forEach(d=>divisionIssues(l,d).forEach(x=>out.push(d.name+': '+x)));

/* Crea la competición de una división para la temporada en curso */
function makeDivisionComp(l, div){
  const label = seasonName(l);
  const comp = {
    id: uid(), name: div.name, season: label, sponsor: l.name,
    format: div.format, legs: div.legs||1, teamIds: [...div.teamIds],

    startDate: l.startDate, intervalDays: l.intervalDays||7,

    prize: Object.assign({}, div.prize, {currency: l.currency}),
    rules: Object.assign({}, l.rules),
    unavail: {}, yc: {},
    leagueId: l.id, divisionId: div.id, seasonNum: l.season, divisionLevel: div.level
  };
  if(div.format === 'liga'){
    comp.rounds = roundRobinRounds(comp.teamIds, comp.legs);
  } else {
    comp.qualify = div.qualify||2; comp.thirdPlace = !!div.thirdPlace; comp.seeding = 'sorteo';
    comp.groups = createGroups(comp.teamIds, div.groupsCount||2, 'sorteo');
    comp.rounds = mergeGroupRounds(comp.groups, comp.legs);

function startLeagueSeason(l){

    if(divisionComp(div)) return;
    const comp = makeDivisionComp(l, div);
    data.competitions.push(comp);
    div.compId = comp.id;
  });

/* Orden final de una división: sirve para el campeón, los ascensos y los descensos */
function bracketRanking(b){
  const depth = {};
  b.rounds.forEach((r,i)=>r.forEach(m=>{
    [m.teamAId, m.teamBId].forEach(id=>{ if(id) depth[id] = Math.max(depth[id]==null?-1:depth[id], i); });
  }));
  const fin = bracketFinal(b);
  const champ = bracketChampion(b);
  const runner = fin && fin.played && fin.winnerId ? (fin.winnerId===fin.teamAId ? fin.teamBId : fin.teamAId) : null;
  let third = null, fourth = null;
  if(b.third && b.third.played && b.third.winnerId){
    third = b.third.winnerId;
    fourth = third===b.third.teamAId ? b.third.teamBId : b.third.teamAId;
  }
  const head = [];
  [champ, runner, third, fourth].forEach(id=>{ if(id && head.indexOf(id)<0) head.push(id); });
  const rest = Object.keys(depth).filter(id=>head.indexOf(id)<0).sort((x,y)=>depth[y]-depth[x]);
  return head.concat(rest);
}
function finalRanking(c){
  if(!c) return [];
  if(c.format==='liga') return computeStandings(c).map(r=>r.teamId);
  const table = computeStandings(c).map(r=>r.teamId);
  if(!c.bracket) return table;
  const br = bracketRanking(c.bracket);
  return br.concat(table.filter(id=>br.indexOf(id)<0));
}
/* Cierra la temporada: reparte ascensos y descensos y deja todo listo para la siguiente */
function closeLeagueSeason(l){
  const sorted = divisionsSorted(l);
  const rank = {};
  sorted.forEach(d=>{
    const c = divisionComp(d);
    const r = c ? finalRanking(c) : [];
    // Por si algún equipo fue borrado o nunca jugó
    rank[d.id] = r.filter(id=>findTeam(id)).concat((d.teamIds||[]).filter(id=>findTeam(id) && r.indexOf(id)<0));
  });
  const moves = {};
  sorted.forEach(d=>{ moves[d.id] = {down:[], up:[]}; });
  for(let i=0;i<sorted.length-1;i++){
    const hi = sorted[i], lo = sorted[i+1];
    const k = clamp(hi.relegate||0, 0, Math.min(Math.max(0,rank[hi.id].length-1), Math.max(0,rank[lo.id].length-1)));
    if(k<=0) continue;
    moves[hi.id].down = rank[hi.id].slice(-k);
    moves[lo.id].up = rank[lo.id].slice(0, k);
  }
  const record = {season: l.season, label: seasonName(l), divisions: []};
  sorted.forEach(d=>{
    const c = divisionComp(d);
    record.divisions.push({
      divisionId: d.id, name: d.name, level: d.level, compId: d.compId,
      championId: c ? compChampionId(c) : null,
      awards: c ? seasonAwardsRecord(c) : null,
      table: rank[d.id].slice(0, 30),
      relegated: [...moves[d.id].down],
      promoted: [...moves[d.id].up],
      names: rank[d.id].reduce((o,id)=>{ const t=findTeam(id); if(t) o[id]=t.name; return o; }, {})
    });
  });
  // Rearmar los planteles de cada división
  const next = {};
  sorted.forEach(d=>{ next[d.id] = rank[d.id].filter(id=>moves[d.id].down.indexOf(id)<0 && moves[d.id].up.indexOf(id)<0); });
  for(let i=0;i<sorted.length-1;i++){
    const hi = sorted[i], lo = sorted[i+1];
    moves[hi.id].down.forEach(id=>next[lo.id].push(id));
    moves[lo.id].up.forEach(id=>next[hi.id].push(id));
  }
  sorted.forEach(d=>{ d.teamIds = next[d.id]; d.compId = null; });
  l.history.push(record);
  l.season++;

  try{
    const parts = (l.startDate||todayISO()).split('-').map(Number);
    const dte = new Date(parts[0]+1, parts[1]-1, parts[2]);
    l.startDate = dte.getFullYear()+'-'+pad2(dte.getMonth()+1)+'-'+pad2(dte.getDate());
  }catch(e){}
  return record;
}
/* Descansa a todos los jugadores entre temporadas */
function restLeagueTeams(l){
  divisionsSorted(l).forEach(d=>{
    (d.teamIds||[]).forEach(id=>{
      const t = findTeam(id); if(!t) return;
      t.players.forEach(p=>{ p.fit = clamp(Math.round((p.fit??100) + (100-(p.fit??100))*0.85), 25, 100); });

/* ---------- Progresión de jugadores entre temporadas ---------- */
const PROG_ATTRS = ['ata','def','fis','vel','pas','tec','tir','res','ref'];
function ensurePot(p){
  if(p.pot==null){
    const ov = playerOverall(p), age = p.age??24;
    const bump = age<=19 ? rnd(6,20) : age<=21 ? rnd(4,15) : age<=24 ? rnd(1,9) : age<=28 ? rnd(0,4) : rnd(0,1);
    p.pot = clamp(ov+bump, ov, 96);
  }
  return p.pot;
}
/* Un año más: los jóvenes crecen hacia su potencial, el físico se apaga primero y la técnica después */
function progressPlayer(p, label){
  ensurePot(p);
  const before = playerOverall(p), age = p.age??24;
  const eff = p.position==='POR' ? age-3 : age;
  const gap = p.pot - before;
  let base;
  if(age<=19) base = gap*0.34 + 0.8;
  else if(age<=22) base = gap*0.27 + 0.4;
  else if(age<=25) base = gap*0.18;
  else if(eff<=28) base = gap*0.06 - 0.2;
  else if(eff<=31) base = -0.7;
  else if(eff<=34) base = -1.8;
  else base = -3.0;
  base += gauss()*1.3;
  PROG_ATTRS.forEach(k=>{
    let d = base;
    if(k==='vel' || k==='res') d += eff>=27 ? -(eff-26)*0.45 : 0;
    else if((k==='pas' || k==='tec' || k==='def') && eff>=27 && eff<=32) d += 0.5;
    d += gauss()*1.4;
    p[k] = clamp(Math.round((p[k]??60)+d), 12, 99);
  });
  p.dis = clamp(Math.round((p.dis??60) + (age<30?0.8:0.4) + gauss()*1.6), 20, 99);
  p.ovrHist = (p.ovrHist||[]).concat([{s:label, o:before}]).slice(-25);
  p.age = age+1;
  p.form = Math.round((p.form??65)*0.5 + 65*0.5);
  return {before, after: playerOverall(p)};
}
function retireChance(p){
  const age = p.age??24, eff = p.position==='POR' ? age-2 : age;
  let c = eff<=33 ? 0 : eff===34 ? 0.06 : eff===35 ? 0.18 : eff===36 ? 0.36 : eff===37 ? 0.58 : eff===38 ? 0.8 : 0.95;
  const ov = playerOverall(p);
  if(ov>=78) c *= 0.55; else if(ov>=70) c *= 0.8; else if(ov<58) c = Math.min(1, c*1.4);
  return c;
}
/* Un juvenil de la cantera: arranca con poco nivel, pero algunos tienen mucho techo */
function makeAcademyPlayer(team, pos, number, label){
  const counts = {}; team.players.forEach(p=>{ counts[p.nat] = (counts[p.nat]||0)+1; });
  const main = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || pick(NATIONS).v;
  const nat = Math.random()<0.88 ? main : pick(NATIONS).v;
  const used = new Set(team.players.map(p=>p.name));
  let name, guard = 0; do{ name = nameForNation(nat); guard++; } while(used.has(name) && guard<40);
  const p = Object.assign({id:uid(), name, number, position:pos}, randomAttrsForPosition(pos, nat));
  p.age = rnd(16,19);
  const shift = rnd(40,56) - playerOverall(p);
  PROG_ATTRS.forEach(k=>{ p[k] = clamp(Math.round((p[k]??60)+shift+rnd(-3,3)), 12, 99); });
  const gem = Math.random()<0.10;
  p.pot = clamp(playerOverall(p) + (gem ? rnd(30,42) : rnd(14,30)), 55, 94);
  p.fit = 100; p.form = rnd(55,70); p.cantera = label;
  return p;
}
function progressLeagueTeams(l){
  const label = seasonName(l, l.season-1);
  const all = [], retired = [], rookies = [];
  data.retired = data.retired || {};
  const seen = new Set();
  divisionsSorted(l).forEach(d=>(d.teamIds||[]).forEach(id=>{
    if(seen.has(id)) return; seen.add(id);
    const t = findTeam(id); if(!t) return;
    t.players.forEach(p=>{
      const r = progressPlayer(p, label);
      all.push({id:p.id, name:p.name, team:t.name, from:r.before, to:r.after, age:p.age});
    });
    t.players.filter(p=>Math.random()<retireChance(p)).forEach(p=>{
      const ovr = playerOverall(p);
      data.retired[p.id] = {name:p.name, team:t.name, pos:p.position, nat:p.nat, age:p.age, ovr, season:label};
      retired.push({name:p.name, team:t.name, age:p.age, ovr});
      t.players = t.players.filter(x=>x.id!==p.id);
      const rk = makeAcademyPlayer(t, p.position, p.number, label);
      t.players.push(rk);
      rookies.push({id:rk.id, name:rk.name, team:t.name, age:rk.age, pos:rk.position, ovr:playerOverall(rk), pot:rk.pot});
    });
  }));
  return {
    label, total: all.length, retiredN: retired.length, rookiesN: rookies.length,
    risers: all.filter(r=>r.to>r.from).sort((a,b)=>(b.to-b.from)-(a.to-a.from)).slice(0,5),
    fallers: all.filter(r=>r.to<r.from).sort((a,b)=>(a.to-a.from)-(b.to-b.from)).slice(0,5),
    retired: retired.sort((a,b)=>b.ovr-a.ovr).slice(0,12),
    rookies: rookies.sort((a,b)=>b.pot-a.pot).slice(0,5)
  };
}

/* ---------- Bloqueo de fechas, bajas y sanciones ---------- */
function roundsOf(comp, isBracket){ return isBracket ? comp.bracket.rounds : comp.rounds; }
function isRoundUnlocked(comp, idx, isBracket){
  const rs = roundsOf(comp,isBracket);
  for(let i=0;i<idx;i++){ if(!rs[i].every(m=>m.played)) return false; }
  return true;
}
function locateMatch(comp, matchId){
  if(comp.rounds){
    for(let i=0;i<comp.rounds.length;i++){ const m=comp.rounds[i].find(x=>x.id===matchId); if(m) return {m, idx:i, isBracket:false}; }
  }
  if(comp.bracket){
    for(let i=0;i<comp.bracket.rounds.length;i++){ const m=comp.bracket.rounds[i].find(x=>x.id===matchId); if(m) return {m, idx:i, isBracket:true}; }
    if(comp.bracket.third && comp.bracket.third.id===matchId) return {m:comp.bracket.third, idx:comp.bracket.rounds.length-1, isBracket:true};
  }
  return null;
}
function unavailSet(comp, team){
  const s = new Set(); const u = (comp&&comp.unavail)||{};
  team.players.forEach(p=>{ if(u[p.id] && u[p.id].games>0) s.add(p.id); });
  return s;
}
function applyAftermath(comp, m, A, B){
  const R = compRules(comp);
  comp.unavail = comp.unavail||{}; comp.yc = comp.yc||{};
  const ids = new Set([...A.players, ...B.players].map(p=>p.id));
  Object.keys(comp.unavail).forEach(pid=>{
    if(ids.has(pid)){ comp.unavail[pid].games--; if(comp.unavail[pid].games<=0) delete comp.unavail[pid]; }
  });
  const setBan=(pid,type,games)=>{ const cur=comp.unavail[pid]; if(!cur || cur.games<games) comp.unavail[pid]={type, games}; };
  (m.events||[]).forEach(e=>{
    if(e.type==='roja' && R.redBan>0) setBan(e.playerId,'susp',R.redBan);
    if(e.type==='lesion' && R.injuryAbsence) setBan(e.playerId,'lesion',rnd(1,3));
    if(e.type==='amarilla' && R.yellowLimit>0){
      comp.yc[e.playerId] = (comp.yc[e.playerId]||0)+1;
      if(comp.yc[e.playerId]>=R.yellowLimit){ comp.yc[e.playerId]=0; setBan(e.playerId,'susp',1); }
    }
  });
  updateCondition(m, A, B);
}
/* Después de cada partido: los que jugaron se desgastan, los demás recuperan.
   La racha sube o baja según la puntuación que sacaron. */
function updateCondition(m, A, B){
  const ps = m.pstats || {};
  [A, B].forEach(t=>{
    t.players.forEach(p=>{
      const st = ps[p.id];
      const fit = clamp(p.fit??100, 25, 100);
      if(st && st.min>0){
        // Recupera una parte de lo que le falta y descuenta la carga del partido
        let load = st.min*0.135 + (st.injured?20:0) + (st.knock?7:0);
        load *= (0.70 + 0.6*(1-(p.res??60)/100));
        if((p.age??24)>=32) load *= 1.15;
        else if((p.age??24)<=20) load *= 0.92;
        p.fit = clamp(Math.round(fit + (100-fit)*0.40 - load), 25, 100);
        if(st.rating!=null){
          const target = clamp(15 + (st.rating-5)*22, 15, 99);
          p.form = clamp(Math.round((p.form??65)*0.66 + target*0.34), 20, 99);
        }
      } else {
        p.fit = clamp(Math.round(fit + (100-fit)*0.55), 25, 100);
        p.form = clamp(Math.round((p.form??65)*0.94 + 62*0.06), 20, 99);
      }
    });
  });
}

/* ---------- Estadísticas ---------- */
function allMatchesOf(comp){
  let list=[];
  if(comp.rounds) list = list.concat(comp.rounds.flat());
  if(comp.bracket) list = list.concat(bracketMatches(comp.bracket));
  return list;
}
function aggregateStats(compList){
  const agg = {};
  function ensure(id){
    if(!agg[id]){
      const found = findPlayerGlobal(id);
      agg[id] = { id, name: found? found.player.name : (data.retired&&data.retired[id] ? data.retired[id].name+' (retirado)' : 'Jugador eliminado'), team: found? found.team.name : (data.retired&&data.retired[id] ? data.retired[id].team : '—'), goals:0, assists:0, yellow:0, red:0, motm:0, injuries:0, varGoals:0, penMissed:0, ownGoals:0, saves:0, minutes:0, dribbles:0, shots:0, apps:0, contrib:0, ratingSum:0, ratingN:0, avgRating:0 };
    }
    return agg[id];
  }
  compList.forEach(comp=>{
    allMatchesOf(comp).forEach(m=>{
      if(!m.played || m.isBye) return;
      (m.events||[]).forEach(e=>{
        if(e.type==='gol'||e.type==='gol_penal'){ ensure(e.playerId).goals++; if(e.assistId) ensure(e.assistId).assists++; }
        if(e.type==='amarilla') ensure(e.playerId).yellow++;
        if(e.type==='roja') ensure(e.playerId).red++;
        if(e.type==='lesion') ensure(e.playerId).injuries++;
        if(e.type==='gol_anulado') ensure(e.playerId).varGoals++;
        if(e.type==='penal_fallado') ensure(e.playerId).penMissed++;
        if(e.type==='autogol') ensure(e.playerId).ownGoals++;
      });
      if(m.motmPlayerId) ensure(m.motmPlayerId).motm++;
      if(m.pstats){
        Object.keys(m.pstats).forEach(pid=>{
          const ps = m.pstats[pid]; if(!ps) return;
          const a = ensure(pid);
          a.saves += ps.saves||0; a.dribbles += ps.dribbles||0; a.shots += ps.shots||0;
          a.minutes += ps.min||0;
          if((ps.min||0)>0) a.apps++;
          if(ps.rating!=null){ a.ratingSum+=ps.rating; a.ratingN++; }
        });
      }
    });
  });
  Object.values(agg).forEach(a=>{ a.avgRating = a.ratingN ? Math.round(a.ratingSum/a.ratingN*10)/10 : 0; a.contrib = a.goals + a.assists; });
  return Object.values(agg);
}

/* ---------- Historial de un equipo ---------- */
function matchOutcomeFor(m, teamId){
  const home = m.teamAId===teamId;
  const gf = home? m.homeGoals : m.awayGoals, gc = home? m.awayGoals : m.homeGoals;
  if(gf>gc) return 'G'; if(gf<gc) return 'P';
  if(m.winnerId) return m.winnerId===teamId ? 'G' : 'P';
  return 'E';
}
function teamMatches(teamId){
  const out=[];
  data.competitions.forEach(c=>{
    const add=(m,dateIdx,isBracket,label)=>{

/* ================= MODO DT ================= */
/* El usuario puede "ser DT" de un equipo: arma el once, ficha jugadores en el
   mercado de pases, administra el presupuesto del club y dirige sus partidos
   en vivo (pausa, cambia la mentalidad y hace cambios durante el desarrollo). */
function userTeam(){ return data.userTeamId ? findTeam(data.userTeamId) : null; }
function isUserTeam(id){ return !!id && data.userTeamId===id; }
function initialBudgetFor(t){ return Math.round((1200000 + teamOvr(t)*22000 + Math.random()*400000)/10000)*10000; }
function nextFreeNumber(t){ const used=new Set(t.players.map(x=>x.number)); for(let n=1;n<=99;n++) if(!used.has(n)) return n; return 99; }
/* Valor de mercado: crece fuerte con el nivel y se resiente con la edad */
function marketValue(p){
  const ovr = playerOverall(p), age = p.age||24;
  const ageMul = age<=20?1.4 : age<=23?1.25 : age<=27?1.05 : age<=30?0.82 : age<=33?0.52 : 0.28;
  const base = Math.pow(Math.max(ovr-35,3), 2.1)*40;
  return Math.max(20000, Math.round(base*ageMul/1000)*1000);
}
function askingPrice(p){ return Math.round(marketValue(p)*1.3/5000)*5000; }
function sellValue(p){ return Math.round(marketValue(p)*0.8/5000)*5000; }
function ensureFreeAgents(){
  if(!data.freeAgents) data.freeAgents=[];
  while(data.freeAgents.length<14){
    const pos = pick(['POR','DEF','DEF','MED','MED','DEL']);
    const attrs = randomAttrsForPosition(pos);
    const p = Object.assign({id:uid(), name:nameForNation(attrs.nat), number:rnd(1,30), position:pos}, attrs);
    p.fit = rnd(80,100); p.form = rnd(50,75);
    ensurePlayer(p);
    data.freeAgents.push(p);
  }
}
function refreshFreeAgents(){ data.freeAgents=[]; ensureFreeAgents(); }
/* Lista de fichajes disponibles: jugadores de otros equipos + agentes libres */
function marketListings(posFilter){
  const ut = userTeam();
  const list = [];
  data.teams.forEach(t=>{
    if(ut && t.id===ut.id) return;
    t.players.forEach(p=>{
      if(posFilter && p.position!==posFilter) return;
      list.push({p, team:t, price:askingPrice(p), free:false});
    });
  });
  ensureFreeAgents();
  data.freeAgents.forEach(p=>{
    if(posFilter && p.position!==posFilter) return;
    list.push({p, team:null, price:Math.round(marketValue(p)*0.4/5000)*5000, free:true});
  });
  list.sort((a,b)=>playerOverall(b.p)-playerOverall(a.p));
  return list;
}
/* Si el técnico armó un once manual (customStarters) lo usa como base, completando lo que falte */
function customLineupOrAuto(t, excludeIds){
  const ids = t.customStarters;
  if(ids && ids.length>=7){
    const ex = excludeIds || new Set();
    const avail = t.players.filter(p=>!ex.has(p.id));
    const chosenIds = new Set(ids);
    const chosen = ids.map(id=>avail.find(p=>p.id===id)).filter(Boolean);
    if(chosen.length>=7){
      const rest = avail.filter(p=>!chosenIds.has(p.id)).sort((a,b)=>selectionScore(b)-selectionScore(a));
      const need = Math.min(11, avail.length);
      const starting = chosen.slice(0, need);
      while(starting.length<need && rest.length) starting.push(rest.shift());
      const usedIds = new Set(starting.map(p=>p.id));
      const rest2 = avail.filter(p=>!usedIds.has(p.id)).sort((a,b)=>selectionScore(b)-selectionScore(a));
      const bench=[]; const gk = rest2.find(p=>p.position==='POR'); if(gk) bench.push(gk);
      rest2.forEach(p=>{ if(bench.length<9 && !bench.includes(p)) bench.push(p); });
      return {starting, bench, formation: FORMATIONS[t.tactic] ? t.tactic : '4-4-2'};
    }
  }
  return buildLineup(t.players, t.tactic, excludeIds);
}
const MENT_MUL = {ofensiva:{att:1.05,opp:1.04}, equilibrada:{att:1,opp:1}, defensiva:{att:0.95,opp:0.93}};
/* Estado del partido que el usuario está dirigiendo en vivo (null si no hay ninguno en curso) */
const DT = { live: null, subOut: null };
function dtSetupLiveState(comp, m, isBracket){
  const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
  const ut = userTeam();
  const userSide = ut && m.teamAId===ut.id ? 'home' : (ut && m.teamBId===ut.id ? 'away' : null);
  const rules = compRules(comp);
  const uA = unavailSet(comp, A), uB = unavailSet(comp, B);
  const stakes = matchStakes(comp, m, locateMatch(comp, m.id));
  const wx = rollWeather();
  const stadium = getStadium(A);
  const shelter = stadium.roof && (wx.v==='lluvia'||wx.v==='tormenta'||wx.v==='viento'||wx.v==='niebla');
  const env = {
    drain: shelter ? 1+(wx.drain-1)*0.5 : wx.drain, err: shelter ? 1+(wx.err-1)*0.4 : wx.err,
    goal: shelter ? 1+(wx.goal-1)*0.4 : wx.goal, wind:(wx.v==='viento'||wx.v==='tormenta') && !stadium.roof
  };
  let fill = clamp(0.5+(teamOvr(A)-55)/120+Math.random()*0.3, 0.3, 1);
  if(ut && A.id===ut.id) fill = clamp(fill*(0.85+0.3*((ut.happiness??60)/100)), 0.2, 1);
  const attendance = Math.round((stadium.capacity||20000)*fill);
  const homeBoost = 0.08 + 0.16*fill + (stadium.shape==='clasico' ? 0.02 : 0);
  const lineupA = (ut && A.id===ut.id) ? customLineupOrAuto(A, uA) : buildLineup(A.players, A.tactic, uA);
  const lineupB = (ut && B.id===ut.id) ? customLineupOrAuto(B, uB) : buildLineup(B.players, B.tactic, uB);
  const H = makeSide(A,'home', lineupA, rules, env);
  const Aw = makeSide(B,'away', lineupB, rules, env);
  H.opp = Aw; Aw.opp = H;
  const s1 = 1+Math.floor(Math.random()*4), s2 = 2+Math.floor(Math.random()*5);
  const moments=[]; for(let i=1;i<=45;i++) moments.push(i); for(let k=1;k<=s1;k++) moments.push(45+k*0.1);
  for(let i=46;i<=90;i++) moments.push(i); for(let k=1;k<=s2;k++) moments.push(90+k*0.1);
  const ctx = {rules, N: moments.length, events: [], env, mom:0, homeBoost,
    stakes: (A.rivalId && A.rivalId===B.id) ? Math.min(1, stakes+0.32) : stakes,
    rivalry: !!(A.rivalId && A.rivalId===B.id), userSide};
  DT.live = {
    comp, m, isBracket, A, B, H, Aw, ctx, moments, idx:0, s1, s2, wx, stadium, attendance, shelter,
    env, paused:false, pauseRequested:false, halftime:false, speed:1, extraTime:false, extraTimeStarted:false,
    stoppageET1:0, stoppageET2:0
  };
  DT.subOut = null;
}
function dtRunTick(t){
  const L = DT.live; const H=L.H, Aw=L.Aw, ctx=L.ctx;
  if(Number.isInteger(t) && SUB_WINDOWS.includes(t)){
    (Math.random()<0.5 ? [H,Aw] : [Aw,H]).forEach(S=>decideSubs(S,t,t===46,ctx));
  }
  if(Number.isInteger(t) && (t===63 || t===70 || t===78)){ [H,Aw].forEach(S=>maybeShift(S,t,ctx)); }
  if(L.wx.v==='calor' && (t===29 || t===73)){
    addEvent(ctx, {minute:t, display:formatMinute(t), type:'hidratacion', side:'home', teamId:L.A.id});
  }
  ctx.mom *= 0.93;
  [H,Aw].forEach(S=>{ S.temple=templeOf(S); S.nerves=nervesOf(S,S.opp,t,ctx); S.nervSum+=S.nerves; S.nervN++; });
  const rH = sideRatings(H,t), rA = sideRatings(Aw,t);
  H.box.possW += rH.mid*Math.pow(H.onPitch.length/11,1.4)*(H.mentality==='ofensiva'?1.06:H.mentality==='defensiva'?0.93:1);
  Aw.box.possW += rA.mid*Math.pow(Aw.onPitch.length/11,1.4)*(Aw.mentality==='ofensiva'?1.06:Aw.mentality==='defensiva'?0.93:1);
  if(Math.random() < (ctx.rivalry?0.85:0.26)/ctx.N && t>20 && t<88){
    const first = Math.random()<0.5 ? H : Aw; resolveScuffle(first, first.opp, t, ctx);
  }
  if(ctx.rivalry){
    if(Number.isInteger(t) && t>76 && t<91 && Math.random() < 1.1/ctx.N){
      addEvent(ctx, {minute:t, display:formatMinute(t), type:'invasion_cancha', side:'home', teamId:L.A.id, clasico:true});
      addStopBonus(ctx, t, 2.5+Math.random()*2.5);
    }
    if(t>10 && t<85 && Math.random() < 0.5/ctx.N){ resolveObjectThrow(Math.random()<0.5?H:Aw, t, ctx); }
    if(t>15 && t<80 && Math.random() < 0.4/ctx.N){ resolveFlareSmoke(Math.random()<0.5?H:Aw, t, ctx); }
  }
  (Math.random()<0.5 ? [[H,rH,rA],[Aw,rA,rH]] : [[Aw,rA,rH],[H,rH,rA]]).forEach(([S,rS,rO])=>stepSide(S,S.opp,rS,rO,t,ctx));
}
function dtTickDelay(t){
  const L = DT.live; const base = L.speed===4 ? 30 : L.speed===2 ? 55 : 100;
  return Number.isInteger(t) ? base : Math.round(base*0.35);
}
function dtSleep(ms){ return new Promise(res=>setTimeout(res, Math.max(0,ms))); }
async function dtAdvance(){
  const L = DT.live; if(!L || L.paused) return;
  while(L.idx < L.moments.length){
    const t = L.moments[L.idx];
    dtRunTick(t);
    L.idx++;
    if(L.moments[L.idx]===46 && !L.halftime){ L.halftime=true; L.pauseRequested=true; }
    if(ui.screen==='dt-match') render();
    await dtSleep(dtTickDelay(t));
    if(L.pauseRequested){ L.paused=true; L.pauseRequested=false; if(ui.screen==='dt-match') render(); return; }
  }
  if(!L.extraTimeStarted && L.isBracket && L.H.goals===L.Aw.goals){
    L.extraTimeStarted = true; L.extraTime = true;
    L.stoppageET1 = Math.random()<0.55?1:2; L.stoppageET2 = Math.random()<0.6?1:2;
    L.ctx.stakes = Math.min(1, L.ctx.stakes+0.15);
    const etMoments=[];
    for(let i=91;i<=105;i++) etMoments.push(i);
    for(let k=1;k<=L.stoppageET1;k++) etMoments.push(105+k*0.1);
    for(let i=106;i<=120;i++) etMoments.push(i);
    for(let k=1;k<=L.stoppageET2;k++) etMoments.push(120+k*0.1);
    L.moments = L.moments.concat(etMoments);
    return dtAdvance();
  }
  dtFinishLiveMatch();
}
function dtFinishLiveMatch(){
  const L = DT.live; if(!L) return;
  const {H, Aw, ctx, comp, m, isBracket, A, B} = L;
  finishBox(H, Aw);
  const matchEnd = L.extraTime ? 120 : 90;
  resolvePostMatchClash(H, Aw, ctx, matchEnd);
  // El descuento final refleja lo que pasó en el partido (peleas, invasión, bengalazo, etc.)
  const stopBonus = ctx.stopBonus || {1:0,2:0};
  L.s1 = Math.min(11, Math.round(L.s1 + stopBonus[1]));
  L.s2 = Math.min(15, Math.round(L.s2 + stopBonus[2]));
  const pstats = {};
  [H,Aw].forEach(S=>{
    [...S.lineup.starting, ...S.lineup.bench].forEach(p=>{
      const st = S.stats[p.id];
      if(S.enteredAt.has(p.id)){
        const start = minuteInt(S.enteredAt.get(p.id));
        const end = S.leftAt.has(p.id) ? minuteInt(S.leftAt.get(p.id)) : matchEnd;
        st.min = clamp(end-start, 0, matchEnd);
        if(st.min===0 && st.started) st.min = 1;
      }
      st.rating = computeRating(p, st, S);
      pstats[p.id] = st;
    });
  });
  let motmPlayerId=null, best=-Infinity;
  Object.keys(pstats).forEach(id=>{
    const st=pstats[id]; if(st.rating==null) return;
    const score = st.rating + st.goals*0.01 + Math.random()*0.001;
    if(score>best){ best=score; motmPlayerId=id; }
  });
  ctx.events.sort((a,b)=>a.minute-b.minute);
  const res = {
    homeGoals:H.goals, awayGoals:Aw.goals, events:ctx.events, motmPlayerId, stoppage1:L.s1, stoppage2:L.s2,
    extraTime:L.extraTime, stoppageET1:L.stoppageET1, stoppageET2:L.stoppageET2,
    weather: L.wx.v, stakes: ctx.stakes,
    nerves: {home: H.nervN?Math.round(H.nervSum/H.nervN*100):0, away: Aw.nervN?Math.round(Aw.nervSum/Aw.nervN*100):0},
    box: {home:H.box, away:Aw.box},
    onPitchEnd: {home:H.onPitch.map(p=>p.id), away:Aw.onPitch.map(p=>p.id)},
    lineups:{
      home:{formation:H.formation, starting:H.lineup.starting.map(p=>p.id), bench:H.lineup.bench.map(p=>p.id)},
      away:{formation:Aw.formation, starting:Aw.lineup.starting.map(p=>p.id), bench:Aw.lineup.bench.map(p=>p.id)}
    },
    pstats,
    venue:{teamId:A.id, name:L.stadium.name, nickname:L.stadium.nickname||null, attendance:L.attendance, sheltered:!!L.shelter}
  };
  m.homeGoals=res.homeGoals; m.awayGoals=res.awayGoals; m.events=res.events; m.motmPlayerId=res.motmPlayerId;
  m.stoppage1=res.stoppage1; m.stoppage2=res.stoppage2; m.lineups=res.lineups; m.pstats=res.pstats; m.venue=res.venue;
  m.box=res.box; m.weather=res.weather; m.stakes=res.stakes; m.nerves=res.nerves;
  m.extraTime=res.extraTime; m.stoppageET1=res.stoppageET1; m.stoppageET2=res.stoppageET2;
  m.played=true; m.playedAt=Date.now();
  if(isBracket){
    if(res.homeGoals===res.awayGoals){
      const pens = simulatePenalties(A, B, res);
      m.penA=pens.a; m.penB=pens.b; m.penSeq=pens.seq;
      m.winnerId = pens.a>pens.b ? m.teamAId : m.teamBId;
    } else m.winnerId = res.homeGoals>res.awayGoals ? m.teamAId : m.teamBId;
    propagateWinners(comp.bracket);
  }
  applyAftermath(comp, m, A, B);
  dtApplyCareerAftermath(A, B, res, {attendance:L.attendance, rivalry:ctx.rivalry, matchId:m.id});

/* Economía y ánimo de la dirigencia para el equipo que maneja el usuario en Modo Carrera.
   Se aplica tanto si el partido se jugó en vivo (2D) como si se simuló rápido. */
function dtApplyCareerAftermath(A, B, res, opts){
  const ut = userTeam();
  if(!ut || (A.id!==ut.id && B.id!==ut.id)) return;
  opts = opts || {};
  const userIsHome = A.id===ut.id;
  const rival = userIsHome ? B : A;
  const myGoals = userIsHome ? res.homeGoals : res.awayGoals;
  const rivalGoals = userIsHome ? res.awayGoals : res.homeGoals;
  const wage = squadWageBill(ut);
  const attendance = opts.attendance!=null ? opts.attendance : ((res.venue && res.venue.attendance) || 0);
  const income = userIsHome ? Math.round(attendance * ticketPriceFor(ut)) : 0;
  const net = income - wage;
  ut.budget = (ut.budget||0) + net;
  const diff = teamOvr(ut) - teamOvr(rival);
  let hDelta;
  if(myGoals>rivalGoals) hDelta = diff<-8 ? 14 : diff>8 ? 5 : 9;
  else if(myGoals===rivalGoals) hDelta = diff>8 ? -5 : diff<-8 ? 6 : 0;
  else hDelta = diff>8 ? 1 : diff<-8 ? -14 : -9;
  hDelta += clamp(myGoals-rivalGoals, -3, 3)*0.6;
  if(opts.rivalry) hDelta *= 1.4;
  if((ut.budget||0) < 0) hDelta -= 3;
  const before = ut.happiness==null ? 60 : ut.happiness;
  ut.happiness = clamp(Math.round(before + hDelta), 0, 100);
  DT.lastFinance = {matchId:opts.matchId, income, wage, net, happinessDelta: ut.happiness-before, happinessAfter: ut.happiness};
  if(ut.happiness<=0){
    ui.boardNotice = {kind:'fired', title:'💼 Despedido', body:`La dirigencia de ${ut.name} decidió separarte del cargo tras la seguidilla de malos resultados. Es momento de buscar un nuevo desafío en el Modo Carrera.`};
    data.userTeamId = null;
  } else if(ut.happiness<=20){
    ui.boardNotice = {kind:'warning', title:'⚠️ Bajo presión', body:`La paciencia de la dirigencia de ${ut.name} se está agotando (${ut.happiness}% de confianza). Necesitás mejorar los resultados pronto.`};
  }
}

function runMatch(comp, m, isBracket){
  const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
  if(!A || !B) return false;
  const loc = locateMatch(comp, m.id) || {idx:0, isBracket:!!isBracket};
  const res = simulateMatchEngine(A, B, {
    rules:compRules(comp), unavailA:unavailSet(comp,A), unavailB:unavailSet(comp,B),
    stakes: matchStakes(comp, m, loc), decisive: isBracket
  });
  m.homeGoals=res.homeGoals; m.awayGoals=res.awayGoals; m.events=res.events; m.motmPlayerId=res.motmPlayerId;
  m.stoppage1=res.stoppage1; m.stoppage2=res.stoppage2; m.lineups=res.lineups; m.pstats=res.pstats; m.venue=res.venue;
  m.box=res.box; m.weather=res.weather; m.stakes=res.stakes; m.nerves=res.nerves;
  m.extraTime=res.extraTime; m.stoppageET1=res.stoppageET1; m.stoppageET2=res.stoppageET2;
  m.played=true; m.playedAt=Date.now();
  if(isBracket){
    if(res.homeGoals===res.awayGoals){
      const pens = simulatePenalties(A, B, res);
      m.penA=pens.a; m.penB=pens.b; m.penSeq=pens.seq;
      m.winnerId = pens.a>pens.b ? m.teamAId : m.teamBId;
    } else m.winnerId = res.homeGoals>res.awayGoals ? m.teamAId : m.teamBId;
  }
  applyAftermath(comp, m, A, B);
  dtApplyCareerAftermath(A, B, res, {rivalry: !!(A.rivalId && A.rivalId===B.id), matchId:m.id});
  return true;
}

/* Juega la próxima fecha disponible de una competición y devuelve cuántos partidos se jugaron */
/* Encuentra la próxima fecha jugable de una competición sin ejecutarla todavía */
function findNextPendingRound(comp){
  if(!comp) return null;
  const passes = [[comp.rounds, false], [comp.bracket ? comp.bracket.rounds : null, true]];
  for(const [rs, isBr] of passes){
    if(!rs) continue;
    for(let i=0;i<rs.length;i++){
      let list = [...rs[i]];
      if(isBr && comp.bracket.third && i===rs.length-1) list.push(comp.bracket.third);
      const pend = list.filter(m=>!m.played && !m.isBye && m.teamAId && m.teamBId);
      if(!pend.length) continue;
      if(!isRoundUnlocked(comp, i, isBr)) continue;
      return {pend, isBr};
    }
  }
  return null;
}
function playNextRoundOf(comp){
  const found = findNextPendingRound(comp);
  if(!found) { refreshCompStatus(comp); return []; }
  const done = [];
  found.pend.forEach(m=>{
    if(runMatch(comp, m, found.isBr)){ done.push(m); if(found.isBr) propagateWinners(comp.bracket); }
  });
  refreshCompStatus(comp);
  return done;
}

  /* Los mejores arriba: reparte todos los equipos por nivel entre las divisiones */
  autoDistribute(){
    const divs = ui.draft.divisions;
    const pool = [...data.teams].sort((a,b)=>teamOvr(b)-teamOvr(a)).map(t=>t.id);
    if(!pool.length){ App.toast('Todavía no tienes equipos que repartir'); return; }
    divs.forEach(d=>{ d.teamIds=[]; });
    const wanted = divs.map(d=>divisionTargetSize(d));
    const totalWanted = wanted.reduce((a,b)=>a+b,0);
    let k = 0;
    divs.forEach((d,i)=>{
      // Si no alcanzan los equipos, se reparten en proporción al tamaño de cada división
      const take = i===divs.length-1 ? pool.length-k
        : (pool.length>=totalWanted ? wanted[i] : Math.max(0, Math.round(pool.length*wanted[i]/totalWanted)));
      d.teamIds = pool.slice(k, k+take); k += Math.min(take, Math.max(0,pool.length-k));
    });
    render();
    App.toast('Equipos repartidos por nivel');
  },
  /* Crea los equipos aleatorios necesarios para completar cada división */

    const divs = ui.draft.divisions;

    divs.forEach(d=>{ need += Math.max(0, divisionTargetSize(d) - d.teamIds.length); });
    if(!need){ App.toast('Todas las divisiones ya están completas'); return; }
    App.askConfirm('Generar equipos', `Se crearán ${need} equipos aleatorios con escudo, cancha y plantilla completa, y se repartirán en las divisiones que lo necesiten.`, ()=>{
      divs.forEach(d=>{
        const target = divisionTargetSize(d);
        while(d.teamIds.length < target){
          const t = generateRandomTeamData(data.teams);
          data.teams.push(t);
          d.teamIds.push(t.id);
        }
      });
      persist(); render();
      App.toast(`${need} ${need===1?'equipo creado':'equipos creados'}`);
    });

  async simulateLeagueRound(id){
    const l = findLeague(id); if(!l) return;
    const groups = [];
    divisionsSorted(l).forEach(d=>{
      const c = divisionComp(d);
      if(!c || c.status==='finalizada') return;
      const found = findNextPendingRound(c);
      if(found) groups.push({d, c, found});
    });
    const jobs = [];
    groups.forEach(g=>g.found.pend.forEach(m=>jobs.push({comp:g.c, m, isBr:g.found.isBr})));
    if(!jobs.length){ App.toast('No quedaban partidos por jugar'); return; }
    await simulateWithLoader('Jugando la próxima fecha…', jobs, job=>{
      const ok = runMatch(job.comp, job.m, job.isBr);
      if(ok && job.isBr) propagateWinners(job.comp.bracket);
      return ok;
    });
    const blocks = [];
    let n = 0;
    groups.forEach(({d, c, found})=>{
      refreshCompStatus(c);
      const done = found.pend.filter(m=>m.played);
      if(done.length){
        n += done.length;
        blocks.push({div:d.name, level:d.level, compId:c.id, isBracket:found.isBr,
          matches: done.map(m=>({id:m.id, a:m.teamAId, b:m.teamBId, ga:m.homeGoals, gb:m.awayGoals, pen: m.penA!=null?[m.penA,m.penB]:null}))});
      }
    });
    persist();
    if(n) ui.roundSummary = {leagueId:l.id, blocks};
    render();
    if(!n) App.toast('No quedaban partidos por jugar');
  },
  simulateLeagueSeason(id){
    const l = findLeague(id); if(!l) return;
    App.askConfirm('Simular toda la temporada', 'Se jugarán de una vez todas las fechas que falten en todas las divisiones. No se puede deshacer.', async ()=>{
      const reduced = prefersReduced();
      showSimLoader('Simulando la temporada…', 'Calculando fechas pendientes…');
      let n = 0, guard = 0;
      while(guard++ < 600){
        const groups = [];
        divisionsSorted(l).forEach(d=>{
          const c = divisionComp(d);
          if(!c || c.status==='finalizada') return;
          const found = findNextPendingRound(c);
          if(found) groups.push({d, c, found});
        });
        const jobs = [];
        groups.forEach(g=>g.found.pend.forEach(m=>jobs.push({comp:g.c, m, isBr:g.found.isBr})));
        if(!jobs.length) break;
        let did = 0;
        jobs.forEach(job=>{
          const ok = runMatch(job.comp, job.m, job.isBr);
          if(ok){ did++; n++; if(job.isBr) propagateWinners(job.comp.bracket); }
        });
        groups.forEach(g=>refreshCompStatus(g.c));
        updateSimLoader(`${n} ${n===1?'partido simulado':'partidos simulados'}…`, Math.min(96, n*2));
        await simDelay(reduced?0:45);
        if(!did) break;
      }
      updateSimLoader(n?`${n} partidos simulados`:'No había partidos pendientes', 100);
      await simDelay(reduced?0:240);
      await hideSimLoader();
      persist(); render();
      App.toast(n ? `Temporada simulada · ${n} partidos` : 'No quedaban partidos');
    });
  },
  closeSeason(id){
    const l = findLeague(id); if(!l) return;
    if(!leagueSeasonFinished(l)){ App.toast('Todavía faltan partidos por jugar'); return; }
    App.askConfirm('Cerrar la temporada', 'Se aplicarán los ascensos y descensos, y arrancará la temporada siguiente. No se puede deshacer.', ()=>{

      persist();
      ui.promo = {leagueId:l.id, record, nextLabel:seasonName(l), started:!issues.length};
      render();
    });
  },

  /* ----- Simular una copa entera ----- */
  simulateWholeComp(compId){
    const comp = findComp(compId); if(!comp) return;
    App.askConfirm('Simular la copa completa', 'Se jugarán de una vez todas las fechas que falten, con sus resultados definitivos. No se puede deshacer.', async ()=>{
      const reduced = prefersReduced();
      showSimLoader('Simulando la copa…', 'Calculando fechas pendientes…');
      let played = 0, guard = 0;
      while(guard++ < 400){
        const jobs = [];
        const passes = [[comp.rounds, false], [comp.bracket ? comp.bracket.rounds : null, true]];
        for(const [rs, isBr] of passes){
          if(!rs) continue;
          for(let i=0;i<rs.length;i++){
            if(!isRoundUnlocked(comp, i, isBr)) continue;
            let list = [...rs[i]];
            if(isBr && comp.bracket.third && i===rs.length-1) list.push(comp.bracket.third);
            list.forEach(mm=>{ if(!mm.played && !mm.isBye && mm.teamAId && mm.teamBId) jobs.push({mm, isBr}); });
          }
        }
        if(!jobs.length) break;
        let did = false;
        jobs.forEach(({mm,isBr})=>{
          if(runMatch(comp, mm, isBr)){ played++; did = true; if(isBr) propagateWinners(comp.bracket); }
        });
        refreshCompStatus(comp);
        updateSimLoader(`${played} ${played===1?'partido simulado':'partidos simulados'}…`, Math.min(96, played*3));
        await simDelay(reduced?0:45);
        if(!did) break;
      }
      updateSimLoader(played?`${played} partidos simulados`:'No había partidos pendientes', 100);
      await simDelay(reduced?0:240);
      await hideSimLoader();
      persist(); render();
      App.toast(played ? `Se jugaron ${played} ${played===1?'partido':'partidos'}` : 'No quedaban partidos por jugar');
    });
  },

  /* ----- Compartir el resultado ----- */
  async shareMatch(){
    const info = ui.matchInfo || {};
    const {c, m} = findMatchById(ui.selectedCompId, info.matchId, info.isBracket);
    if(!c || !m || !m.played) return;
    const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
    if(!A || !B) return;
    const P = id=>{ const f=id?findPlayerGlobal(id):null; return f?f.player.name:'Jugador'; };
    const lines = [`${A.name} ${m.homeGoals} - ${m.awayGoals} ${B.name}`];
    if(m.penA!=null) lines.push(`Penales: ${m.penA} - ${m.penB}`);
    lines.push(c.name);
    const gls = (m.events||[]).filter(e=>e.type==='gol'||e.type==='gol_penal'||e.type==='autogol');
    if(gls.length){
      lines.push('');
      gls.forEach(e=>{
        const side = (e.creditTeamId||e.teamId)===A.id ? A : B;
        lines.push(`⚽ ${e.display} ${P(e.playerId)}${e.type==='autogol'?' (e/c)':''} — ${side.name}`);
      });
    }
    if(m.motmPlayerId) lines.push(`\n🏅 Figura: ${P(m.motmPlayerId)}`);
    const text = lines.join('\n');
    try{
      if(navigator.share){ await navigator.share({title:'Liga Manager Pro', text}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    try{
      await navigator.clipboard.writeText(text);
      App.toast('Resultado copiado al portapapeles');
    }catch(e){ App.toast('No se pudo compartir en este navegador'); }
  },

  /* ----- Compartir una tabla de posiciones ----- */
  async shareStandings(compId, gi){
    const c = findComp(compId);
    if(!c) return;
    const rows = computeStandings(c, gi==null?undefined:gi);
    if(!rows.length) return;
    const R = compRules(c);
    const title = c.name + (gi!=null && c.groups && c.groups[gi] ? ' · '+c.groups[gi].name : '');
    const lines = [title, ''];
    rows.forEach((r,i)=>{
      const results = teamMatchResults(c, r.teamId, gi==null?undefined:gi);
      lines.push(`${i+1}. ${teamName(r.teamId)} — ${r.pts} pts (PJ ${r.pj}, G ${r.pg}, E ${r.pe}, P ${r.pp}, DG ${r.gf-r.gc}) · Racha: ${results.slice(-5).join('')||'—'}`);
    });
    const text = lines.join('\n');
    try{
      if(navigator.share){ await navigator.share({title:'Liga Manager Pro', text}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    try{
      await navigator.clipboard.writeText(text);
      App.toast('Tabla copiada al portapapeles');
    }catch(e){ App.toast('No se pudo compartir en este navegador'); }
  },

  pcIniciar(clubId){

    data.playerCareer = {
      nombre:'Tu Jugador', clubId, clubNombre:t?t.name:'Club', semana:1,
      jugador:{nivel:60,energia:100,relacionDT:50, confianza:55, moral:70, forma:60, edad:17, posicion:'DEL'},

  pcAbandonar(){ App.askConfirm('Abandonar carrera','Vas a perder el progreso de tu carrera como jugador.',()=>{ data.playerCareer=null; persist(); render(); }); },
  pcEntrenar(){ const pc=data.playerCareer;if(!pc)return; pc.jugador.nivel+=0.6;pc.jugador.energia-=25;pc.jugador.relacionDT+=4;pc.jugador.confianza+=3;pc.jugador.forma+=5;pc.jugador.moral+=2;pcLimitar(pc);pc.log.unshift(`Semana ${pc.semana}: entrenamiento extra. +progreso, -energía.`);persist();render(); },
  pcDescansar(){ const pc=data.playerCareer;if(!pc)return;pc.jugador.energia+=45;pc.jugador.forma+=8;pc.jugador.moral+=4;pc.jugador.confianza-=1;pcLimitar(pc);pc.log.unshift(`Semana ${pc.semana}: descanso. Recuperaste energía y forma.`);persist();render(); },
  pcFiesta(){ const pc=data.playerCareer;if(!pc)return;pc.jugador.energia-=12;pc.jugador.relacionDT-=18;pc.jugador.forma-=8;pc.jugador.moral+=6;pc.log.unshift(`Semana ${pc.semana}: salida nocturna. El DT no quedó precisamente encantado.`);pcLimitar(pc);persist();render(); },
  pcSimular(){
    const pc=data.playerCareer;if(!pc)return; const j=pc.jugador,s=pc.stats;
    if(j.energia<35||j.relacionDT<30){ pc.log.unshift(`Semana ${pc.semana}: no fuiste convocado. El cuerpo técnico pidió más regularidad.`);j.energia+=18;j.forma-=5;pc.semana++;pcLimitar(pc);persist();render();return; }
    const chance=Math.max(.12,Math.min(.88,.25+(j.relacionDT-50)/160+(j.forma-50)/220+(j.nivel-60)/180));
    const played=Math.random()<chance;
    if(!played){pc.log.unshift(`Semana ${pc.semana}: fuiste suplente y no ingresaste.`);j.confianza-=2;j.forma-=3;}
    else {
      const rating=Math.max(5.5,Math.min(9.7,6.1+j.nivel/35+(Math.random()*1.8-.9)+(j.forma-50)/90));
      const goals=(j.posicion==='DEL'&&Math.random()<Math.min(.55,.12+j.nivel/180))?1:((Math.random()<.07)?1:0);
      const assists=Math.random()<Math.min(.32,.08+j.nivel/260)?1:0; const mins=55+Math.floor(Math.random()*36);
      s.apps++;s.starts+=Math.random()<.72?1:0;s.minutes+=mins;s.ratingSum+=rating;s.goals+=goals;s.assists+=assists;
      pc.season.partidos++;pc.season.minutos+=mins;pc.season.goles+=goals;pc.season.asistencias+=assists;
      if(goals||assists){pc.season.racha++;pc.season.mejorRacha=Math.max(pc.season.mejorRacha,pc.season.racha);}else pc.season.racha=0;
      if(rating>=8.3){s.motm++;j.confianza+=7;pc.log.unshift(`Semana ${pc.semana}: ⭐ Figura del partido. ${rating.toFixed(1)} de calificación${goals?' · ⚽ '+goals+' gol':''}${assists?' · 🅰️ '+assists+' asistencia':''}.`);}
      else pc.log.unshift(`Semana ${pc.semana}: jugaste ${mins}' · ${rating.toFixed(1)} de calificación${goals?' · ⚽ '+goals+' gol':''}${assists?' · 🅰️ '+assists+' asistencia':''}.`);
      j.confianza+=rating>=7?4:-3;j.forma-=18;j.energia-=42;j.nivel+=rating>=8?0.45:0.12;
      if(j.nivel>=70&&!pc.achievements.includes('70 OVR'))pc.achievements.push('70 OVR');
      if(s.goals>=10&&!pc.achievements.includes('10 goles'))pc.achievements.push('10 goles');
    }
    if(pc.semana%10===0) j.edad++; if(pc.semana%6===0&&Math.random()<.35) pc.transferInterest=Math.min(100,pc.transferInterest+15);
    j.moral += played?2:-3;pc.semana++;pcLimitar(pc);persist();render();
  },

  buyPlayer(playerId, fromTeamId){
    const ut = userTeam(); if(!ut) return;
    let p, fromTeamObj=null, isFree=false;
    if(fromTeamId){ fromTeamObj = findTeam(fromTeamId); if(!fromTeamObj) return; p = fromTeamObj.players.find(x=>x.id===playerId); }
    else { ensureFreeAgents(); p = data.freeAgents.find(x=>x.id===playerId); isFree=true; }
    if(!p) return;
    const price = isFree ? Math.round(marketValue(p)*0.4/5000)*5000 : askingPrice(p);
    if((ut.budget||0) < price){ App.toast('💸 No te alcanza el presupuesto'); return; }
    App.askConfirm('Fichar a '+p.name, 'Vas a pagar '+money(price,'$')+' por este jugador. ¿Confirmar el fichaje?', ()=>{
      if(isFree) data.freeAgents = data.freeAgents.filter(x=>x.id!==playerId);
      else fromTeamObj.players = fromTeamObj.players.filter(x=>x.id!==playerId);
      ut.budget = (ut.budget||0) - price;
      p.number = nextFreeNumber(ut);
      ut.players.push(p);

    const L=DT.live; if(!L || !L.paused) return;

  },
  dtSetSpeed(v){ const L=DT.live; if(L) L.speed=v; render(); },
  dtSetMentalityLive(mode){
    const L=DT.live; if(!L) return;
    const S = L.ctx.userSide==='home' ? L.H : (L.ctx.userSide==='away' ? L.Aw : null);
    if(!S) return;
    S.mentality = mode;
    const mm = MENT_MUL[mode] || MENT_MUL.equilibrada;
    S.mAtt = mm.att; S.mOpp = mm.opp; S.shifted = true;
    render(); App.toast('📋 Nueva mentalidad: '+mode);
  },
  dtSelectOut(id){ DT.subOut = DT.subOut===id ? null : id; render(); },
  dtSelectIn(id){
    if(!DT.subOut){ App.toast('Primero elegí quién sale'); return; }
    const L=DT.live; if(!L) return;
    const S = L.ctx.userSide==='home' ? L.H : (L.ctx.userSide==='away' ? L.Aw : null);
    if(!S) return;
    if(S.subsUsed>=S.maxSubs){ App.toast('Ya usaste todos los cambios'); return; }
    const outP = S.onPitch.find(p=>p.id===DT.subOut);
    const inP = S.bench.find(p=>p.id===id);
    if(!outP || !inP) return;
    const t = L.moments[Math.max(0,L.idx-1)] || 0;
    applySub(S, outP, inP, t, 'tactico', L.ctx);
    DT.subOut = null;
    render(); App.toast('🔁 Cambio realizado');
  }
};

/* En qué categoría juega y en qué puesto va */
function teamDivisionLineHTML(t){
  const info = teamLeagueInfo(t.id);
  if(!info) return '';
  const c = divisionComp(info.div);
  let pos = '';
  if(c){
    const st = computeStandings(c);
    const i = st.findIndex(r=>r.teamId===t.id);
    if(i>=0 && st[i].pj>0) pos = ` · ${i+1}º con ${st[i].pts} pts`;
  }
  return `<div class="th-line dim"><span style="color:${divColor(info.div.level)}">${divRoman(info.div.level)}</span> ${esc(info.div.name)} · ${esc(info.league.name)}${pos}</div>`;
}
/* El próximo partido que le toca jugar */
function nextMatchOf(teamId){
  let best = null;
  data.competitions.forEach(c=>{
    const add=(m, idx, isBr)=>{
      if(m.played || m.isBye) return;
      if(m.teamAId!==teamId && m.teamBId!==teamId) return;
      const d = roundDate(c, idx);
      if(!best || d < best.date) best = {m, c, isBracket:isBr, date:d, idx};
    };
    (c.rounds||[]).forEach((r,i)=>r.forEach(m=>add(m,i,false)));
    if(c.bracket){ const off=bracketOffset(c); c.bracket.rounds.forEach((r,i)=>r.forEach(m=>add(m,off+i,true))); }
  });
  return best;
}
function nextMatchCardHTML(t){
  const nx = nextMatchOf(t.id);
  if(!nx) return '';
  const rival = nx.m.teamAId===t.id ? findTeam(nx.m.teamBId) : findTeam(nx.m.teamAId);
  if(!rival) return '';
  const local = nx.m.teamAId===t.id;
  return `<div class="card next-up" onclick="App.viewMatch('${nx.c.id}','${nx.m.id}',${nx.isBracket},{screen:'team-detail',selectedTeamId:'${t.id}',teamTab:'partidos'})">
    ${crestSVG(rival.crest,34,rival.id+'nx')}
    <div class="nu-body">
      <div class="nu-lbl">PRÓXIMO PARTIDO · ${esc(formatDateShort(nx.date))}</div>
      <div class="nu-vs">${local?'vs':'visita a'} ${esc(rival.name)}</div>
      <div class="div-sub">${esc(nx.c.name)}${nx.c.season?' · '+esc(nx.c.season):''}</div>
    </div>
    <span class="chev">›</span>
  </div>`;
}
function renderTeamMatches(t){
  const list = teamMatches(t.id);
  const titles = teamTitles(t.id);
  const awards = teamAwards(t.id);
  const lgTitles = leagueTitles(t.id);
  let head = '';
  if(lgTitles.length){
    const byDiv = {};
    lgTitles.forEach(x=>{ const k=x.league.name+' · '+x.division; (byDiv[k]=byDiv[k]||[]).push(x.season); });
    head += `<div class="card" style="padding:10px 12px;margin-bottom:10px;">
      ${Object.entries(byDiv).map(([k,seasons])=>`<div class="kv"><span>🏆 ${esc(k)}</span><b>${seasons.length}<br><span class="dim" style="font-weight:400;font-size:11px;">${esc(seasons.join(', '))}</span></b></div>`).join('')}
    </div>`;
  }
  if(titles.length){
    head += `<h2 class="section-title" style="font-size:19px;">Palmarés</h2><div class="card trophy-cabinet">
      ${titles.map(c=>`<div class="tc-item">${trophySVG(c.trophy,44,'cab'+c.id)}<div class="tc-name">${esc(c.name)}</div>${c.season?`<div class="tc-sub">${esc(c.season)}</div>`:''}</div>`).join('')}
    </div>`;
  }
  if(awards.length){
    const byCur={}; awards.forEach(a=>{ byCur[a.currency]=(byCur[a.currency]||0)+a.amount; });
    head += `<div class="prize-line">💰 Premios ganados: <b>${Object.entries(byCur).map(([c,v])=>money(v,c)).join(' · ')}</b></div>`;
  }
  head = nextMatchCardHTML(t) + head;
  if(!list.length){
    return head + `<div class="empty-state" style="padding:30px 16px;"><span class="em">📅</span><b>Todavía no jugó partidos</b>Cuando simules partidos de una copa o una liga, sus últimos resultados aparecerán acá.</div>`;
  }
  const from = `{screen:'team-detail',selectedTeamId:'${t.id}',teamTab:'partidos'}`;
  const rows = list.slice(0,12).map(x=>{
    const m=x.m; const o=matchOutcomeFor(m,t.id);
    return `<div class="card tm-row" onclick="App.viewMatch('${x.c.id}','${m.id}',${x.isBracket},${from})">
      <div class="tm-top"><span class="fs fs-${o}">${o==='G'?'V':o==='E'?'E':'D'}</span>
        <div class="tm-teams">
          <span class="tm-side">${teamCrestMini(m.teamAId,'tm'+m.id+'a',22)}<span class="${m.teamAId===t.id?'me':''}">${esc(teamName(m.teamAId))}</span></span>
          <span class="tm-score">${m.homeGoals} - ${m.awayGoals}</span>
          <span class="tm-side r"><span class="${m.teamBId===t.id?'me':''}">${esc(teamName(m.teamBId))}</span>${teamCrestMini(m.teamBId,'tm'+m.id+'b',22)}</span>
        </div>
      </div>
      <div class="tm-meta">${esc(x.c.name)} · ${esc(x.label)} · ${formatDateShort(x.date)}${m.penA!=null?` · Penales ${m.penA}-${m.penB}`:''}</div>
    </div>`;
  }).join('');
  return `${head}
    <div class="form-head"><h2 class="section-title" style="margin:0;font-size:19px;">Últimos partidos</h2>${formStrip(t.id,list)}</div>
    ${rows}`;
}
function renderTeamSquad(t){
  const players = [...t.players].sort((a,b)=>(a.number||99)-(b.number||99));
  return `
    <h2 class="section-title">Plantilla (${players.length})</h2>
    <p class="hint">La barra verde es el estado físico: baja con los minutos jugados y se recupera partido a partido. El técnico prioriza a los jugadores enteros y en racha.</p>

App.setCupPalette = function(i){ const p=CUP_PALETTES[i]; ui.draft.style.color=p[0]; ui.draft.style.color2=p[1]; render(); };

function nextMatchDateLabel(c){
  if(c.status==='finalizada') return null;
  if(c.format==='liga' || (c.format==='grupos' && !c.bracket)){
    const idx = (c.rounds||[]).findIndex(r=>r.some(m=>!m.played));
    if(idx<0) return null;
    return 'Próx.: Jornada '+(idx+1)+' · '+formatDateShort(roundDate(c, idx));
  }
  if(!c.bracket) return null;
  const idx = c.bracket.rounds.findIndex(r=>r.some(m=>!m.played && !m.isBye && m.teamAId && m.teamBId));
  if(idx<0) return null;
  return 'Próx.: '+roundName(idx, c.bracket.rounds.length)+' · '+formatDateShort(roundDate(c, bracketOffset(c)+idx));
}

/* ---------- Editor ---------- */
function formatSummary(d){
  const n = d.teamIds.length;
  if(d.format==='liga'){
    if(n<2) return 'Elige al menos 2 equipos.';
    const legs=d.legs||1; const rounds=(n%2?n:n-1)*legs; const matches=n*(n-1)/2*legs;
    return `Todos contra todos · ${rounds} fechas · ${matches} partidos.`;
  }
  if(d.format==='grupos'){
    const opts = possibleGroupCounts(n);
    if(!opts.length) return 'Necesitas al menos 6 equipos (3 por grupo).';
    return `${d.groupsCount} grupos de ${Math.floor(n/d.groupsCount)}-${Math.ceil(n/d.groupsCount)} equipos · pasan ${d.qualify*d.groupsCount} a la llave final.`;
  }
  if(n<2) return 'Elige al menos 2 equipos.';
  const rounds = Math.ceil(Math.log2(n));
  return `${n} equipos · ${rounds} rondas${Math.pow(2,rounds)!==n?' (con pases directos)':''}. Si hay empate se define por penales.`;
}

/* ---------- Detalle ---------- */
function screenCompDetail(){
  const c = findComp(ui.selectedCompId);
  if(!c) return `<div class="empty-state">Copa no encontrada.</div>`;
  let tabs;
  if(c.format==='liga') tabs = [['fixture','Jornadas'],['tabla','Tabla'],['stats','Estadísticas'],['info','Info']];
  else if(c.format==='grupos') tabs = [['fixture','Fechas'],['tabla','Grupos'],['llave','Llave'],['stats','Stats'],['info','Info']];
  else tabs = [['fixture','Llave'],['stats','Estadísticas'],['info','Info']];
  if(!tabs.some(t=>t[0]===ui.compTab)) ui.compTab='fixture';
  let body;
  if(ui.compTab==='stats') body = renderCompStats(c);
  else if(ui.compTab==='info') body = renderCompInfo(c);
  else if(c.format==='liga') body = ui.compTab==='tabla' ? renderStandingsTable(c) : renderLeagueFixture(c);
  else if(c.format==='grupos') body = ui.compTab==='tabla' ? renderGroupTables(c) : ui.compTab==='llave' ? renderBracket(c) : renderLeagueFixture(c);
  else body = renderBracket(c);
  const schedLbl = 'Inicio: '+formatDateShort(roundDate(c,0))+' · '+intervalLabel(c.intervalDays||7);
  return `
    ${c.status==='finalizada' ? championBannerHTML(c) : cupBannerHTML(c,false)}
    <p class="hint" style="margin:8px 0 12px;">📅 ${esc(schedLbl)}</p>
    <div class="seg">${tabs.map(([k,l])=>`<button class="${ui.compTab===k?'active':''}" onclick="App.setCompTab('${k}')">${l}</button>`).join('')}</div>
    ${body}
    ${c.status!=='finalizada' ? `<button class="btn btn-gold" style="margin-top:16px;" onclick="App.simulateWholeComp('${c.id}')">⏩ Simular ${c.leagueId?'toda la división':'la copa completa'}</button>` : ''}
    ${c.leagueId ? `<button class="btn btn-secondary" style="margin-top:12px;" onclick="App.openLeague('${c.leagueId}')">‹ Volver a ${esc((findLeague(c.leagueId)||{}).name||'la liga')}</button>`
      : `<div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-secondary" onclick="App.editCompForm('${c.id}')">Editar copa</button>
      <button class="btn btn-danger" onclick="App.deleteComp('${c.id}')">Eliminar</button>
    </div>`}`;
}

function renderMatchCard(m, c, isBracket, roundIdx, locked){
  const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
  if(m.isBye){ return `<div class="match-card"><div class="bye-note">${esc(teamName(m.teamAId||m.teamBId))} avanza (bye)</div></div>`; }
  if(!A || !B) return `<div class="match-card"><div class="bye-note">Esperando rival…</div></div>`;
  const played = m.played;
  const clasico = A.rivalId && A.rivalId===B.id;
  const grp = (!isBracket && m.group!=null && c.groups && c.groups[m.group]) ? `<div class="grp-tag">${esc(c.groups[m.group].name)}</div>` : '';
  const venue = played && m.venue ? m.venue.name : getStadium(A).name;
  const view = `App.viewMatch('${c.id}','${m.id}',${isBracket})`;
  const wk = played ? matchWinnerKey(m) : null;
  const sc = k=> !wk || wk==='d' ? '' : (wk===k ? ' win' : ' lose');
  return `<div class="match-card${clasico?' clasico':''}" style="--ca:${kitColors(A,null).shirt};--cb:${kitColors(B,A).shirt}">
    ${clasico ? `<div class="clasico-tag">🔥 CLÁSICO</div>` : ''}
    ${grp}
    <div class="match-teams">
      <div class="side${sc('a')}" onclick="App.openTeamFrom('${A.id}')">${teamCrestMini(A.id,c.id+m.id+'a')}<span class="tname">${esc(A.name)}</span></div>
      ${played ? `<div class="score-box" onclick="${view}">${m.homeGoals} - ${m.awayGoals}</div>` : `<div class="vs-box"><span>VS</span></div>`}
      <div class="side right${sc('b')}" onclick="App.openTeamFrom('${B.id}')"><span class="tname">${esc(B.name)}</span>${teamCrestMini(B.id,c.id+m.id+'b')}</div>
    </div>
    ${played && m.penA!=null ? `<div class="pen-note">Penales: ${m.penA} - ${m.penB}</div>` : ''}
    <div class="mc-venue">🏟️ ${esc(venue)}</div>
    <div class="actions">
      ${played ? `<button class="btn btn-secondary" onclick="${view}">Ver detalle y puntuaciones</button>`
        : locked ? `<button class="btn btn-secondary" disabled>🔒 Termina la fecha anterior</button>`
        : `<button class="btn btn-secondary" onclick="${view}">Alineaciones</button><button class="btn btn-primary" onclick="App.simulateMatch('${c.id}','${m.id}')">▶ Simular</button>`}
    </div>
  </div>`;
}
function renderLeagueFixture(c){
  const label = c.format==='grupos' ? 'Fecha' : 'Jornada';
  return c.rounds.map((round, idx)=>{
    const hasUnplayed = round.some(m=>!m.played);
    const unlocked = isRoundUnlocked(c, idx, false);
    return `
      <div class="jornada-header">
        <span class="jornada-label">${label} ${idx+1} · ${formatDateShort(roundDate(c, idx))}</span>
        ${hasUnplayed ? (unlocked ? `<button class="batch-btn" onclick="App.simulateFullRound('${c.id}',${idx}, false)">▶ Simular fecha</button>` : `<span class="lock-chip">🔒 Bloqueada</span>`) : `<span class="lock-chip done">✓ Jugada</span>`}
      </div>
      ${round.map(m=>renderMatchCard(m, c, false, idx, !unlocked)).join('')}`;
  }).join('');
}
/* ---------- Detalles extra de tabla: racha, cambio de posición, rendimiento ---------- */
function prevPositionsMap(c, gi){
  const rounds = c.rounds||[];
  let K = 0;
  while(K<rounds.length && rounds[K].length && rounds[K].every(m=>m.played||m.isBye)) K++;
  if(K<2) return null;
  const prevComp = Object.assign({}, c, {rounds: rounds.slice(0,K-1)});
  const prevRows = computeStandings(prevComp, gi);
  const map = {};
  prevRows.forEach((r,i)=>{ map[r.teamId] = i+1; });
  return map;
}
function teamMatchResults(c, teamId, gi){
  return (c.rounds||[]).flat().filter(m=>m.played && !m.isBye && (gi==null || m.group===gi) && (m.teamAId===teamId || m.teamBId===teamId)).map(m=>{
    const isA = m.teamAId===teamId;
    const gf = isA ? m.homeGoals : m.awayGoals, gc = isA ? m.awayGoals : m.homeGoals;
    return gf>gc ? 'G' : gf<gc ? 'P' : 'E';
  });
}
function formDotsHTML(results){
  const last = results.slice(-5);
  if(!last.length) return `<span class="form-none">—</span>`;
  const meta = {G:['G','ok','Ganado'], E:['E','dr','Empate'], P:['P','lo','Perdido']};
  return `<div class="form-dots">${last.map(r=>{ const [l,cls,title] = meta[r]; return `<span class="fdot ${cls}" title="${title}">${l}</span>`; }).join('')}</div>`;
}
function streakBadgeHTML(results){
  if(results.length<3) return '';
  let winStreak = 0;
  for(let i=results.length-1;i>=0;i--){ if(results[i]==='G') winStreak++; else break; }
  if(winStreak>=3) return `<span class="streak-badge hot" title="${winStreak} victorias seguidas">🔥${winStreak}</span>`;
  let unbeaten = 0;
  for(let i=results.length-1;i>=0;i--){ if(results[i]!=='P') unbeaten++; else break; }
  if(unbeaten>=5) return `<span class="streak-badge safe" title="${unbeaten} partidos invicto">🛡️${unbeaten}</span>`;
  return '';
}
function posDeltaHTML(prevMap, teamId, currentPos){
  if(!prevMap || prevMap[teamId]==null) return `<span class="pos-delta na">•</span>`;
  const diff = prevMap[teamId] - currentPos;
  if(diff>0) return `<span class="pos-delta up" title="Subió ${diff} puesto${diff===1?'':'s'}">▲${diff}</span>`;
  if(diff<0) return `<span class="pos-delta down" title="Bajó ${Math.abs(diff)} puesto${Math.abs(diff)===1?'':'s'}">▼${Math.abs(diff)}</span>`;
  return `<span class="pos-delta same" title="Sin cambios">–</span>`;
}
function rendPct(row, R){
  if(!row.pj) return '—';
  const max = row.pj * R.pointsWin;
  return max ? Math.round(row.pts/max*100)+'%' : '—';
}
function standingsHeadRow(){
  return `<tr><th>#</th><th style="text-align:left">Equipo</th><th>Racha</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th><th>Rend.</th></tr>`;
}
function standingsRowHTML(c, r, i, gi, prevMap, rowClass, crestPrefix){
  const results = teamMatchResults(c, r.teamId, gi);
  return `<tr class="${rowClass||''}">
    <td class="pos-cell">${i+1}${posDeltaHTML(prevMap, r.teamId, i+1)}</td>
    <td class="team-cell" onclick="App.openTeamFrom('${r.teamId}')">${teamCrestMini(r.teamId,crestPrefix+i+c.id)}${esc(teamName(r.teamId))}${streakBadgeHTML(results)}</td>
    <td>${formDotsHTML(results)}</td>
    <td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td><b>${r.pts}</b></td>
    <td>${rendPct(r, compRules(c))}</td>
  </tr>`;
}
function shareStandingsBtnHTML(compId, gi){
  return `<button class="btn btn-secondary share-standings-btn" onclick="App.shareStandings('${compId}', ${gi==null?'null':gi})">📤 Compartir tabla</button>`;
}
function standingsTableHTML(c, rows, qualify, podium, gi){
  const prevMap = prevPositionsMap(c, gi);
  const body = rows.map((r,i)=> standingsRowHTML(c, r, i, gi, prevMap, `${i<qualify?'pos1':''}${podium && i===1 ? ' pos2':''}`, 'st')).join('');
  return `<div class="card" style="overflow-x:auto;"><table class="standings">
    <thead>${standingsHeadRow()}</thead>
    <tbody>${body}</tbody>
  </table></div>${shareStandingsBtnHTML(c.id, gi==null?null:gi)}`;
}
/* ---------- Carrera por posiciones ---------- */
function positionHistory(c){
  const rounds = c.rounds||[]; let K = 0;
  while(K<rounds.length && rounds[K].length && rounds[K].every(m=>m.played||m.isBye)) K++;
  const hist = {}; (c.teamIds||[]).forEach(id=>{ hist[id] = []; });
  for(let k=1;k<=K;k++){
    const sub = Object.assign({}, c, {rounds: rounds.slice(0,k)});
    computeStandings(sub).forEach((r,i)=>{ if(hist[r.teamId]) hist[r.teamId].push({pos:i+1, pts:r.pts}); });
  }
  return {K, hist};
}
function isDarkUI(){ return ui.theme==='dark' || (ui.theme==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function lineColorFor(t){
  const dark = isDarkUI();
  const ok = h=>{ if(!h) return false; const L = luminance(h); return dark ? L>0.09 : L<0.72; };
  const cr = t.crest||{};
  if(ok(cr.bg)) return cr.bg;
  if(ok(cr.bg2)) return cr.bg2;
  return dark ? '#C9D3DC' : '#6B7280';
}
App.focusChartTeam = function(compId, teamId){
  ui.chartFocus = ui.chartFocus || {};
  ui.chartFocus[compId] = ui.chartFocus[compId]===teamId ? null : teamId;
  const c = findComp(compId), box = el('pcw_'+compId);
  if(c && box) box.innerHTML = positionChartInner(c);
};
function positionChartHTML(c){
  if(!c || c.format!=='liga' || (c.teamIds||[]).length<3) return '';
  return `<div class="card pc-card" id="pcw_${c.id}">${positionChartInner(c)}</div>`;
}
function positionChartInner(c){
  const {K, hist} = positionHistory(c);
  const head = `<div class="sec-head"><b>📈 Carrera por posiciones</b><span>${K} ${K===1?'fecha':'fechas'}</span></div>`;
  if(K<2) return head + `<p class="hint" style="margin:0;">El gráfico aparece cuando se completan 2 fechas.</p>`;
  const ids = (c.teamIds||[]).filter(id=>findTeam(id) && hist[id] && hist[id].length===K);
  const n = ids.length; if(n<3) return '';
  const focus = (ui.chartFocus||{})[c.id] || null;
  const W = 360, L = 22, R = 34, T = 12, B = 22;
  const rowH = n<=10 ? 22 : n<=14 ? 19 : 16;
  const H = T + (n-1)*rowH + B;
  const pw = W-L-R;
  const X = k=> L + k*pw/(K-1);
  const Y = p=> T + (p-1)*rowH;
  const lg = c.leagueId ? findLeague(c.leagueId) : null;
  const dv = lg ? (lg.divisions||[]).find(d=>d.id===c.divisionId) : null;
  const zones = dv ? divisionZones(lg, dv, n) : {0:'z-camp'};
  const zc = {'z-camp':'#C6941B','z-asc':'#1B9E5A','z-des':'#D6293A','z-pl':'#1D8FE1'};
  let g = '';
  for(let p=1;p<=n;p++){
    const z = zones[p-1];
    if(z && zc[z]) g += `<rect x="${L}" y="${(Y(p)-rowH/2).toFixed(1)}" width="${pw}" height="${rowH}" fill="${zc[z]}" opacity="0.13"/>`;
    g += `<line class="pc-grid" x1="${L}" x2="${L+pw}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}"/><text x="${L-6}" y="${(Y(p)+3).toFixed(1)}" text-anchor="end">${p}</text>`;
  }
  const step = Math.max(1, Math.ceil(K/9));
  for(let k=0;k<K;k+=step) g += `<text x="${X(k).toFixed(1)}" y="${H-7}" text-anchor="middle">${k+1}</text>`;
  const order = ids.filter(id=>id!==focus).concat(focus && ids.indexOf(focus)>=0 ? [focus] : []);
  order.forEach(id=>{
    const t = findTeam(id), col = lineColorFor(t), isF = id===focus;
    const pts = hist[id].map((h,k)=>`${X(k).toFixed(1)},${Y(h.pos).toFixed(1)}`).join(' ');
    g += `<polyline class="pc-line" points="${pts}" stroke="${col}" stroke-width="${isF?3.2:1.6}" opacity="${focus ? (isF?1:0.16) : 0.85}"/>`;
    if(isF) hist[id].forEach((h,k)=>{ g += `<circle cx="${X(k).toFixed(1)}" cy="${Y(h.pos).toFixed(1)}" r="2.6" fill="${col}"/>`; });
  });
  ids.forEach(id=>{
    const t = findTeam(id), p = hist[id][K-1].pos, dim = focus && id!==focus;
    const cs = crestSVG(t.crest, 16, 'pc'+c.id+id).replace('<svg ', `<svg x="${W-R+8}" y="${(Y(p)-8).toFixed(1)}" `);
    g += `<g style="cursor:pointer" opacity="${dim?0.35:1}" onclick="App.focusChartTeam('${c.id}','${id}')"><rect x="${W-R+4}" y="${(Y(p)-rowH/2).toFixed(1)}" width="${R-2}" height="${rowH}" fill="transparent"/>${cs}</g>`;
  });
  const byPos = [...ids].sort((a,b)=>hist[a][K-1].pos-hist[b][K-1].pos);
  const legend = byPos.map(id=>`<button type="button" class="pc-chip ${id===focus?'on':''}" onclick="App.focusChartTeam('${c.id}','${id}')">${teamCrestMini(id,'pl'+c.id+id,16)}${hist[id][K-1].pos}º ${esc(teamName(id))}</button>`).join('');
  let note;
  if(focus && hist[focus]){
    const ps = hist[focus].map(h=>h.pos), best = Math.min.apply(null, ps), worst = Math.max.apply(null, ps);
    note = `<b>${esc(teamName(focus))}</b>: va ${ps[K-1]}º · mejor puesto ${best}º (fecha ${ps.indexOf(best)+1}) · peor puesto ${worst}º.`;
  } else {
    const lead = {}; ids.forEach(id=>{ lead[id] = hist[id].filter(h=>h.pos===1).length; });
    const top = [...ids].sort((a,b)=>lead[b]-lead[a])[0];
    note = (lead[top]>0 ? `Más fechas en la cima: <b>${esc(teamName(top))}</b> (${lead[top]}). ` : '') + 'Toca un escudo para seguir a un equipo.';
  }
  return head + `<svg viewBox="0 0 ${W} ${H}" class="pc-svg" role="img" aria-label="Evolución de posiciones fecha a fecha">${g}</svg>
    <div class="pc-legend">${legend}</div><p class="pc-note">${note}</p>`;
}
function renderStandingsTable(c){ return standingsTableHTML(c, computeStandings(c), 1, true) + positionChartHTML(c); }
function renderGroupTables(c){
  return c.groups.map((g,gi)=>`<h2 class="section-title" style="font-size:19px;margin:14px 0 8px;">${esc(g.name)}</h2>${standingsTableHTML(c, computeStandings(c,gi), c.qualify||2, false, gi)}`).join('')
    + `<p class="hint">Los equipos resaltados avanzan a la llave final.</p>`;
}
function bracketMatchHTML(c, m, idx, locked){

  const aWin = m.played && m.winnerId===m.teamAId, bWin = m.played && m.winnerId===m.teamBId;
  const view = `App.viewMatch('${c.id}','${m.id}',true)`;
  return `<div class="bracket-match">
    <div class="bracket-side ${aWin?'winner':''}"><span onclick="App.openTeamFrom('${m.teamAId}')">${teamCrestMini(m.teamAId,'br'+m.id+'a')} ${esc(teamName(m.teamAId))}</span><span class="g">${m.played?m.homeGoals:''}</span></div>
    <div class="bracket-vs-line"></div>
    <div class="bracket-side ${bWin?'winner':''}"><span onclick="App.openTeamFrom('${m.teamBId}')">${teamCrestMini(m.teamBId,'br'+m.id+'b')} ${esc(teamName(m.teamBId))}</span><span class="g">${m.played?m.awayGoals:''}</span></div>
    ${m.played && m.penA!=null ? `<div class="pen-note">Penales: ${m.penA} - ${m.penB}</div>` : ''}
    <div class="mc-venue">🏟️ ${esc(m.played&&m.venue ? m.venue.name : getStadium(findTeam(m.teamAId)).name)}</div>
    <div class="actions" style="margin-top:8px;">
      ${m.played ? `<button class="btn btn-secondary" onclick="${view}">Ver detalle y puntuaciones</button>`
        : locked ? `<button class="btn btn-secondary" disabled>🔒 Termina la ronda anterior</button>`
        : `<button class="btn btn-secondary" onclick="${view}">Alineaciones</button><button class="btn btn-primary" onclick="App.simulateMatch('${c.id}','${m.id}')">▶ Simular</button>`}
    </div>
  </div>`;
}
function renderBracket(c){
  if(!c.bracket) return `<div class="empty-state" style="padding:28px 16px;"><span class="em">🧩</span><b>La llave final se define al terminar la fase de grupos</b>Cuando se juegue la última fecha, los clasificados se cruzan automáticamente.</div>`;
  const rounds = c.bracket.rounds;
  const off = bracketOffset(c);
  return rounds.map((round, idx)=>{
    const unlocked = isRoundUnlocked(c, idx, true);
    const isLast = idx===rounds.length-1;
    const list = round.concat(isLast && c.bracket.third ? [c.bracket.third] : []);
    const hasUnplayed = list.some(m=>!m.played && !m.isBye && m.teamAId && m.teamBId);
    const canSim = list.some(m=>!m.played && !m.isBye && m.teamAId && m.teamBId);
    return `
      <div class="round-block">
        <div class="round-title">
          <span>${roundName(idx, rounds.length)} <span style="font-size:12px;font-weight:500;color:var(--text-dim);">· ${formatDateShort(roundDate(c, off+idx))}</span></span>
          ${hasUnplayed && canSim ? (unlocked ? `<button class="batch-btn" onclick="App.simulateFullRound('${c.id}',${idx}, true)">▶ Simular ronda</button>` : `<span class="lock-chip">🔒 Bloqueada</span>`) : ''}
        </div>
        ${round.map(m=>bracketMatchHTML(c, m, idx, !unlocked)).join('')}
        ${isLast && c.bracket.third ? `<div class="third-title">🥉 Partido por el tercer puesto</div>${bracketMatchHTML(c, c.bracket.third, idx, !unlocked)}` : ''}
      </div>`;
  }).join('');
}

/* ---------- Info: normas, premios, bajas ---------- */
function renderCompInfo(c){
  const R = compRules(c), P = c.prize||{}, cur = P.currency||'$';
  const kv = (k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  const tbLbl = {dg:'Diferencia de gol', gf:'Goles a favor', h2h:'Enfrentamiento directo', fairplay:'Fair play'}[R.tiebreak]||'Diferencia de gol';
  let fmt = kv('Formato', formatLabel(c)) + kv('Equipos', c.teamIds.length);
  if(c.format==='grupos') fmt += kv('Grupos', c.groups.length) + kv('Clasifican por grupo', c.qualify||2);
  if(c.format!=='liga') fmt += kv('Tercer puesto', c.thirdPlace || (c.bracket&&c.bracket.third) ? 'Sí' : 'No');
  const rules = (c.format!=='eliminacion' ? kv('Puntos', `${R.pointsWin} por victoria · ${R.pointsDraw} por empate`) + kv('Desempate', tbLbl) : '')
    + kv('Cambios por partido', R.maxSubs) + kv('VAR', R.varOn?'Activado':'Desactivado')
    + kv('Suspensión por roja', R.redBan ? R.redBan+(R.redBan===1?' partido':' partidos') : 'Sin sanción')
    + kv('Amarillas acumuladas', R.yellowLimit ? R.yellowLimit+' = 1 partido' : 'No suspende')
    + kv('Lesionados', R.injuryAbsence ? 'Se pierden 1–3 partidos' : 'Vuelven de inmediato');
  const prizes = [['🥇 Campeón',P.champion],['🥈 Subcampeón',P.runnerUp],['🥉 Tercer puesto',P.third],['⚽ Goleador',P.topScorer],['🎟️ Participación (cada uno)',P.participation]].filter(x=>x[1]>0);
  const prizeHtml = prizes.length ? prizes.map(([k,v])=>kv(k, money(v,cur))).join('') + kv('Total en juego', money(prizePool(c),cur)) : `<div class="hint" style="margin:0;">Esta copa no reparte premios.</div>`;
  let results = '';
  if(c.results){
    const r = c.results;
    const byTeam = {}; r.awards.forEach(a=>{ (byTeam[a.teamId] = byTeam[a.teamId]||{total:0, labels:[]}); byTeam[a.teamId].total+=a.amount; if(a.label!=='Participación') byTeam[a.teamId].labels.push(a.label); });
    const rows = Object.entries(byTeam).sort((a,b)=>b[1].total-a[1].total);
    results = `<h2 class="section-title" style="font-size:19px;margin-top:20px;">Premios entregados</h2><div class="card stat-list">
      ${rows.length ? rows.map(([tid,info],i)=>`<div class="stat-row"><div class="stat-rank">${i+1}</div><div class="nm"><div class="n">${teamCrestMini(tid,'aw'+i,20)} ${esc(r.names&&r.names[tid]||teamName(tid))}</div><div class="t">${esc(info.labels.join(' · ')||'Participación')}</div></div><div class="stat-val" style="font-size:17px;">${money(info.total,r.currency)}</div></div>`).join('') : `<div class="hint" style="margin:8px;">Sin premios.</div>`}
    </div>`;
  }
  const un = Object.entries(c.unavail||{}).filter(([,v])=>v.games>0);
  const bajas = un.length ? `<h2 class="section-title" style="font-size:19px;margin-top:20px;">Bajas actuales</h2><div class="card">
    ${un.map(([pid,v])=>{ const f=findPlayerGlobal(pid); return `<div class="kv"><span>${v.type==='susp'?'🟥':'🩹'} ${esc(f?f.player.name:'Jugador')} <em class="dim">· ${esc(f?f.team.name:'')}</em></span><b>${v.games} ${v.games===1?'partido':'partidos'}</b></div>`; }).join('')}</div>` : '';
  return `
    <h2 class="section-title" style="font-size:19px;">Formato</h2><div class="card kv-card">${fmt}</div>
    <h2 class="section-title" style="font-size:19px;margin-top:20px;">Normas</h2><div class="card kv-card">${rules}</div>
    <h2 class="section-title" style="font-size:19px;margin-top:20px;">Premios</h2><div class="card kv-card">${prizeHtml}</div>
    ${results}${bajas}`;
}

/* ---------- Creador de ligas ---------- */
function blankDivision(level, name){
  return {
    id: uid(), level, name: name || ('División '+level),
    teamIds: [], size: 10, format:'liga', legs:1, groupsCount:2, qualify:2, thirdPlace:false,
    relegate: 0, trophy: defaultTrophy(), prize: Object.assign({}, DEFAULT_PRIZE)
  };
}
function divisionSummary(l, d){
  const n = (d.teamIds||[]).length || divisionTargetSize(d);
  if(d.format==='grupos'){
    const g = d.groupsCount||2, q = d.qualify||2;
    if(n<g*3) return `Necesitas al menos ${g*3} equipos.`;
    const per = Math.floor(n/g);
    const rounds = (per%2?per:per-1)*(d.legs||1);
    return `${g} grupos de ${per} · ${rounds} fechas · pasan ${q} por grupo (${q*g} al playoff) · hay un campeón.`;
  }
  if(n<4) return 'Necesitas al menos 4 equipos.';
  const legs = d.legs||1;
  return `Todos contra todos · ${(n%2?n:n-1)*legs} fechas · ${n*(n-1)/2*legs} partidos · campeón el primero de la tabla.`;
}
