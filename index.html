  .match-teams .side.win .tname{ font-weight:800; }
  .match-teams .side.lose{ opacity:.62; }
  .vs-box{ min-width:54px; display:flex; align-items:center; justify-content:center; }
  .vs-box span{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; font-family:var(--font-display); font-size:18px; letter-spacing:1px;
    background:var(--glass-bg); border:1px solid var(--glass-edge); box-shadow:var(--glass-hi), 0 6px 14px -8px var(--shadow); color:var(--text-dim); }
  .score-box{ cursor:pointer; min-width:70px; padding:4px 10px; border-radius:14px; font-variant-numeric:tabular-nums; letter-spacing:1.5px;
    background:var(--glass-strong); border:1px solid var(--glass-edge); box-shadow:var(--glass-hi), 0 8px 18px -10px var(--shadow); transition:transform .25s var(--ease-spring); }
  .score-box:active{ transform:scale(.94); }
  .mc-venue{ opacity:.85; }
  .jornada-header{ padding:6px 2px 0; }
  .jornada-label{ display:inline-flex; align-items:center; gap:8px; }
  .jornada-label::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--grad-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .bracket-side.winner{ background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent); border-radius:8px; padding-left:6px; padding-right:6px; }

  /* Marcador estilo transmisión */
  .scoreboard{
    position:relative; overflow:hidden; border-radius:24px; padding:16px 14px 18px; isolation:isolate;
    background:var(--glass-strong); border:1px solid var(--glass-edge);
    box-shadow:0 24px 50px -24px rgba(0,0,0,.55), var(--glass-hi);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  }
  .scoreboard > *:not(.goal-fx):not(.sb-glow):not(.sb-flash){ position:relative; z-index:1; }
  .sb-glow{ position:absolute; inset:-20%; z-index:0; pointer-events:none; opacity:.55;
    background:
      radial-gradient(38% 50% at 18% 58%, color-mix(in srgb, var(--ca) 60%, transparent), transparent 70%),
      radial-gradient(38% 50% at 82% 58%, color-mix(in srgb, var(--cb) 60%, transparent), transparent 70%);
    animation:sbBreath 7s ease-in-out infinite alternate; }
  @keyframes sbBreath{ from{ transform:scale(1); opacity:.42; } to{ transform:scale(1.08); opacity:.62; } }
  .sb-flash{ position:absolute; top:50%; width:340px; height:340px; margin:-170px 0 0 -170px; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle, var(--fc) 0%, color-mix(in srgb, var(--fc) 40%, transparent) 30%, transparent 65%); animation:sbFlash 1.3s ease-out forwards; }
  @keyframes sbFlash{ 0%{ opacity:0; transform:scale(.3);} 20%{ opacity:.95;} 100%{ opacity:0; transform:scale(1.6);} }
  .scoreboard .teams{ gap:10px; }
  .scoreboard .tside > svg, .scoreboard .tside > img{ filter:drop-shadow(0 8px 12px rgba(0,0,0,.3)); animation:crestFloat 4.5s ease-in-out infinite; transition:filter .5s ease, transform .5s ease; }
  .scoreboard .tside:last-child > svg, .scoreboard .tside:last-child > img{ animation-delay:-2.2s; }
  @keyframes crestFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .scoreboard .tside{ transition:opacity .6s ease, filter .6s ease; }
  .scoreboard .tside.lose{ opacity:.55; filter:saturate(.55); }
  .scoreboard .tside.win > svg, .scoreboard .tside.win > img{ filter:drop-shadow(0 0 14px color-mix(in srgb, var(--gold) 80%, transparent)) drop-shadow(0 8px 12px rgba(0,0,0,.3)); }
  .scoreboard .tside.win .tname::after{ content:'🏆'; margin-left:5px; display:inline-block; animation:gfxCrest .8s var(--ease-spring) both; }
  .scoreboard .score{ font-size:50px; line-height:1; font-variant-numeric:tabular-nums; min-width:34px; text-align:center; text-shadow:0 6px 18px var(--shadow); }
  .scoreboard .sb-dash{ font-family:var(--font-display); font-size:30px; color:var(--text-dim); opacity:.7; }
  .matchclock-row{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .matchclock{ display:inline-block; padding:2px 16px; border-radius:12px; font-size:30px; background:var(--surface-2); border:1px solid var(--glass-edge); box-shadow:var(--glass-hi); }
  .phase-label{ letter-spacing:1.4px; }
  .live-badge{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:1.2px; color:#fff; padding:3px 10px 3px 8px; border-radius:999px;
    background:linear-gradient(135deg,#FF4D5E,#C81E35); box-shadow:0 6px 16px -6px rgba(214,41,58,.8); }
  .live-badge i{ width:7px; height:7px; border-radius:50%; background:#fff; animation:liveDot 1.1s ease-in-out infinite; }
  .live-badge.ended{ background:linear-gradient(135deg,#5B6B63,#3A4741); box-shadow:none; }
  .live-badge.ended i{ animation:none; opacity:.6; }
  @keyframes liveDot{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.35; transform:scale(.7);} }
  .scoreboard.tense{ animation:tensePulse 1.8s ease-in-out infinite; }
  @keyframes tensePulse{ 0%,100%{ box-shadow:0 24px 50px -24px rgba(0,0,0,.55), 0 0 0 0 rgba(214,41,58,0); } 50%{ box-shadow:0 24px 50px -24px rgba(0,0,0,.55), 0 0 0 4px rgba(214,41,58,.35), 0 0 30px rgba(214,41,58,.35); } }
  .clock-track{ height:5px; background:var(--surface-2); }
  .clock-track i{ background:var(--grad-primary); box-shadow:0 0 10px var(--accent); }
  .mom-wrap{ height:8px; opacity:.4; border-radius:8px; }
  .mom-wrap i{ width:4px; margin-left:-2px; background:#fff; box-shadow:0 0 10px 2px rgba(255,255,255,.8); opacity:1; }
  .poss-bar{ height:12px; border-radius:999px; border:1px solid var(--glass-edge); box-shadow:inset 0 1px 3px rgba(0,0,0,.15); gap:2px; background:var(--surface-2); }
  .poss-bar i{ position:relative; overflow:hidden; }
  .poss-bar i:first-child{ border-radius:999px 0 0 999px; } .poss-bar i:last-child{ border-radius:0 999px 999px 0; }
  .poss-bar i::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.35), transparent 60%); }
  .ls-box{ border-radius:16px; padding:9px 4px; transition:transform .3s var(--ease-spring); }
  .ls-box .lv{ font-variant-numeric:tabular-nums; }
  .ls-box.bump{ animation:lsBump .5s var(--ease-spring); }
  @keyframes lsBump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.08); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), var(--glass-shadow);} 100%{ transform:scale(1);} }
  .commentary{ border-radius:16px; position:relative; overflow:hidden; padding-left:16px; }
  .commentary::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--grad-primary); }
  .commentary.flash{ animation:cmFlash .7s var(--ease-out); }
  @keyframes cmFlash{ 0%{ transform:translateY(4px); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent), var(--glass-shadow); } 100%{ transform:none; } }
  .commentary.flash .cm-tx{ animation:cmText .45s var(--ease-out) both; }
  @keyframes cmText{ from{ opacity:0; transform:translateX(8px); filter:blur(3px); } }
  .speed-row{ padding:6px; border-radius:16px; background:var(--surface-2); border:1px solid var(--glass-edge); }

  /* Línea de tiempo de incidencias */
  .event-row{ position:relative; border-bottom:none; padding:9px 8px 9px 6px; border-radius:14px; margin:2px 0; }
  .event-row::before{ content:''; position:absolute; left:63px; top:0; bottom:0; width:2px; background:linear-gradient(180deg, transparent, var(--border) 20%, var(--border) 80%, transparent); }
  .event-row .event-ic{ position:relative; z-index:1; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:14px;
    background:var(--glass-strong); border:1px solid var(--glass-edge); box-shadow:0 4px 10px -6px var(--shadow), 0 0 0 2px var(--tc, transparent); }
  .event-row .event-min{ font-variant-numeric:tabular-nums; text-align:right; padding-right:2px; }
  .event-row.big{ background:linear-gradient(90deg, color-mix(in srgb, var(--tc, var(--accent)) 20%, transparent), transparent 75%); border:1px solid color-mix(in srgb, var(--tc, var(--accent)) 25%, transparent); }
  .event-row.big .event-ic{ box-shadow:0 0 0 2px var(--tc, var(--accent)), 0 0 16px -2px var(--tc, var(--accent)); }
  .event-row.ev-in{ animation:evIn .5s var(--ease-out) both; }
  .event-row.ev-in.big{ animation:evInBig .7s var(--ease-spring) both; }
  @keyframes evIn{ from{ opacity:0; transform:translateX(-16px); filter:blur(3px);} to{ opacity:1; transform:none; filter:none;} }
  @keyframes evInBig{ 0%{ opacity:0; transform:scale(.9) translateY(10px);} 60%{ opacity:1; transform:scale(1.02);} 100%{ transform:none;} }
  .half-divider{ display:flex; align-items:center; gap:10px; }
  .half-divider::before, .half-divider::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--border), transparent); }

  /* Overlays de gol con panel de vidrio */
  .goal-fx .gfx-who{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:4px 14px; margin-top:8px;

  .goal-fx .gfx-title{ text-shadow:0 4px 0 rgba(0,0,0,.2), 0 0 30px rgba(255,255,255,.35); }

  /* ---------- Splash de vidrio ---------- */
  #splash{ background:radial-gradient(circle at 30% 20%, #23A866 0%, transparent 45%), radial-gradient(circle at 80% 80%, #1C6FB8 0%, transparent 45%), linear-gradient(160deg,#0E4D2B,#06130D); }
  #splash .splash-badge{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); padding:10px; border-radius:30px;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 20px 50px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  #splash .splash-badge img{ border-radius:20px; }
  #splash .splash-title{ background:linear-gradient(90deg,#fff 20%,#B9F5D3 50%,#fff 80%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:splashFade .6s ease .28s both, titleShine 2.4s linear .8s infinite; }
  @keyframes titleShine{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
  #splash.splash-out{ transform:scale(1.06); filter:blur(6px); transition:opacity .55s ease, visibility .55s ease, transform .55s ease, filter .55s ease; }

  /* ---------- Modo liviano y accesibilidad ---------- */
  html.lite-glass .card, html.lite-glass .match-card, html.lite-glass .form-sec, html.lite-glass .bracket-match, html.lite-glass .award-card,
  html.lite-glass .ls-box, html.lite-glass .commentary, html.lite-glass .team-chip, html.lite-glass .btn-secondary, html.lite-glass .chip,
  html.lite-glass .seg, html.lite-glass .form-group input, html.lite-glass .form-group select, html.lite-glass .pick{
    -webkit-backdrop-filter:none; backdrop-filter:none; }
  html.lite-glass #bgFx i{ animation:none; }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    :root{ --surface:rgba(255,255,255,.92); --glass-bg:linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.88)); }
  }
  @media (prefers-reduced-transparency: reduce){
    #bgFx{ display:none; }

  @media (prefers-reduced-motion: reduce){
    #bgFx i, .sb-glow, .scoreboard .tside > svg, .scoreboard .tside > img, .cup-banner::after, .motm-card::after, .motm-card .em,
    .clasico-tag, .live-badge i, .sim-loader-bar i::after, header.topbar h1, #splash .splash-title{ animation:none !important; }
    #app.scr-fwd, #app.scr-back, #app.scr-tab, #app.scr-sub, .stg, .event-row.ev-in, .event-row.ev-in.big, .ls-box.bump,
    .confirm-overlay, .confirm-sheet, .toast, .sb-flash, nav.tabbar button .ic.bounce, #app.is-entering *{ animation:none !important; }
    .rv{ opacity:1 !important; transform:none !important; transition:none !important; }
    .rp{ display:none; }
    nav.tabbar .tab-indicator{ transition:none; }
  }
  .chip, .sp-chip, .seg button, .icon-btn, .batch-btn, .toggle-row button{ position:relative; overflow:hidden; }
  .search-wrap .si{ z-index:2; }
  .goal-fx{ border-radius:inherit; }
</style>
</head>

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shade(hex, percent){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let f=parseInt(hex,16), t=percent<0?0:255, p=Math.abs(percent)/100;
  let R=(f>>16)&255, G=(f>>8)&255, B=f&255;
  const nr=Math.round((t-R)*p)+R, ng=Math.round((t-G)*p)+G, nb=Math.round((t-B)*p)+B;
  return "#"+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
}
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
const WEEKDAY_SHORT = ['dom','lun','mar','mié','jue','vie','sáb'];
const MONTH_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function roundDate(comp, roundIdx){
  const parts = (comp.startDate||todayISO()).split('-').map(Number);
  const base = new Date(parts[0], parts[1]-1, parts[2]);
  base.setDate(base.getDate() + roundIdx*(comp.intervalDays||7));
  return base;
}
function formatDateShort(d){
  return WEEKDAY_SHORT[d.getDay()]+', '+d.getDate()+' '+MONTH_SHORT[d.getMonth()];
}
function intervalLabel(days){
  if(days===1) return 'una jornada por día';
  if(days===7) return 'una jornada por semana';
  if(days===14) return 'una jornada cada 2 semanas';
  return 'una jornada cada '+days+' días';
}
function pickWeighted(list, weightFn){
  if(!list.length) return null;
  const weights = list.map(weightFn);
  const total = weights.reduce((a,b)=>a+b,0);
  if(total<=0) return list[Math.floor(Math.random()*list.length)];
  let r = Math.random()*total;
  for(let i=0;i<list.length;i++){ r-=weights[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}

function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function hexRgb(hex){ hex=String(hex||'#000000').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16)||0; return [(n>>16)&255,(n>>8)&255,n&255]; }
function luminance(hex){
  const [r,g,b]=hexRgb(hex).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrastText(hex){ return luminance(hex)>0.42 ? '#14201A' : '#FFFFFF'; }
function colorDist(a,b){ const A=hexRgb(a), B=hexRgb(b); return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2); }
function fmtNum(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function money(n, cur){ return (cur||'$')+' '+fmtNum(n); }

function randomAttrsForPosition(position, forcedNat){
  const base=()=>40+Math.floor(Math.random()*45);

/* Genera un plantel de `count` jugadores con predominancia de la nacionalidad `mainNat`
   (equipo inglés = mayoría de jugadores ingleses) y una porción de extranjeros variada. */
function generateRandomSquad(count = 16, mainNat, foreignRatio){
  mainNat = mainNat || pick(NATIONS).v;
  if(foreignRatio==null) foreignRatio = 0.2 + Math.random()*0.2; // ~20%-40% de extranjeros, como en equipos reales
  const otherNats = NATIONS.map(n=>n.v).filter(v=>v!==mainNat);
  const squad = [];
  const posList = ['POR','POR','DEF','DEF','DEF','DEF','DEF','MED','MED','MED','MED','MED','DEL','DEL','DEL','DEL'];
  while(posList.length < count){
    const rnd_ = Math.random();
    posList.push(rnd_ < 0.1 ? 'POR' : rnd_ < 0.45 ? 'DEF' : rnd_ < 0.8 ? 'MED' : 'DEL');
  }
  const usedNames = new Set();
  for(let i = 0; i < count; i++){
    const pos = posList[i];
    const nat = (otherNats.length && Math.random() < foreignRatio) ? pick(otherNats) : mainNat;
    let name, guard=0;
    do{ name = nameForNation(nat); guard++; } while(usedNames.has(name) && guard<40);
    usedNames.add(name);
    const attrs = randomAttrsForPosition(pos, nat);
    const p = Object.assign({ id: uid(), name, number: i+1, position: pos }, attrs);
    p.fit = rnd(88,100); p.form = rnd(55,75);
    squad.push(p);
  }
  return squad;
}

function crestKey(c){ return [c.bg,c.bg2,c.shape,c.pattern].join('|'); }
/* Genera un escudo variado y distinto a los de los equipos existentes */
function generateCrest(name, existingTeams, keepInitials){
  const teams = (existingTeams||[]).filter(t=>t&&t.crest);
  const usedKeys = new Set(teams.map(t=>crestKey(t.crest)));
  const palUse = {};
  teams.forEach(t=>{ const k=t.crest.bg+'|'+t.crest.bg2; palUse[k]=(palUse[k]||0)+1; });
  const shapeUse = {}; teams.forEach(t=>{ shapeUse[t.crest.shape]=(shapeUse[t.crest.shape]||0)+1; });
  let best=null;
  for(let attempt=0; attempt<40; attempt++){
    let pal = pick(CREST_PALETTES);
    if(attempt<25){
      const minUse = Math.min(...CREST_PALETTES.map(p=>palUse[p[0]+'|'+p[1]]||0), ...CREST_PALETTES.map(p=>palUse[p[1]+'|'+p[0]]||0));
      const pool = CREST_PALETTES.filter(p=>Math.min(palUse[p[0]+'|'+p[1]]||0, palUse[p[1]+'|'+p[0]]||0)<=minUse);
      pal = pick(pool);
    }
    let bg=pal[0], bg2=pal[1];
    if(Math.random()<0.3){ const t=bg; bg=bg2; bg2=t; }
    if(luminance(bg)>0.7){ const t=bg; bg=bg2; bg2=t; }
    const RANDOM_SHAPES = CREST_SHAPES.filter(s=>s!=='star');
    const minShape = Math.min(...RANDOM_SHAPES.map(s=>shapeUse[s]||0));
    const shapePool = attempt<25 ? RANDOM_SHAPES.filter(s=>(shapeUse[s]||0)<=minShape+1) : RANDOM_SHAPES;
    const shape = pick(shapePool);
    const pattern = pick(CREST_PATTERNS.map(p=>p.v).concat(['solid','stripes','halves','diagonal']));
    const cand = {shape, bg, bg2, pattern};
    best = cand;
    if(!usedKeys.has(crestKey(cand))) break;
  }
  const hint = iconHintFor(name);
  const useIcon = hint ? Math.random()<0.7 : Math.random()<0.3;
  const trim = Math.random()<0.45 ? (best.pattern==='solid' ? best.bg2 : (luminance(best.bg)>0.5 ? '#14201A' : '#FFFFFF')) : null;
  return {
    shape:best.shape, bg:best.bg, bg2:best.bg2, pattern:best.pattern, trim,
    useIcon, icon: hint || pick(CREST_ICONS),
    initials: keepInitials || initialsFromName(name), initialsAuto: !keepInitials
  };
}

function ensurePlayer(p){
  const pos = p.position || 'MED';
  const jit=(v,r)=>clamp(Math.round(v+rnd(-r,r)),15,99);
  if(p.ata==null) p.ata=60; if(p.def==null) p.def=60; if(p.fis==null) p.fis=60; if(p.age==null) p.age=24;
  if(p.vel==null) p.vel=jit(p.fis,10);
  if(p.pas==null) p.pas=jit((p.ata+p.def)/2,10);
  if(p.tec==null) p.tec=jit(pos==='DEF'?p.ata+4:p.ata,10);
  if(p.tir==null) p.tir=jit(pos==='POR'?20:(pos==='DEF'?p.ata-8:p.ata),8);
  if(p.res==null) p.res=jit(p.fis,8);
  if(p.dis==null) p.dis=rnd(40,90);
  if(p.ref==null) p.ref=jit(p.def,8);
  if(p.fit==null) p.fit=100;
  if(p.form==null) p.form=65;
  p.fit = clamp(Math.round(p.fit),25,100);
  p.form = clamp(Math.round(p.form),20,99);
  if(!p.nat||!p.foot||!p.height||!p.weight||p.trait==null){
    const b=randomBio(pos);
    if(!p.nat) p.nat=b.nat; if(!p.foot) p.foot=b.foot; if(!p.height) p.height=b.height; if(!p.weight) p.weight=b.weight; if(p.trait==null) p.trait=b.trait;
  }
}

  if(!c.prize) c.prize = {currency:'$', champion:0, runnerUp:0, third:0, topScorer:0, participation:0};
  else c.prize = Object.assign({}, DEFAULT_PRIZE, c.prize);
  if(!c.style) c.style = defaultCupStyle();
  if(!c.trophy) c.trophy = defaultTrophy();
  if(!c.unavail) c.unavail = {};
  if(!c.yc) c.yc = {};
  if(c.format==='eliminacion' && c.bracket && c.bracket.third===undefined) c.bracket.third=null;
}
function ensureLeague(l){
  if(!l.divisions) l.divisions = [];
  if(!l.history) l.history = [];
  if(!l.season) l.season = 1;
  if(!l.rules) l.rules = Object.assign({}, DEFAULT_RULES);
  else l.rules = Object.assign({}, DEFAULT_RULES, l.rules);
  if(!l.style) l.style = defaultCupStyle();
  if(!l.currency) l.currency = '$';
  if(!l.startDate) l.startDate = todayISO();
  if(!l.intervalDays) l.intervalDays = 7;
  l.divisions.forEach((d,i)=>{
    if(!d.id) d.id = uid();
    if(d.level==null) d.level = i+1;
    if(!d.name) d.name = 'División '+(i+1);
    if(!d.teamIds) d.teamIds = [];
    if(!d.format) d.format = 'liga';
    if(!d.legs) d.legs = 1;
    if(d.groupsCount==null) d.groupsCount = 2;
    if(d.qualify==null) d.qualify = 4;
    if(d.thirdPlace==null) d.thirdPlace = false;
    if(d.relegate==null) d.relegate = 0;
    if(d.size==null) d.size = Math.max(4, (d.teamIds||[]).length || 10);
    d.size = clamp(Math.round(d.size), 4, 30);
    if(!d.trophy) d.trophy = defaultTrophy();
    if(!d.prize) d.prize = Object.assign({}, DEFAULT_PRIZE, {currency:l.currency});
    if(d.compId===undefined) d.compId = null;
  });
  l.divisions.sort((a,b)=>a.level-b.level);
  l.divisions.forEach((d,i)=>{ d.level = i+1; });
}
function migrateData(d){
  if(!d.teams) d.teams=[]; if(!d.competitions) d.competitions=[]; if(!d.leagues) d.leagues=[]; if(!d.retired) d.retired={};
  if(!d.freeAgents) d.freeAgents=[];
  if(d.userTeamId===undefined) d.userTeamId=null;
  d.teams.forEach(t=>ensureTeam(t, d.teams));
  d.competitions.forEach(ensureComp);
  d.leagues.forEach(ensureLeague);
  if(d.playerCareer===undefined) d.playerCareer = null;
  d.version = 6;
  return d;
}
function defaultData(){ return { teams: [], competitions: [], leagues: [], retired: {}, freeAgents: [], userTeamId: null, playerCareer: null, version:6 }; }
let data = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    return migrateData(JSON.parse(raw));
  }catch(e){ return defaultData(); }
}
let persistFailed = false;
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); persistFailed = false; }
  catch(e){
    if(!persistFailed){
      persistFailed = true;
      try{ App.toast('No se pudo guardar: el almacenamiento del navegador está lleno. Exporta una copia de seguridad.'); }catch(_){}
    }
  }
}

function findTeam(id){ return data.teams.find(t=>t.id===id) || null; }
function findComp(id){ return data.competitions.find(c=>c.id===id) || null; }
function findLeague(id){ return (data.leagues||[]).find(l=>l.id===id) || null; }
/* En qué liga y división juega un equipo ahora mismo */
function teamLeagueInfo(teamId){
  for(const l of (data.leagues||[])){
    for(const d of (l.divisions||[])){
      if((d.teamIds||[]).indexOf(teamId)>=0) return {league:l, div:d};
    }
  }
  return null;
}
function findPlayerGlobal(id){
  for(const t of data.teams){ const p = t.players.find(pl=>pl.id===id); if(p) return {player:p, team:t}; }
  return null;
}
function teamOvr(t){ return t && t.players && t.players.length ? Math.round(t.players.reduce((s,p)=>s+playerOverall(p),0)/t.players.length) : 0; }
/* ---------- Modo Carrera: estrellas, sueldos y ánimo de la dirigencia ---------- */
function teamStars(t){ return Math.max(1, Math.min(5, Math.round((teamOvr(t)-45)/10))); }
function starsHTML(n, extraCls){ return `<span class="team-stars${extraCls?(' '+extraCls):''}" aria-label="${n} estrellas">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`; }
function playerWage(p){ return Math.round(180 + playerOverall(p)*32 + Math.max(0, 26-(p.age||24))*9); }
function squadWageBill(t){ return (t && t.players ? t.players : []).reduce((s,p)=>s+playerWage(p), 0); }
function ticketPriceFor(t){ return 2 + teamStars(t); }
function happinessInfo(v){
  v = v==null ? 60 : v;
  if(v>=80) return {ic:'😄', l:'Eufórica'};
  if(v>=60) return {ic:'🙂', l:'Conforme'};
  if(v>=40) return {ic:'😐', l:'Dudosa'};
  if(v>=20) return {ic:'😟', l:'Enojada'};
  return {ic:'😡', l:'Al límite'};
}

function squadFitness(t){

}


/* ---------- Carga de imágenes reales (escudos/trofeos) ---------- */
function loadImageFileAsDataURL(file, maxDim, onDone, onError){
  if(!file){ return; }
  if(!/^image\//.test(file.type)){ if(onError) onError('tipo'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const imgEl = new Image();
    imgEl.onload = function(){
      let w = imgEl.naturalWidth || imgEl.width, h = imgEl.naturalHeight || imgEl.height;
      if(!w || !h){ if(onError) onError('vacia'); return; }
      if(w > maxDim || h > maxDim){ const sc = maxDim/Math.max(w,h); w = Math.max(1,Math.round(w*sc)); h = Math.max(1,Math.round(h*sc)); }
      try{
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.clearRect(0,0,w,h); ctx.drawImage(imgEl,0,0,w,h);
        onDone(cv.toDataURL('image/png'));
      }catch(e){ if(onError) onError('canvas'); }
    };
    imgEl.onerror = function(){ if(onError) onError('imagen'); };
    imgEl.src = ev.target.result;
  };
  reader.onerror = function(){ if(onError) onError('lectura'); };
  reader.readAsDataURL(file);
}

function pitchSVG(st, pid){

  else if(pat==='franjas-v'){ for(let i=0;i<8;i++){ if(i%2) bands += `<rect x="${i*8.5}" y="0" width="8.5" height="105" fill="${g2}"/>`; } }

  }
  else if(pat==='circulos'){
    let c=''; let alt=false; for(let r=70;r>2;r-=7){ c += `<circle cx="34" cy="52.5" r="${r}" fill="${alt?g1:g2}"/>`; alt=!alt; }
    bands = `<g clip-path="url(#${id}c)">${c}</g>`;
  }
  const sw = 0.55;

/* Vista aérea del estadio: tribunas + cancha. La forma (clásico/moderno) y el techo cambian el dibujo. */
function stadiumViewSVG(st){
  st = st || {};
  const sc = st.stands || '#1B7A4A';
  const oval = st.shape==='moderno';
  const outerR = oval ? 60 : 34, innerR = oval ? 46 : 30;
  let crowd='';
  let seed=(String(st.name||'x').length*7919)%1000;
  const rand=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const cols=[shade(sc,45), shade(sc,25), '#FFFFFF', shade(sc,-15)];
  for(let i=0;i<170;i++){
    const side = Math.floor(rand()*4);
    let x,y;
    if(side===0){ x=8+rand()*184; y=6+rand()*22; }
    else if(side===1){ x=8+rand()*184; y=142+rand()*22; }
    else if(side===2){ x=6+rand()*24; y=8+rand()*158; }
    else { x=170+rand()*24; y=8+rand()*158; }
    crowd += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.5" fill="${cols[Math.floor(rand()*cols.length)]}" opacity="0.85"/>`;
  }
  // El techo se dibuja como un anillo oscuro sobre el borde interior de las tribunas, con vigas radiales
  let roof = '';
  if(st.roof){
    const roofC = shade(sc,-55);
    roof = `<rect x="16" y="16" width="168" height="140" rx="${oval?48:22}" fill="none" stroke="${roofC}" stroke-width="9" opacity="0.9"/>`;
    const beams = [];
    for(let a=0; a<360; a+=30){
      const rad = a*Math.PI/180, cx=100, cy=86;
      const x1=cx+Math.cos(rad)*26, y1=cy+Math.sin(rad)*22, x2=cx+Math.cos(rad)*76, y2=cy+Math.sin(rad)*64;
      beams.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${roofC}" stroke-width="1.4" opacity="0.35"/>`);
    }
    roof += beams.join('');
  }
  return `<svg viewBox="0 0 200 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="estadio" style="width:100%;height:auto;display:block;">
    <rect x="2" y="2" width="196" height="168" rx="${outerR}" fill="${shade(sc,-30)}"/>
    <rect x="6" y="6" width="188" height="160" rx="${outerR-4}" fill="${sc}"/>
    ${crowd}
    <rect x="30" y="30" width="140" height="112" rx="${innerR>34?12:6}" fill="${shade(sc,-40)}"/>
    <svg x="33" y="33" width="134" height="106" viewBox="0 0 68 105" preserveAspectRatio="none">${pitchSVG(st,'view').replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg>
    ${roof}
  </svg>`;
}

function cupBg(s){

  if(s.pattern==='rayas') return `repeating-linear-gradient(90deg, rgba(255,255,255,0.09) 0 14px, transparent 14px 28px), ${base}`;

}


/* ---------- Alineaciones ---------- */
/* El técnico elige por nivel, pero descuenta a los cansados y premia al que está en racha */
function selectionScore(p){
  const fit = clamp(p.fit??100, 25, 100), form = clamp(p.form??65, 20, 99);
  return playerOverall(p) * (0.74 + 0.26*fit/100) * (0.94 + 0.12*form/100);
}
function fitClass(v){ return v>=75 ? 'fit-hi' : v>=50 ? 'fit-mid' : 'fit-lo'; }
function fitLabel(v){ return v>=88?'Enchufado' : v>=72?'Entero' : v>=52?'Algo cansado' : v>=38?'Fundido' : 'Al límite'; }
function formLabel(v){ return v>=82?'En racha' : v>=68?'Bien' : v>=52?'Irregular' : 'En baja'; }
function buildLineup(squad, tactic='4-4-2', excludeIds){
  if(!squad.length) return {starting:[], bench:[], formation:tactic};
  const ex = excludeIds || new Set();
  let avail = squad.filter(p=>!ex.has(p.id));
  if(avail.length<12){ avail = avail.concat(squad.filter(p=>ex.has(p.id)).slice(0, 12-avail.length)); }
  const formation = FORMATIONS[tactic] ? tactic : '4-4-2';
  const target = FORMATIONS[formation];
  const byPos = {POR:[], DEF:[], MED:[], DEL:[]};
  avail.forEach(p=> (byPos[p.position]||byPos.MED).push(p));
  Object.keys(byPos).forEach(k=> byPos[k].sort((a,b)=>selectionScore(b)-selectionScore(a)));
  const starting=[]; const used=new Set();
  Object.keys(target).forEach(pos=>{
    const need = target[pos];
    const list = byPos[pos]||[];
    for(let i=0;i<need && i<list.length;i++){ starting.push(list[i]); used.add(list[i].id); }
  });
  const size = Math.min(11, avail.length);
  if(starting.length < size){
    const remaining = avail.filter(p=>!used.has(p.id)).sort((a,b)=>selectionScore(b)-selectionScore(a));
    for(const p of remaining){ if(starting.length>=size) break; starting.push(p); used.add(p.id); }
  }
  const rest = avail.filter(p=>!used.has(p.id)).sort((a,b)=>selectionScore(b)-selectionScore(a));
  const bench=[]; const gk = rest.find(p=>p.position==='POR');
  if(gk) bench.push(gk);
  rest.forEach(p=>{ if(bench.length<9 && !bench.includes(p)) bench.push(p); });
  return {starting, bench, formation};
}
/* Acomoda al once en filas (portero → delanteros) para dibujarlo */
function layoutLineup(lineup){
  const spec = FORMATION_ROWS[lineup.formation] || FORMATION_ROWS['4-4-2'];
  const pool = [...lineup.starting];
  const medRows = spec.filter(r=>r[0]==='MED').length;
  let medSeen = 0;
  const rows = [];
  spec.forEach(([pos,n])=>{
    let cand = pool.filter(p=>p.position===pos);
    if(pos==='MED' && medRows>1){
      cand.sort((a,b)=> medSeen===0 ? (b.def??60)-(a.def??60) : (b.ata??60)-(a.ata??60));
      medSeen++;
    } else cand.sort((a,b)=>(a.number||99)-(b.number||99));
    let take = cand.slice(0,n);
    if(take.length<n){
      const others = pool.filter(p=>!take.includes(p) && p.position!==pos);
      take = take.concat(others.slice(0,n-take.length));
    }
    take.forEach(p=>{ const i=pool.indexOf(p); if(i>=0) pool.splice(i,1); });
    take.sort((a,b)=>(a.number||99)-(b.number||99));
    rows.push(take);
  });
  if(pool.length && rows.length) rows[rows.length-1].push(...pool);
  return rows;
}

function attackScore(p){ return 0.5*(p.ata??60)+0.2*(p.tir??60)+0.15*(p.tec??60)+0.15*(p.pas??60); }
function defenseScore(p){
  if(p.position==='POR') return 0.7*(p.ref??p.def??60)+0.3*(p.def??60);
  return 0.65*(p.def??60)+0.2*(p.fis??60)+0.15*(p.vel??60);
}
function midScore(p){ return 0.45*(p.pas??60)+0.3*(p.tec??60)+0.15*(p.res??60)+0.10*(p.vel??60); }
function finishing(p){ return 0.5*(p.tir??60)+0.3*(p.ata??60)+0.2*(p.tec??60); }
function expectedGoals(attack, defense, homeBoost){
  let lambda = 1.25 + (attack-defense)/40 + (homeBoost||0);
  return Math.max(0.15, Math.min(4.2, lambda));
}
function formatMinute(t){
  if(t<46){
    if(t<=45) return Math.round(t)+"'";
    return "45+"+Math.round((t-45)*10)+"'";
  }
  if(t<=90) return Math.round(t)+"'";
  if(t<91) return "90+"+Math.round((t-90)*10)+"'";
  if(t<=105) return Math.round(t)+"'";
  if(t<106) return "105+"+Math.round((t-105)*10)+"'";
  if(t<=120) return Math.round(t)+"'";
  return "120+"+Math.round((t-120)*10)+"'";
}
function minuteInt(t){ return Math.floor(t+1e-6); }
function foulWeight(p){
  const posW = {DEF:1.5, MED:1.25, DEL:0.8, POR:0.25}[p.position]||1;
  const fis = p.fis??60, dis = p.dis??60;
  return posW * (1 + (100-fis)/150) * (1 + (100-dis)/120);
}
function injuryWeight(p){
  const fis = p.fis??60, age = p.age??24;
  let w = 0.4 + (100-fis)/100;
  if(age>=30) w += (age-30)*0.035;
  if(age<=19) w += (19-age)*0.02;
  return Math.max(0.08, w);
}
function scorerWeight(p, S, t){
  let w = (POS_WEIGHT[p.position]||1) * Math.pow(finishing(p)/60, 1.4);
  if(p.trait==='cazagoles') w*=1.3;
  if(S && S.enteredAt) w *= 0.85+0.15*energyOf(S,p,t)/100;
  return w;
}
function assistWeight(p){

/* Cómo llegó el gol: depende del puesto, las especialidades y el clima */
function pickHow(p, env){
  const att = p.position==='DEL'||p.position==='MED';

  const list = [
    ['normal', 46],
    ['cabeza', (att?9:16)*(1+Math.max(0,((p.fis??60)-60))/100)*(p.trait==='cabeceador'?3:1)],
    ['lejano', 6*((p.tir??60)/60)*(p.trait==='lejano'?3:1)*(windy?0.7:1)],

  return pickWeighted(list, x=>x[1])[0];

/* Cansancio: 100 = fresco. Depende de resistencia, puesto, edad y clima */
function drainRate(p){
  const res = p.res??60;
  const role = {POR:0.25, DEF:0.9, MED:1.1, DEL:1.0}[p.position]||1;
  const age = (p.age??24)>=31 ? 1.08 : 1;
  return (0.30 + (100-res)*0.0045) * role * age;
}
function energyOf(S, p, t){
  const since = S.enteredAt.get(p.id) ?? 0;
  const base = (S.baseEnergy && S.baseEnergy.get(p.id)) ?? 100;
  const knock = (S.knocks && S.knocks.get(p.id)) || 0;
  return clamp(base - Math.max(0,t-since)*drainRate(p)*(S.drainMul||1) - knock, 5, 100);
}
function formMul(p){ return 0.955 + 0.09*((p.form??65)/100); }
/* ---------- Presión: temple del equipo y nervios según la situación ---------- */
/* Un plantel con disciplina, veteranos y líderes aguanta mejor los momentos calientes */
function templeOf(S){
  if(!S.onPitch.length) return 0.5;
  let sum = 0;
  S.onPitch.forEach(p=>{
    let v = (p.dis??60)/100;
    v += clamp(((p.age??24)-20)/18, 0, 1)*0.22;
    if(p.trait==='lider') v += 0.28;
    if(p.trait==='muro') v += 0.06;
    sum += clamp(v, 0.1, 1.35);
  });
  return clamp(sum/S.onPitch.length/1.12, 0.12, 1);
}
/* Nervios: crecen con el reloj, con el partido apretado y con lo que está en juego */
function nervesOf(S, O, t, ctx){
  const late = clamp((t-55)/30, 0, 1);
  const diff = S.goals - O.goals;
  const close = Math.abs(diff)<=1 ? 1 : Math.abs(diff)===2 ? 0.5 : 0.25;
  const stakes = ctx.stakes==null ? 0.3 : ctx.stakes;
  const awayMul = S.side==='away' ? 1.12 : 1;
  const base = late * close * (0.28 + 0.72*stakes) * awayMul;
  return clamp(base * (1.3 - (S.temple==null?0.5:S.temple)*0.8), 0, 1);
}
/* Cuánto se juega el partido: una final o una definición pesa mucho más que una fecha cualquiera */
function matchStakes(comp, m, loc){
  if(!comp) return 0.3;
  try{
    if(loc && loc.isBracket && comp.bracket){
      const fromEnd = comp.bracket.rounds.length-1-loc.idx;
      if(comp.bracket.third && comp.bracket.third.id===m.id) return 0.55;
      return fromEnd===0 ? 1 : fromEnd===1 ? 0.82 : fromEnd===2 ? 0.66 : 0.58;
    }
    const rounds = comp.rounds||[];
    if(!rounds.length) return 0.3;
    const total = rounds.length, idx = loc ? loc.idx : 0;
    const prog = total>1 ? idx/(total-1) : 1;
    let v = 0.22 + 0.33*prog;
    const st = computeStandings(comp);
    if(st.length>3){
      const posOf = id=>{ const i = st.findIndex(r=>r.teamId===id); return i<0 ? 99 : i+1; };
      const lg = comp.leagueId ? findLeague(comp.leagueId) : null;
      const div = lg ? (lg.divisions||[]).find(d=>d.id===comp.divisionId) : null;
      const relZone = div ? (div.relegate||0)+2 : 2;
      const topZone = div ? Math.max(2,(div.promote||0)+1) : 3;
      const hot = p=> p<=topZone || p>st.length-relZone;
      const pa = posOf(m.teamAId), pb = posOf(m.teamBId);
      if(prog>0.5 && (hot(pa)||hot(pb))) v += 0.28;
      if(prog>0.78 && hot(pa) && hot(pb)) v += 0.14;
    }
    return clamp(v, 0.2, 1);
  }catch(e){ return 0.3; }
}

  S.mAtt = m.att; S.mOpp = m.opp;

function sideRatings(S, t){
  let a=0,aw=0,d=0,dw=0,mid=0,mw=0;
  S.onPitch.forEach(p=>{
    const f = (0.88+0.12*energyOf(S,p,t)/100) * formMul(p);
    let att = attackScore(p)*f, def = defenseScore(p)*f;
    if(p.trait==='muro') def*=1.05;
    const wa=ATTACK_WEIGHT[p.position]||1, wd=DEFENSE_WEIGHT[p.position]||1, wm=MID_WEIGHT[p.position]||1;
    a+=att*wa; aw+=wa; d+=def*wd; dw+=wd; mid+=midScore(p)*f*wm; mw+=wm;
  });
  const lead = S.onPitch.some(p=>p.trait==='lider') ? 1.2 : 0;
  return {attack: aw? a/aw+lead : 50, defense: dw? d/dw+lead : 50, mid: mw? mid/mw : 50};
}
function stateMod(diff, t){
  if(t<55) return 1;
  const late = clamp((t-55)/35,0,1);
  if(diff<0) return 1+0.09*Math.min(3,-diff)*(0.5+late);
  if(diff>0) return 1-0.05*Math.min(3,diff)*late;
  return 1;
}
function evBase(S, t, p, extra){ return Object.assign({minute:t, display:formatMinute(t), side:S.side, teamId:S.team.id, playerId:p?p.id:null}, extra||{}); }
/* El empuje: sube con las ocasiones y baja solo. Positivo = manda el local */
function pushMom(ctx, S, amount){
  const dir = S.side==='home' ? 1 : -1;
  ctx.mom = clamp(ctx.mom + dir*amount, -1, 1);
}
function addEvent(ctx, ev){ ev.mom = Math.round((ctx.mom||0)*100)/100; ctx.events.push(ev); return ev; }

function removeFromPitch(S, p, t){
  S.onPitch = S.onPitch.filter(x=>x.id!==p.id);
  S.leftAt.set(p.id, t);
}
function applySub(S, outP, inP, t, reason, ctx, alreadyOff){
  if(!alreadyOff) removeFromPitch(S, outP, t);
  S.bench = S.bench.filter(p=>p.id!==inP.id);
  S.onPitch.push(inP);
  S.enteredAt.set(inP.id, t);
  S.subsUsed++;
  S.stats[inP.id].subIn = minuteInt(t);
  S.stats[outP.id].subOut = minuteInt(t);
  addEvent(ctx, {minute:t, display:formatMinute(t), type:'cambio', side:S.side, teamId:S.team.id, outId:outP.id, inId:inP.id, reason});
}
/* Elige quién entra según el rol táctico que necesita el equipo */
function pickIn(S, out, role){
  const pool = S.bench.filter(b=>b.position!=='POR' || out.position==='POR');
  if(!pool.length) return null;
  let list, score;
  if(role==='attack'){
    const fw = pool.filter(b=>b.position==='DEL');
    list = fw.length ? fw : pool.filter(b=>b.position==='MED');
    score = attackScore;
  } else if(role==='defense'){
    const df = pool.filter(b=>b.position==='DEF');
    list = df.length ? df : pool.filter(b=>b.position==='MED');
    score = defenseScore;
  } else {
    const same = pool.filter(b=>b.position===out.position);
    if(same.length) list = same;
    else if(out.position==='DEF') list = pool.filter(b=>b.position==='MED');
    else if(out.position==='MED') list = pool.filter(b=>b.position==='DEF' || b.position==='DEL');
    else list = pool.filter(b=>b.position==='MED');
    score = playerOverall;
  }
  if(!list || !list.length) list = pool;
  return [...list].sort((a,b)=>score(b)*(0.8+0.2*((b.fit??100)/100))-score(a)*(0.8+0.2*((a.fit??100)/100)))[0];
}
function lean(p, S, t){ return defenseScore(p)-attackScore(p)+(100-energyOf(S,p,t))*0.25; }

/* Decisiones de cambio: dependen del resultado, el minuto, el cansancio, las tarjetas y la mentalidad */
function decideSubs(S, t, isHT, ctx){
  if(ctx && ctx.userSide && S.side===ctx.userSide) return; // el DT humano maneja sus propios cambios
  const O = S.opp;
  const left = S.maxSubs - S.subsUsed;
  if(left<=0 || !S.bench.length) return;
  if(!isHT && S.windowsUsed>=MAX_WINDOWS) return;
  const diff = S.goals - O.goals;
  const outfield = S.onPitch.filter(p=>p.position!=='POR');
  if(!outfield.length) return;
  const en = p=>energyOf(S,p,t);
  const trailing = diff<0, leading = diff>0;
  const limit = t>=70 ? 62 : 56;
  const defCount = outfield.filter(p=>p.position==='DEF').length;
  const roleFor = p=>{
    if(trailing && p.position!=='DEF' && t>=58) return 'attack';
    if(leading && t>=70 && p.position==='DEL') return 'defense';
    return 'same';
  };
  const cands = [];
  // 1) Cansancio
  outfield.forEach(p=>{
    const e = en(p);
    if(e<limit){ const pr = 22+(limit-e)*1.6; if(pr>=35) cands.push({out:p, role:roleFor(p), reason:'cansancio', pr}); }
  });
  // 1b) Golpeado durante el partido
  outfield.forEach(p=>{ if(S.knocks.get(p.id)) cands.push({out:p, role:'same', reason:'golpe', pr:44}); });
  // 2) Evitar la segunda amarilla
  if(!trailing && t>=60 && S.tact.amarilla<1) outfield.forEach(p=>{
    if((S.yellow.get(p.id)||0)>=1 && p.position!=='DEL'){
      const dis = p.dis??60;
      if(dis<58) cands.push({out:p, role:'same', reason:'amarilla', pr:33+(58-dis)*0.9});
    }
  });
  // 3) Buscar el resultado
  let attackNeed = 0;
  if(trailing) attackNeed = Math.min(1, (-diff)*0.55 + (t-50)/45);
  else if(diff===0 && S.mentality==='ofensiva' && t>=65) attackNeed = 0.45;
  else if(diff===0 && S.mentality!=='defensiva' && t>=74) attackNeed = 0.3;
  const attCap = diff<=-2 ? 3 : 2;
  if(t>=58 && attackNeed>0 && S.tact.ofensivo<attCap){
    const outs = outfield.filter(p=>p.position!=='DEL' && !(p.position==='DEF' && defCount<=3))
      .sort((a,b)=>lean(b,S,t)-lean(a,S,t));
    outs.slice(0, attackNeed>0.7?2:1).forEach(p=>cands.push({out:p, role:'attack', reason:'ofensivo', pr:40+60*attackNeed}));
  }
  // 4) Proteger la ventaja
  let protect = 0;
  if(leading) protect = Math.min(1, diff*0.5+(t-60)/35);
  else if(diff===0 && S.mentality==='defensiva' && t>=72) protect = 0.5;
  if(t>=66 && protect>0 && diff<=2 && S.tact.defensivo<2){
    const outs = outfield.filter(p=>p.position==='DEL' || (p.position==='MED' && (p.ata??60)>(p.def??60)+8))
      .sort((a,b)=>en(a)-en(b));
    const boost = S.onPitch.length<11 ? 1.2 : 1;
    outs.slice(0, protect>0.7?2:1).forEach(p=>cands.push({out:p, role:'defense', reason:'defensivo', pr:(38+55*protect)*boost}));
  }
  // 5) Goleada: descanso para los mejores
  if(diff>=3 && t>=64){
    [...outfield].sort((a,b)=>playerOverall(b)-playerOverall(a)).slice(0,2).forEach(p=>cands.push({out:p, role:'same', reason:'descanso', pr:36}));
  }
  // 6) Bajo rendimiento
  if(t>=60 && !leading){
    outfield.forEach(p=>{
      if(p.position==='DEF') return;
      const st = S.stats[p.id];
      const bad = st.missed*1.0 + st.penMissed*1.5 + st.yellow*0.4 - st.goals*1.5 - st.assists*0.8;
      if(bad>=1.2) cands.push({out:p, role:trailing?'attack':'same', reason:'rendimiento', pr:36+bad*6});
    });
  }
  const sorted = cands.filter(c=>c.pr>=35).sort((a,b)=>b.pr-a.pr);
  if(!sorted.length) return;
  const maxThis = Math.min(left, isHT ? 2 : (sorted[0].pr>=80 ? 3 : 2));
  const usedOut = new Set();
  let made = 0;
  for(const c of sorted){
    if(made>=maxThis) break;
    if(usedOut.has(c.out.id) || !S.onPitch.some(p=>p.id===c.out.id)) continue;
    if(c.reason==='defensivo' && c.out.position==='DEL' && S.onPitch.filter(p=>p.position==='DEL').length<=1) continue;
    const inP = pickIn(S, c.out, c.role);
    if(!inP) continue;
    if(c.reason==='ofensivo' && attackScore(inP)<attackScore(c.out)-2) continue;
    if(c.reason==='ofensivo' && S.tact.ofensivo>=attCap) continue;
    if(c.reason==='defensivo' && S.tact.defensivo>=2) continue;
    applySub(S, c.out, inP, t, c.reason, ctx);
    if(S.tact[c.reason]!==undefined) S.tact[c.reason]++;
    S.knocks.delete(c.out.id);
    usedOut.add(c.out.id); made++;
  }
  if(made && !isHT) S.windowsUsed++;
}
/* Giro de planteo: el técnico cambia la actitud del equipo sin tocar el banco */
function maybeShift(S, t, ctx){
  if(ctx && ctx.userSide && S.side===ctx.userSide) return; // el DT humano maneja su propia mentalidad
  if(S.shifted || t<62) return;
  const diff = S.goals - S.opp.goals;
  if(diff<0 && S.mentality!=='ofensiva'){
    S.shifted = true; S.mAtt *= 1.09; S.mOpp *= 1.06;
    addEvent(ctx, {minute:t, display:formatMinute(t), type:'planteo', side:S.side, teamId:S.team.id, mode:'ofensivo'});
  } else if(diff>0 && t>=76 && S.mentality!=='defensiva'){
    S.shifted = true; S.mAtt *= 0.93; S.mOpp *= 0.92;
    addEvent(ctx, {minute:t, display:formatMinute(t), type:'planteo', side:S.side, teamId:S.team.id, mode:'defensivo'});
  }
}

function handleKeeperLoss(S, t, ctx, reason){
  if(keeperOf(S)) return;
  const left = S.maxSubs - S.subsUsed;
  const gkBench = S.bench.find(b=>b.position==='POR');
  const rank = {DEL:0, MED:1, DEF:2};
  const cands = S.onPitch.filter(p=>p.position!=='POR').sort((a,b)=>(rank[a.position]-rank[b.position]) || (playerOverall(a)-playerOverall(b)));
  if(gkBench && left>0 && cands.length>1){ applySub(S, cands[0], gkBench, t, reason==='lesion'?'lesion':'arquero_expulsado', ctx); return; }
  const best = [...S.onPitch].sort((a,b)=>(b.def??60)-(a.def??60))[0];
  if(best){
    S.emergencyKeeper = best.id;
    addEvent(ctx, Object.assign(evBase(S,t,best), {type:'arquero_emergencia'}));
  }
}
function sendOff(S, p, t, ctx, reason, extra){
  addEvent(ctx, Object.assign(evBase(S,t,p,extra), {type:'roja', reason}));
  const st = S.stats[p.id]; st.red++; st.redType = reason;
  S.box.red++;
  removeFromPitch(S, p, t);
  pushMom(ctx, S, -0.3);
  if(p.position==='POR') handleKeeperLoss(S, t, ctx, 'arquero_expulsado');
}
/* ----- Resoluciones ----- */
function registerShot(S, p, onTarget){
  S.box.shots++; S.stats[p.id].shots++;
  if(onTarget){ S.box.on++; S.stats[p.id].shotsOn++; }
}
function resolveGoalAttempt(S, O, t, ctx){
  const pool = S.onPitch.slice(); if(!pool.length) return;
  // Autogol: el rival se la manda contra su propio arco
  const defPool = O.onPitch.filter(p=>p.position!=='POR');
  if(defPool.length && Math.random()<0.035){
    const own = pickWeighted(defPool, p=>(p.position==='DEF'?3:1)*(1+(100-(p.tec??60))/90));
    S.box.shots++; S.box.on++; S.goals++;
    O.stats[own.id].ownGoals++;
    addEvent(ctx, {minute:t, display:formatMinute(t), type:'autogol', side:O.side, teamId:O.team.id,
      playerId:own.id, creditTeamId:S.team.id, creditSide:S.side, how:pick(['desvío desafortunado','en el intento de despeje','tras un rebote en el área'])});
    pushMom(ctx, S, 0.32);
    return;
  }
  const scorer = pickWeighted(pool, p=>scorerWeight(p,S,t));
  // Le tiembla el pulso en el momento decisivo
  if(S.nerves>0.18 && Math.random() < S.nerves*0.34){
    registerShot(S, scorer, Math.random()<0.5);
    S.box.bigChances++; S.stats[scorer.id].missed++;
    addEvent(ctx, Object.assign(evBase(S,t,scorer), {type:'nervios'}));
    pushMom(ctx, S, 0.06);
    return;
  }
  const how = pickHow(scorer, ctx.env);
  let assistId = null;
  const ap = pool.filter(p=>p.id!==scorer.id);
  const aChance = (how==='tiro_libre'||how==='lejano'||how==='olimpico'||how==='individual') ? 0.2 : 0.64;
  if(ap.length && Math.random()<aChance) assistId = pickWeighted(ap, assistWeight).id;
  registerShot(S, scorer, true);
  S.box.bigChances++;
  if(how==='olimpico'||how==='cabeza') S.box.corners++;
  const base = Object.assign(evBase(S,t,scorer), {assistId});
  if(ctx.rules.varOn && Math.random()<VAR_DISALLOW_CHANCE){
    addEvent(ctx, Object.assign(base, {type:'gol_anulado', reason:pick(VAR_REASONS)}));
    S.stats[scorer.id].varGoals++;
    pushMom(ctx, S, 0.1);
  } else {
    addEvent(ctx, Object.assign(base, {type:'gol', how}));
    S.goals++; S.stats[scorer.id].goals++;
    if(assistId) S.stats[assistId].assists++;
    pushMom(ctx, S, 0.38);
    if(S.stats[scorer.id].goals===3){
      addEvent(ctx, Object.assign(evBase(S,t,scorer), {type:'hat_trick'}));
    }
  }
}
function penaltyTaker(S){
  const pool = S.onPitch.filter(p=>p.position!=='POR');
  if(!pool.length) return null;
  return pickWeighted(pool, p=>scorerWeight(p,null,50)*(p.trait==='penal'?5:1));
}
function resolvePenalty(S, O, t, ctx, viaVar){
  const taker = penaltyTaker(S);
  if(!taker) return;
  if(viaVar){
    addEvent(ctx, Object.assign(evBase(S,t,taker), {type:'var_penal', reason:pick(VAR_PEN_REASONS)}));
  } else {
    addEvent(ctx, Object.assign(evBase(S,t,taker), {type:'penal_concedido'}));
  }
  O.box.fouls++;
  const gk = keeperOf(O);
  const pScore = clamp(0.76+((taker.tir??60)-60)/400-(((gk&&gk.ref)??60)-60)/500 - S.nerves*0.14, 0.42, 0.9);
  const base = evBase(S,t,taker);
  registerShot(S, taker, true);
  S.box.bigChances++;
  if(Math.random()<pScore){
    addEvent(ctx, Object.assign(base, {type:'gol_penal'}));
    S.goals++; S.stats[taker.id].goals++; S.stats[taker.id].penScored++;
    pushMom(ctx, S, 0.34);
  } else {
    const saved = Math.random()<0.55;
    addEvent(ctx, Object.assign(base, {type:'penal_fallado', reason:saved?'atajado':'desviado', keeperId:gk?gk.id:null}));
    S.stats[taker.id].penMissed++;
    if(saved && gk){ O.stats[gk.id].saves++; O.box.saves++; }
    pushMom(ctx, S, -0.22);
    // Rebote: a veces la pelota queda viva y entra igual
    if(saved && Math.random()<0.16){
      const rest = S.onPitch.filter(p=>p.id!==taker.id && p.position!=='POR');
      if(rest.length){
        const reb = pickWeighted(rest, p=>scorerWeight(p,S,t));
        addEvent(ctx, Object.assign(evBase(S,t,reb), {type:'gol', how:'rebote'}));
        S.goals++; S.stats[reb.id].goals++; registerShot(S, reb, true);
        pushMom(ctx, S, 0.3);
      }
    }
  }
}
function resolveCard(S, t, ctx, straight){
  if(!S.onPitch.length) return;
  const p = pickWeighted(S.onPitch, foulWeight);
  S.box.fouls++; S.stats[p.id].fouls++;
  if(straight){ sendOff(S,p,t,ctx,'directa'); return; }
  const y = S.yellow.get(p.id)||0;
  if(y>=1) sendOff(S,p,t,ctx,'segunda');
  else {
    S.yellow.set(p.id,1); S.stats[p.id].yellow++; S.box.yellow++;
    addEvent(ctx, Object.assign(evBase(S,t,p), {type:'amarilla', reason:pick(FOUL_REASONS)}));
  }
}
function resolveInjury(S, t, ctx){
  if(!S.onPitch.length) return;
  const v = pickWeighted(S.onPitch, p=>injuryWeight(p)*(1+(100-energyOf(S,p,t))/200));
  // Golpe leve: sigue en cancha pero rinde menos
  if(Math.random()<0.42){
    S.knocks.set(v.id, (S.knocks.get(v.id)||0)+14);
    S.stats[v.id].knock = true;
    addEvent(ctx, Object.assign(evBase(S,t,v), {type:'golpe'}));
    return;
  }
  const left = S.maxSubs - S.subsUsed;
  removeFromPitch(S, v, t);
  const inP = left>0 ? pickIn(S, v, 'same') : null;
  addEvent(ctx, Object.assign(evBase(S,t,v), {type:'lesion', noSub:!inP}));
  S.stats[v.id].injured = true;
  if(inP) applySub(S, v, inP, t, 'lesion', ctx, true);
  else if(v.position==='POR') handleKeeperLoss(S, t, ctx, 'lesion');
}
/* Ocasiones que no terminan en gol: palo, atajadas, salvadas sobre la línea, offsides... */
const FLAVOR_TABLE = [
  ['poste', 10], ['travesano', 7], ['atajada', 26], ['atajadon', 7], ['salvada_linea', 5],
  ['ocasion_fallada', 20], ['desviado', 16], ['fuera_de_juego', 9]
];
function resolveFlavor(S, O, t, ctx){
  if(!S.onPitch.length) return;
  const p = pickWeighted(S.onPitch, q=>scorerWeight(q,S,t));
  const kind = pickWeighted(FLAVOR_TABLE, x=>x[1])[0];
  const base = evBase(S,t,p);
  const gk = keeperOf(O);
  if(kind==='poste' || kind==='travesano'){
    registerShot(S, p, false); S.box.woodwork++; S.stats[p.id].post++; S.box.bigChances++;
    addEvent(ctx, Object.assign(base,{type:kind}));
    pushMom(ctx, S, 0.2);
  } else if(kind==='atajada' || kind==='atajadon'){
    registerShot(S, p, true);
    if(kind==='atajadon') S.box.bigChances++;
    addEvent(ctx, Object.assign(base,{type:kind, keeperId:gk?gk.id:null}));
    if(gk){ O.stats[gk.id].saves += (kind==='atajadon'?2:1); O.box.saves += (kind==='atajadon'?2:1); }
    pushMom(ctx, S, 0.14);
  } else if(kind==='salvada_linea'){
    registerShot(S, p, true); S.box.bigChances++;
    const field = O.onPitch.filter(x=>x.position!=='POR');
    const saver = field.length ? pickWeighted(field, x=>(x.position==='DEF'?3:1)) : null;
    addEvent(ctx, Object.assign(base,{type:'salvada_linea', saverId:saver?saver.id:null, saverTeamId:O.team.id}));
    pushMom(ctx, S, 0.18);
  } else if(kind==='fuera_de_juego'){
    S.box.offsides++; S.stats[p.id].offsides++;
    addEvent(ctx, Object.assign(base,{type:'fuera_de_juego'}));
  } else if(kind==='desviado'){
    registerShot(S, p, false);
    addEvent(ctx, Object.assign(base,{type:'desviado'}));
    pushMom(ctx, S, 0.08);
  } else {
    registerShot(S, p, true); S.box.bigChances++;
    addEvent(ctx, Object.assign(base,{type:'ocasion_fallada'})); S.stats[p.id].missed++;
    pushMom(ctx, S, 0.12);
  }
}
/* Córner peligroso: no siempre termina en algo, pero suma a la estadística */
function resolveCorner(S, O, t, ctx, loud){
  S.box.corners++;
  if(!loud || !S.onPitch.length) return;
  const p = pickWeighted(S.onPitch, q=>(q.trait==='cabeceador'?3:1)*((q.fis??60)/60));
  addEvent(ctx, Object.assign(evBase(S,t,p), {type:'corner'}));
  pushMom(ctx, S, 0.1);
}
/* Regate de lujo en el uno contra uno */
function resolveDribble(S, O, t, ctx){
  const pool = S.onPitch.filter(p=>p.position!=='POR' && ((p.tec??60)>62 || p.trait==='regate'));
  if(!pool.length) return;
  const p = pickWeighted(pool, q=>((q.tec??60)/60)*(q.trait==='regate'?3:1));
  S.stats[p.id].dribbles++;
  addEvent(ctx, Object.assign(evBase(S,t,p), {type:'regate'}));
  pushMom(ctx, S, 0.12);
}
/* Tangana: se calienta el partido y vuelan amonestaciones de los dos lados */
/* Tiempo que se suma al descuento cuando el juego se detiene por un incidente (peleas, invasiones, etc.).
   Nunca toca los eventos post-partido: esos ya se juegan fuera del descuento. */
function addStopBonus(ctx, t, mins){
  ctx.stopBonus = ctx.stopBonus || {1:0, 2:0};
  if(t<=45) ctx.stopBonus[1] += mins;
  else if(t>45 && t<=90) ctx.stopBonus[2] += mins;
}
function resolveScuffle(S, O, t, ctx){
  const a = S.onPitch.length ? pickWeighted(S.onPitch, foulWeight) : null;
  const b = O.onPitch.length ? pickWeighted(O.onPitch, foulWeight) : null;
  if(!a || !b) return;
  addEvent(ctx, {minute:t, display:formatMinute(t), type:'tangana', side:S.side, teamId:S.team.id, playerId:a.id, rivalId:b.id, rivalTeamId:O.team.id, clasico:!!ctx.rivalry});
  addStopBonus(ctx, t, 0.6+Math.random()*0.6);
  [[S,a],[O,b]].forEach(([X,pl])=>{
    X.box.fouls++;
    const y = X.yellow.get(pl.id)||0;
    if(y>=1) sendOff(X, pl, t, ctx, 'segunda');
    else { X.yellow.set(pl.id,1); X.stats[pl.id].yellow++; X.box.yellow++;
      addEvent(ctx, Object.assign(evBase(X,t,pl), {type:'amarilla', reason:'la trifulca'})); }
  });
}
/* Exclusivo de clásicos: algo cae desde la tribuna y el árbitro frena el partido un momento */
function resolveObjectThrow(S, t, ctx){
  addEvent(ctx, {minute:t, display:formatMinute(t), type:'objeto_cancha', side:S.side, teamId:S.team.id, object: pick(['un encendedor','una botella','una bengala apagada','una moneda'])});
  addStopBonus(ctx, t, 0.8+Math.random()*0.7);
}
/* Exclusivo de clásicos: bengalazo desde la popular, el humo tapa la cancha y hay que esperar a que se disipe */
function resolveFlareSmoke(S, t, ctx){
  addEvent(ctx, {minute:t, display:formatMinute(t), type:'bengalazo', side:S.side, teamId:S.team.id});
  addStopBonus(ctx, t, 1.6+Math.random()*1.4);
}
const REF_COMPLAINTS = ['un fuera de juego mal cobrado','una falta que no marcó','un posible penal que no cobró','una tarjeta que consideró injusta','un tiempo de descuento que le pareció escaso'];
/* Un jugador se calienta con el árbitro; a veces la protesta termina en amarilla */
function resolveRefereeArgument(S, t, ctx){
  if(!S.onPitch.length) return;
  const p = pickWeighted(S.onPitch, foulWeight);
  addEvent(ctx, Object.assign(evBase(S,t,p), {type:'discusion_arbitro', reason: pick(REF_COMPLAINTS)}));
  if(Math.random()<0.3){
    const y = S.yellow.get(p.id)||0;
    if(y>=1) sendOff(S,p,t,ctx,'segunda');
    else { S.yellow.set(p.id,1); S.stats[p.id].yellow++; S.box.yellow++;
      addEvent(ctx, Object.assign(evBase(S,t,p), {type:'amarilla', reason:'protestar de más'})); }
  }
}
/* El técnico se calienta desde el borde del área: primero una advertencia, después a las tribunas */
function resolveCoachMisconduct(S, t, ctx){
  S.dtWarnings = S.dtWarnings||0;
  if(S.dtWarnings>=2) return;
  S.dtWarnings++;
  addEvent(ctx, {minute:t, display:formatMinute(t), type: S.dtWarnings===1?'amonestacion_dt':'expulsion_dt', side:S.side, teamId:S.team.id});
}
/* Clásicos: al pitazo final, si el partido vino caliente, puede terminar en gresca con tarjetas para ambos planteles.
   Ocurre YA con el partido terminado, así que nunca cuenta como parte del descuento: se marca post:true y se
   muestra como "Post-partido" en vez de un minuto tipo 90+X, para no confundirlo con el tiempo agregado real. */
function resolvePostMatchClash(H, A, ctx, matchEnd){
  if(!ctx.rivalry) return;
  const close = Math.abs(H.goals-A.goals)<=1;
  const chance = 0.24 + (close?0.10:0) + (ctx.stakes||0)*0.15;
  if(Math.random()>=chance) return;
  const t = (matchEnd||90)+0.9;
  const post = {display:'Post-partido', post:true};
  addEvent(ctx, {minute:t, display:'Post-partido', post:true, type:'tension_final', side:'home', teamId:H.team.id});
  [H,A].forEach(S=>{
    if(!S.onPitch.length) return;
    const p = pickWeighted(S.onPitch, foulWeight);
    S.box.fouls++; S.stats[p.id].fouls++;
    if(Math.random()<0.5){ sendOff(S,p,t,ctx,'directa',post); }
    else {
      const y = S.yellow.get(p.id)||0;
      if(y>=1) sendOff(S,p,t,ctx,'segunda',post);
      else { S.yellow.set(p.id,1); S.stats[p.id].yellow++; S.box.yellow++;
        addEvent(ctx, Object.assign(evBase(S,t,p,post), {type:'amarilla', reason:'los empujones tras el pitazo final'})); }
    }
  });
  [H,A].forEach(S=>{
    if((S.dtWarnings||0)<2 && Math.random()<0.4){ S.dtWarnings=2; addEvent(ctx, {minute:t, display:'Post-partido', post:true, type:'expulsion_dt', side:S.side, teamId:S.team.id}); }
  });
}
function stepSide(S, O, rS, rO, t, ctx){
  const {rules, N, env} = ctx;
  const nOwn = S.onPitch.length, nOpp = O.onPitch.length;
  if(!nOwn) return;
  const diff = S.goals-O.goals;
  const manF = Math.pow(nOwn/11,1.3) * Math.pow(11/Math.max(6,nOpp),0.8);
  const momMul = 1 + 0.16*(S.side==='home' ? (ctx.mom||0) : -(ctx.mom||0));
  const home = S.side==='home' ? ctx.homeBoost : 0;
  const stakes = ctx.stakes==null ? 0.3 : ctx.stakes;
  const late = clamp((t-60)/32, 0, 1);
  // Al que va perdiendo se le va el equipo arriba; al rival se le abren los espacios
  const urgency = diff<0 ? 1 + 0.22*stakes*late*Math.min(2,-diff) : 1;
  const oppOpen = (O.goals<S.goals && t>72) ? 1 + 0.18*stakes*late : 1;
  const nerveDrop = 1 - S.nerves*0.13;
  const lam = expectedGoals(rS.attack, rO.defense, home) * S.mAtt * O.mOpp * stateMod(diff,t)
    * manF * momMul * env.goal * urgency * oppOpen * nerveDrop;
  const pAtt = lam/(rules.varOn ? (1-VAR_DISALLOW_CHANCE) : 1)/N;
  if(Math.random()<pAtt) resolveGoalAttempt(S,O,t,ctx);
  if(Math.random()<0.145/N) resolvePenalty(S,O,t,ctx,false);
  if(rules.varOn && Math.random()<0.035/N) resolvePenalty(S,O,t,ctx,true);
  if(Math.random()<1.4*env.err*(1+S.nerves*0.55)/N) resolveCard(S,t,ctx,false);
  if(Math.random()<0.05*(1+S.nerves*0.8)/N) resolveCard(S,t,ctx,true);
  if(Math.random()<0.16*env.drain*(1+S.nerves*0.25)/N) resolveInjury(S,t,ctx);
  if(Math.random()<2.6/N) resolveFlavor(S,O,t,ctx);
  if(Math.random()<0.5/N) resolveDribble(S,O,t,ctx);
  // Córners: la mayoría solo suman a la estadística
  const cw = 5.2*Math.pow(manF,0.5);
  if(Math.random()<cw/N) resolveCorner(S,O,t,ctx, Math.random()<0.09);
  // Faltas sin tarjeta
  if(Math.random()<9.5*env.err/N){ S.box.fouls++; }
  // Remates sin peligro que solo suman a la estadística
  if(Math.random()<6/N){ const p=pick(S.onPitch); if(p) registerShot(S,p,Math.random()<0.28); }
  // Offsides silenciosos
  if(Math.random()<1.6/N){ S.box.offsides++; }
  // Discusiones y calentura: mucho más frecuentes en los clásicos
  if(Math.random() < (ctx.rivalry?2.6:0.55)*(1+S.nerves*0.4)/N) resolveRefereeArgument(S,t,ctx);
  if(Math.random() < (ctx.rivalry?1.1:0.16)/N) resolveCoachMisconduct(S,t,ctx);
}
function computeRating(p, st, S){
  if(st.min<=0) return null;
  const O = S.opp, conceded = O.goals, scored = S.goals;
  const w = clamp(0.4+st.min/90*0.6, 0.4, 1);
  let base = (playerOverall(p)-62)/100*1.1;
  base += scored>conceded ? 0.28 : scored<conceded ? -0.28 : 0;
  if(conceded===0 && st.min>=60) base += p.position==='POR'?0.9 : p.position==='DEF'?0.5 : p.position==='MED'?0.15 : 0;
  if(conceded>0 && st.min>=40){ if(p.position==='POR') base -= 0.3*conceded; else if(p.position==='DEF') base -= 0.18*conceded; }
  base += gauss()*0.32;
  base *= w;
  let ev = st.goals*1.05 + st.assists*0.65 + st.saves*0.32 + st.post*0.06 + st.dribbles*0.07
    - st.missed*0.15 - st.yellow*0.3 - st.red*1.7 - st.penMissed*0.9 - st.ownGoals*1.1 - st.offsides*0.05;
  return Math.round(clamp(6+base+ev, 3, 10)*10)/10;
}
/* Reparte la posesión y calcula el % de pases completados */
function finishBox(H, A){
  const tot = H.box.possW + A.box.possW;
  let hp = tot>0 ? (H.box.possW/tot)*100 : 50;
  hp = clamp(Math.round(hp), 30, 70);
  H.box.possession = hp; A.box.possession = 100-hp;
  [[H,A],[A,H]].forEach(([S,O])=>{
    S.box.passes = Math.round(70 + S.box.possession*7.4 + rnd(-40,40));
    const avgNerv = S.nervN ? S.nervSum/S.nervN : 0;
    S.box.passAcc = clamp(Math.round(78 + (S.box.possession-50)*0.45 - avgNerv*9 + rnd(-4,4)), 58, 93);
    S.box.shots = Math.max(S.box.shots, S.box.on);
    // Todo remate al arco que no terminó en gol lo sacó el arquero
    const stopped = Math.max(0, O.box.on - O.goals);
    S.box.saves = clamp(Math.max(S.box.saves, Math.round(stopped*0.85)), 0, stopped);
  });
}
function simulateMatchEngine(teamA, teamB, opts){
  opts = opts||{};
  const rules = Object.assign({}, DEFAULT_RULES, opts.rules||{});
  const s1 = 1+Math.floor(Math.random()*4), s2 = 2+Math.floor(Math.random()*5);
  const moments = [];
  for(let i=1;i<=45;i++) moments.push(i);
  for(let k=1;k<=s1;k++) moments.push(45+k*0.1);
  for(let i=46;i<=90;i++) moments.push(i);
  for(let k=1;k<=s2;k++) moments.push(90+k*0.1);
  const N = moments.length;
  const wx = opts.weather ? weatherOf(opts.weather) : rollWeather();
  // El estadio y el público se definen antes: la localía pesa más con la cancha llena,
  // y las tribunas techadas atenúan el efecto de la lluvia, el viento y la niebla sobre el juego.
  const stadium = getStadium(teamA);
  const shelter = stadium.roof && (wx.v==='lluvia'||wx.v==='tormenta'||wx.v==='viento'||wx.v==='niebla');
  const env = {
    drain: shelter ? 1+(wx.drain-1)*0.5 : wx.drain,
    err: shelter ? 1+(wx.err-1)*0.4 : wx.err,
    goal: shelter ? 1+(wx.goal-1)*0.4 : wx.goal,
    wind: (wx.v==='viento'||wx.v==='tormenta') && !stadium.roof
  };
  const fill = clamp(0.5+(teamOvr(teamA)-55)/120+Math.random()*0.3, 0.3, 1);
  const attendance = Math.round((stadium.capacity||20000)*fill);
  // Las tribunas "clásicas", pegadas a la cancha, meten más ruido y presión sobre el rival
  const homeBoost = 0.08 + 0.16*fill + (stadium.shape==='clasico' ? 0.02 : 0);
  const H = makeSide(teamA,'home', buildLineup(teamA.players, teamA.tactic, opts.unavailA), rules, env);
  const A = makeSide(teamB,'away', buildLineup(teamB.players, teamB.tactic, opts.unavailB), rules, env);
  H.opp = A; A.opp = H;
  const events = [];
  const stakes0 = opts.stakes==null ? 0.3 : clamp(opts.stakes, 0, 1);
  const rivalry = !!(teamA.rivalId && teamA.rivalId===teamB.id);
  const stakes = rivalry ? Math.min(1, stakes0+0.32) : stakes0; // un clásico siempre se juega más caliente
  const ctx = {rules, N, events, env, mom:0, homeBoost, stakes, rivalry};
  /* Un minuto de juego: se reutiliza igual en el tiempo reglamentario y en la prórroga */
  function runTick(t){
    if(Number.isInteger(t) && SUB_WINDOWS.includes(t)){
      (Math.random()<0.5 ? [H,A] : [A,H]).forEach(S=>decideSubs(S,t,t===46,ctx));
    }
    if(Number.isInteger(t) && (t===63 || t===70 || t===78)){ [H,A].forEach(S=>maybeShift(S,t,ctx)); }
    if(wx.v==='calor' && (t===29 || t===73)){
      addEvent(ctx, {minute:t, display:formatMinute(t), type:'hidratacion', side:'home', teamId:teamA.id});
    }
    ctx.mom *= 0.93;
    [H,A].forEach(S=>{
      S.temple = templeOf(S);
      S.nerves = nervesOf(S, S.opp, t, ctx);
      S.nervSum += S.nerves; S.nervN++;
    });
    const rH = sideRatings(H,t), rA = sideRatings(A,t);
    // Posesión: manda quien tiene mejor mitad de cancha y más gente
    H.box.possW += rH.mid*Math.pow(H.onPitch.length/11,1.4)*(H.mentality==='ofensiva'?1.06:H.mentality==='defensiva'?0.93:1);
    A.box.possW += rA.mid*Math.pow(A.onPitch.length/11,1.4)*(A.mentality==='ofensiva'?1.06:A.mentality==='defensiva'?0.93:1);
    if(Math.random() < (ctx.rivalry?0.85:0.26)/ctx.N && t>20 && t<88){
      const first = Math.random()<0.5 ? H : A;
      resolveScuffle(first, first.opp, t, ctx);
    }
    // Incidencias propias del clásico: variadas para que no sea siempre lo mismo (invasión, objetos, bengalazo)
    if(ctx.rivalry){
      if(Number.isInteger(t) && t>76 && t<91 && Math.random() < 1.1/ctx.N){
        addEvent(ctx, {minute:t, display:formatMinute(t), type:'invasion_cancha', side:'home', teamId:teamA.id, clasico:true});
        addStopBonus(ctx, t, 2.5+Math.random()*2.5);
      }
      if(t>10 && t<85 && Math.random() < 0.5/ctx.N){ resolveObjectThrow(Math.random()<0.5?H:A, t, ctx); }
      if(t>15 && t<80 && Math.random() < 0.4/ctx.N){ resolveFlareSmoke(Math.random()<0.5?H:A, t, ctx); }
    }
    (Math.random()<0.5 ? [[H,rH,rA],[A,rA,rH]] : [[A,rA,rH],[H,rH,rA]]).forEach(([S,rS,rO])=>stepSide(S,S.opp,rS,rO,t,ctx));
  }
  moments.forEach(runTick);
  // El descuento final refleja lo que pasó: si hubo peleas, invasión o bengalazo, se juega considerablemente más
  const stopBonus = ctx.stopBonus || {1:0,2:0};
  const s1Final = Math.min(11, Math.round(s1 + stopBonus[1]));
  const s2Final = Math.min(15, Math.round(s2 + stopBonus[2]));

  // Prórroga: si el cruce necesita un ganador y sigue empatado, se juegan dos tiempos de 15' antes de ir a penales.
  // ctx.N se deja intacto a propósito: al dividir por la misma base de ~90', la prórroga aporta
  // una porción de gol esperado proporcional a su duración real, en vez de "diluir" el partido entero.
  let extraTime = false, stoppageET1 = 0, stoppageET2 = 0;
  if(opts.decisive && H.goals===A.goals){
    extraTime = true;
    stoppageET1 = Math.random()<0.55 ? 1 : 2;
    stoppageET2 = Math.random()<0.6 ? 1 : 2;
    ctx.stakes = Math.min(1, stakes + 0.15); // nadie quiere llegar a los penales
    const etMoments = [];
    for(let i=91;i<=105;i++) etMoments.push(i);
    for(let k=1;k<=stoppageET1;k++) etMoments.push(105+k*0.1);
    for(let i=106;i<=120;i++) etMoments.push(i);
    for(let k=1;k<=stoppageET2;k++) etMoments.push(120+k*0.1);
    etMoments.forEach(runTick);
  }

  finishBox(H, A);
  resolvePostMatchClash(H, A, ctx, extraTime?120:90);
  // Minutos jugados y puntuaciones
  const matchEnd = extraTime ? 120 : 90;
  const pstats = {};
  [H,A].forEach(S=>{
    [...S.lineup.starting, ...S.lineup.bench].forEach(p=>{
      const st = S.stats[p.id];
      if(S.enteredAt.has(p.id)){
        const start = minuteInt(S.enteredAt.get(p.id));
        const end = S.leftAt.has(p.id) ? minuteInt(S.leftAt.get(p.id)) : matchEnd;
        st.min = clamp(end-start, 0, matchEnd);
        if(st.min===0 && st.started) st.min = 1;
      }
      st.rating = computeRating(p, st, S);
      pstats[p.id] = st;
    });
  });
  let motmPlayerId = null, best = -Infinity;
  Object.keys(pstats).forEach(id=>{
    const st = pstats[id]; if(st.rating==null) return;
    const score = st.rating + st.goals*0.01 + Math.random()*0.001;
    if(score>best){ best=score; motmPlayerId=id; }
  });
  events.sort((a,b)=>a.minute-b.minute);
  return {
    homeGoals:H.goals, awayGoals:A.goals, events, motmPlayerId, stoppage1:s1Final, stoppage2:s2Final,
    extraTime, stoppageET1, stoppageET2,
    weather: wx.v, stakes,
    nerves: {home: H.nervN?Math.round(H.nervSum/H.nervN*100):0, away: A.nervN?Math.round(A.nervSum/A.nervN*100):0},
    box: {home:H.box, away:A.box},
    onPitchEnd: {home:H.onPitch.map(p=>p.id), away:A.onPitch.map(p=>p.id)},
    lineups:{
      home:{formation:H.formation, starting:H.lineup.starting.map(p=>p.id), bench:H.lineup.bench.map(p=>p.id)},
      away:{formation:A.formation, starting:A.lineup.starting.map(p=>p.id), bench:A.lineup.bench.map(p=>p.id)}
    },
    pstats,
    venue:{teamId:teamA.id, name:stadium.name, nickname:stadium.nickname||null, attendance, sheltered:!!shelter}
  };
}
/* Tanda de penales con ejecutores reales y muerte súbita */
function simulatePenalties(teamA, teamB, res){
  const takersOf = (team, ids)=>{
    const onPitch = (ids||[]).map(id=>team.players.find(p=>p.id===id)).filter(Boolean);
    const pool = (onPitch.length>=5 ? onPitch : team.players.slice(0,11));
    const field = pool.filter(p=>p.position!=='POR');
    const list = (field.length>=5 ? field : pool).slice();
    list.sort((a,b)=> (b.trait==='penal'?40:0)+finishing(b) - ((a.trait==='penal'?40:0)+finishing(a)) );
    return list;
  };
  const gkOf = (team, ids)=>{
    const onPitch = (ids||[]).map(id=>team.players.find(p=>p.id===id)).filter(Boolean);
    return onPitch.find(p=>p.position==='POR') || team.players.find(p=>p.position==='POR') || null;
  };
  const TA = takersOf(teamA, res && res.onPitchEnd ? res.onPitchEnd.home : null);
  const TB = takersOf(teamB, res && res.onPitchEnd ? res.onPitchEnd.away : null);
  const gkA = gkOf(teamA, res && res.onPitchEnd ? res.onPitchEnd.home : null);
  const gkB = gkOf(teamB, res && res.onPitchEnd ? res.onPitchEnd.away : null);
  if(!TA.length || !TB.length){
    let a,b; do{ a=3+Math.floor(Math.random()*4); b=3+Math.floor(Math.random()*4); }while(a===b);
    return {a, b, seq:[]};
  }
  const seq = [];
  let a=0, b=0, ia=0, ib=0, sa=0, sb=0;
  const shoot = (taker, gk, pressure)=>{
    const p = clamp(0.74 + ((taker.tir??60)-60)/380 - (((gk&&gk.ref)??60)-60)/460 - pressure, 0.42, 0.93);
    if(Math.random()<p) return {scored:true};
    return {scored:false, reason: Math.random()<0.55 ? 'atajado' : pick(['desviado','al palo'])};
  };
  const round = (side)=>{
    const isA = side==='home';
    const list = isA?TA:TB, idx = isA?ia++:ib++;
    const taker = list[idx % list.length];
    const gk = isA?gkB:gkA;
    const behind = isA ? b-a : a-b;
    const pressure = clamp((idx>=4?0.05:0) + Math.max(0,behind)*0.02, 0, 0.13);
    const r = shoot(taker, gk, pressure);
    if(r.scored){ if(isA) a++; else b++; }
    if(isA) sa++; else sb++;
    seq.push({side, playerId:taker.id, teamId:(isA?teamA:teamB).id, scored:r.scored, reason:r.reason||null, keeperId:gk?gk.id:null, num:seq.length+1});
  };
  // Serie de cinco: se corta en cuanto uno ya no puede ser alcanzado
  const decided = ()=>{
    const ra = Math.max(0, 5-sa), rb = Math.max(0, 5-sb);
    return a > b + rb || b > a + ra;
  };
  for(let k=0;k<5;k++){
    if(decided()) break;
    round('home');
    if(decided()) break;
    round('away');
  }
  // Muerte súbita: de a un par hasta que alguien falle
  let guard = 0;
  while(a===b && guard++ < 30){ round('home'); round('away'); }
  return {a, b, seq};
}


/* ---------- Competiciones: partidos y fixture ---------- */
function compRules(c){ return Object.assign({}, DEFAULT_RULES, (c&&c.rules)||{}); }
function newMatchObj(a, b, extra){
  return Object.assign({id:uid(), teamAId:a, teamBId:b, played:false, homeGoals:null, awayGoals:null, events:[], motmPlayerId:null}, extra||{});
}
function blankBracketMatch(a, b){
  return {id:uid(), teamAId:a||null, teamBId:b||null, played:false, isBye:false, homeGoals:null, awayGoals:null, penA:null, penB:null, winnerId:null, events:[], motmPlayerId:null};
}
function roundRobinRounds(teamIds, legs, group){
  let ids=[...teamIds]; if(ids.length%2!==0) ids.push(null);
  const n=ids.length; const rounds=[];
  const ex = group!=null ? {group} : null;
  for(let r=0;r<n-1;r++){
    const roundMatches=[];
    for(let i=0;i<n/2;i++){
      const a=ids[i], b=ids[n-1-i];
      if(a!==null && b!==null){
        const home = r%2===0? a:b, away = r%2===0? b:a;
        roundMatches.push(newMatchObj(home, away, ex));
      }
    }
    rounds.push(roundMatches);
    const fixed=ids[0]; const rest=ids.slice(1); rest.unshift(rest.pop()); ids=[fixed,...rest];
  }
  if(legs===2){
    const second = rounds.map(rm=>rm.map(m=>newMatchObj(m.teamBId, m.teamAId, ex)));
    return rounds.concat(second);
  }
  return rounds;
}
function createGroups(teamIds, nGroups, seeding){
  let ids = seeding==='ranking'
    ? [...teamIds].sort((a,b)=>teamOvr(findTeam(b))-teamOvr(findTeam(a)))
    : shuffle(teamIds);
  const groups = Array.from({length:nGroups}, (_,i)=>({name:'Grupo '+String.fromCharCode(65+i), teamIds:[]}));
  ids.forEach((id,i)=>{
    const row=Math.floor(i/nGroups), col=i%nGroups;
    groups[row%2===0 ? col : nGroups-1-col].teamIds.push(id);
  });
  return groups;
}
function mergeGroupRounds(groups, legs){
  const per = groups.map((g,gi)=>roundRobinRounds(g.teamIds, legs, gi));
  const max = Math.max(...per.map(r=>r.length));
  const rounds=[];
  for(let r=0;r<max;r++) rounds.push(per.flatMap(rs=>rs[r]||[]));
  return rounds;
}
function possibleGroupCounts(nTeams){ return [2,4,8].filter(g=>nTeams>=g*3); }

/* ---------- Tabla de posiciones ---------- */
function computeStandings(comp, gi){
  const R = compRules(comp);
  const ids = gi==null ? comp.teamIds : comp.groups[gi].teamIds;
  const table={};
  ids.forEach(id=> table[id]={teamId:id, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,fp:0});
  const ms = (comp.rounds||[]).flat().filter(m=>m.played && (gi==null || m.group===gi));
  ms.forEach(m=>{
    const A=table[m.teamAId], B=table[m.teamBId]; if(!A||!B) return;
    A.pj++; B.pj++; A.gf+=m.homeGoals; A.gc+=m.awayGoals; B.gf+=m.awayGoals; B.gc+=m.homeGoals;
    if(m.homeGoals>m.awayGoals){ A.pg++; A.pts+=R.pointsWin; B.pp++; }
    else if(m.homeGoals<m.awayGoals){ B.pg++; B.pts+=R.pointsWin; A.pp++; }
    else { A.pe++; B.pe++; A.pts+=R.pointsDraw; B.pts+=R.pointsDraw; }
    (m.events||[]).forEach(e=>{
      const T = e.teamId===m.teamAId ? A : B;
      if(e.type==='amarilla') T.fp+=1;
      if(e.type==='roja') T.fp+=3;
    });
  });
  return sortStandings(Object.values(table), ms, R);
}
function sortStandings(rows, ms, R){
  const tb = R.tiebreak;
  const gd = r=>r.gf-r.gc;
  const tie = (x,y)=>{
    if(tb==='gf') return (y.gf-x.gf)||(gd(y)-gd(x));
    if(tb==='fairplay') return (x.fp-y.fp)||(gd(y)-gd(x))||(y.gf-x.gf);
    return (gd(y)-gd(x))||(y.gf-x.gf);
  };
  rows.sort((x,y)=> y.pts-x.pts || tie(x,y));
  if(tb==='h2h'){
    let i=0;
    while(i<rows.length){
      let j=i; while(j+1<rows.length && rows[j+1].pts===rows[i].pts) j++;
      if(j>i){
        const block = rows.slice(i,j+1);
        const ids = new Set(block.map(r=>r.teamId));
        const mini={}; block.forEach(r=>mini[r.teamId]={pts:0,gd:0,gf:0});
        ms.forEach(m=>{
          if(ids.has(m.teamAId)&&ids.has(m.teamBId)){
            const a=mini[m.teamAId], b=mini[m.teamBId];
            a.gf+=m.homeGoals; b.gf+=m.awayGoals; a.gd+=m.homeGoals-m.awayGoals; b.gd+=m.awayGoals-m.homeGoals;
            if(m.homeGoals>m.awayGoals) a.pts+=R.pointsWin; else if(m.homeGoals<m.awayGoals) b.pts+=R.pointsWin; else { a.pts+=R.pointsDraw; b.pts+=R.pointsDraw; }
          }
        });
        block.sort((x,y)=> mini[y.teamId].pts-mini[x.teamId].pts || mini[y.teamId].gd-mini[x.teamId].gd || mini[y.teamId].gf-mini[x.teamId].gf || tie(x,y));
        rows.splice(i, block.length, ...block);
      }
      i=j+1;
    }
  }
  return rows;
}
function isLeagueFinished(comp){ return (comp.rounds||[]).length>0 && (comp.rounds||[]).flat().every(m=>m.played); }

/* ---------- Eliminación: llave ---------- */
function seedOrder(size){
  let order=[1];
  while(order.length<size){ const n=order.length*2; order = order.flatMap(s=>[s, n+1-s]); }
  return order;
}
function createKnockoutBracket(teamIds, opts){
  opts = opts||{};
  const teams = [...teamIds];
  let size=1; while(size<teams.length) size*=2;
  const numMatches = size/2;
  const round1=[];
  const mk = (a,b)=>{ const m=blankBracketMatch(a,b); if(!a||!b){ m.isBye=true; m.played=true; m.winnerId=a||b; } return m; };
  if(opts.seeding==='ordered'){
    // Se respeta el cruce ya armado; si no es potencia de 2, los byes van al final sin desordenar nada
    const byes = size - teams.length;
    const list = byes>0 ? [...teams, ...Array(byes).fill(null)] : teams;
    for(let i=0;i<numMatches;i++) round1.push(mk(list[2*i], list[2*i+1]));
  } else if(opts.seeding==='ranking'){
    const sorted=[...teams].sort((a,b)=>teamOvr(findTeam(b))-teamOvr(findTeam(a)));
    const order=seedOrder(size);
    for(let i=0;i<numMatches;i++) round1.push(mk(sorted[order[2*i]-1]||null, sorted[order[2*i+1]-1]||null));
  } else {
    const real = shuffle(teams);
    const byes = size - real.length;
    const As = real.slice(0,numMatches);
    const Bs = shuffle([...real.slice(numMatches), ...Array(byes).fill(null)]);
    for(let i=0;i<numMatches;i++) round1.push(mk(As[i], Bs[i]));
  }
  const rounds=[round1];
  let count=round1.length;
  while(count>1){ count/=2; const r=[]; for(let i=0;i<count;i++) r.push(blankBracketMatch()); rounds.push(r); }
  const third = (opts.thirdPlace && (size>=8 || teams.length===4)) ? Object.assign(blankBracketMatch(), {isThird:true}) : null;
  const bracket = {rounds, third};
  propagateWinners(bracket);
  return bracket;
}
function propagateWinners(bracket){
  const rounds = bracket.rounds;
  for(let r=0;r<rounds.length-1;r++){
    rounds[r].forEach((m,i)=>{
      if(m.played && m.winnerId){
        const next = rounds[r+1][Math.floor(i/2)];
        if(i%2===0) next.teamAId = m.winnerId; else next.teamBId = m.winnerId;
      }
    });
  }
  if(bracket.third && rounds.length>=2){
    const semis = rounds[rounds.length-2];
    const losers = semis.map(m=> (m.played && !m.isBye && m.winnerId) ? (m.winnerId===m.teamAId ? m.teamBId : m.teamAId) : null);
    bracket.third.teamAId = losers[0]||null; bracket.third.teamBId = losers[1]||null;
  }
}
function roundName(idx, total){
  const fromEnd = total-1-idx;
  if(fromEnd===0) return 'Final';
  if(fromEnd===1) return 'Semifinal';
  if(fromEnd===2) return 'Cuartos de Final';
  if(fromEnd===3) return 'Octavos de Final';
  return 'Ronda '+(idx+1);
}
function bracketFinal(b){ const last=b.rounds[b.rounds.length-1]; return last.length===1 ? last[0] : null; }
function bracketChampion(bracket){
  const f = bracketFinal(bracket);
  return f && f.played && f.winnerId ? f.winnerId : null;
}
function bracketComplete(b){
  if(!bracketChampion(b)) return false;
  return !b.third || b.third.played;
}
function bracketMatches(b){ return b.rounds.flat().concat(b.third?[b.third]:[]); }
function bracketOffset(c){ return c.format==='grupos' && c.rounds ? c.rounds.length : 0; }

/* ---------- Estado de la copa ---------- */
/* Arma la llave final cruzando grupos de a pares: el 1º de un grupo enfrenta al último
   clasificado del otro, el 2º al anteúltimo, y así — para no repetir rivales de la fase de grupos. */
function startKnockout(comp){

      const A = tables[p], B = tables[p+1];
      for(let r=0;r<Q;r++){
        if(A[r] && B[Q-1-r]) ordered.push(A[r].teamId, B[Q-1-r].teamId);
      }
    }
  } else {
    // Con una cantidad impar de grupos no hay una pareja natural: se ordena por posición global
    for(let r=0;r<Q;r++) tables.forEach(t=>{ if(t[r]) ordered.push(t[r].teamId); });

  if(comp.format==='liga'){
    const st = computeStandings(comp);
    r.championId = st[0]?st[0].teamId:null; r.runnerUpId = st[1]?st[1].teamId:null; r.thirdId = st[2]?st[2].teamId:null;
  } else if(comp.bracket){
    const b = comp.bracket, fin = bracketFinal(b);

    if(b.third && b.third.played) r.thirdId = b.third.winnerId;

  [r.championId, r.runnerUpId, r.thirdId].forEach(id=>{ if(id){ const t=findTeam(id); r.names[id]=t?t.name:'Equipo eliminado'; } });
  const scorers = aggregateStats([comp]).filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals || b.assists-a.assists);

  r.currency = P.currency||'$';

  add(r.championId,'Campeón',P.champion); add(r.runnerUpId,'Subcampeón',P.runnerUp); add(r.thirdId,'Tercer puesto',P.third);
