/* ---------- Sistema de ligas: pantallas ---------- */
const DIV_COLORS = ['#C6941B','#8A98A0','#B0713C','#4A6B8A','#6B7280'];
function divColor(level){ return DIV_COLORS[Math.min(level-1, DIV_COLORS.length-1)]; }
function divRoman(level){ return ['I','II','III','IV','V'][level-1] || String(level); }

function screenLeaguesList(){
  const ls = data.leagues||[];
  if(!ls.length){
    return `<div class="empty-state"><span class="em">🗺️</span><b>Todavía no hay ligas</b>Arma el fútbol de un país entero: primera división, ascenso, descensos y campeón temporada tras temporada.</div>
      <button class="btn btn-primary" onclick="App.newLeagueForm()">+ Crear liga</button>`;
  }
  const cards = ls.map(l=>{
    const ds = divisionsSorted(l);
    const started = leagueSeasonStarted(l);
    const done = leagueSeasonFinished(l);
    const total = ds.reduce((n,d)=>{ const c=divisionComp(d); return n + (c ? allMatchesOf(c).filter(m=>!m.isBye).length : 0); }, 0);
    const played = ds.reduce((n,d)=>{ const c=divisionComp(d); return n + (c ? allMatchesOf(c).filter(m=>m.played).length : 0); }, 0);
    const pct = total ? Math.round(played/total*100) : 0;
    const estado = !started ? 'Sin empezar' : done ? 'Temporada terminada' : pct+'% jugado';
    return `<div class="card comp-card" onclick="App.openLeague('${l.id}')">
      ${cupBannerHTML({name:l.name, season:seasonName(l), sponsor:ds.length+(ds.length===1?' división':' divisiones')+' · '+leagueTeamCount(l)+' equipos', style:l.style, prize:null, teamIds:[], format:'liga'}, true)}
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <span class="season-pill">📅 ${esc(seasonName(l))}</span>
        <span class="season-pill">${done?'🏁':started?'▶️':'⏳'} ${esc(estado)}</span>
        ${l.history && l.history.length ? `<span class="season-pill">🏆 ${l.history.length} ${l.history.length===1?'temporada jugada':'temporadas jugadas'}</span>` : ''}
      </div>
      ${started && !done ? `<div class="div-prog" style="margin-top:9px;"><i style="width:${pct}%"></i></div>` : ''}
    </div>`;
  }).join('');
  return `${cards}<button class="btn btn-primary" style="margin-top:6px" onclick="App.newLeagueForm()">+ Crear liga</button>`;
}

/* ----- Tabla con zonas de campeón, playoff, ascenso y descenso ----- */
function divisionZones(l, div, n){
  const z = {};
  const pro = promoteCount(l, div), rel = relegateCount(l, div);
  if(div.format==='grupos'){
    // El descenso en formato de grupos se decide en la tabla general (anual), no adentro de cada grupo
    for(let i=0;i<Math.min(div.qualify||2, n);i++) z[i]='z-pl';
    return z;
  }
  z[0] = 'z-camp';
  for(let i=1;i<Math.min(pro, n);i++) z[i]='z-asc';
  for(let i=Math.max(0,n-rel);i<n;i++) z[i]='z-des';
  return z;
}
function zoneTableHTML(c, rows, zones, podium, gi){
  const prevMap = prevPositionsMap(c, gi);
  const body = rows.map((r,i)=> standingsRowHTML(c, r, i, gi, prevMap, `${zones[i]||''}${podium && i===1 ? ' pos2':''}`, 'z')).join('');
  return `<div class="card" style="overflow-x:auto;"><table class="standings">
    <thead>${standingsHeadRow()}</thead>
    <tbody>${body}</tbody>
  </table></div>${shareStandingsBtnHTML(c.id, gi==null?null:gi)}`;
}
function zoneKeyHTML(l, div){
  const pro = promoteCount(l, div), rel = relegateCount(l, div);
  const bits = [];
  if(div.format==='grupos') bits.push(`<span><i style="background:#1D8FE1"></i>Clasifica al playoff</span>`);
  else {
    bits.push(`<span><i style="background:var(--gold)"></i>Campeón</span>`);
    bits.push(`<span><i style="background:var(--silver)"></i>Subcampeón</span>`);
  }
  if(pro>0) bits.push(`<span><i style="background:#1B9E5A"></i>Asciende (${pro})</span>`);
  if(rel>0) bits.push(`<span><i style="background:var(--danger)"></i>Desciende (${rel})</span>`);
  return bits.length ? `<div class="zone-key">${bits.join('')}</div>` : '';
}

function screenLeagueDetail(){
  const l = findLeague(ui.selectedLeagueId);
  if(!l) return `<div class="empty-state">Liga no encontrada.</div>`;
  const tabs = [['temporada','Temporada'],['tablas','Tablas'],['historial','Historial'],['info','Info']];
  if(!tabs.some(t=>t[0]===ui.leagueTab)) ui.leagueTab='temporada';
  let body;
  if(ui.leagueTab==='tablas') body = leagueTablesHTML(l);
  else if(ui.leagueTab==='historial') body = leagueHistoryHTML(l);
  else if(ui.leagueTab==='info') body = leagueInfoHTML(l);
  else body = leagueSeasonHTML(l);
  return `
    ${cupBannerHTML({name:l.name, season:seasonName(l), sponsor:l.divisions.length+(l.divisions.length===1?' división':' divisiones'), style:l.style, prize:null, teamIds:[], format:'liga'}, false)}
    <div class="seg" style="margin-top:12px;">${tabs.map(([k,lb])=>`<button class="${ui.leagueTab===k?'active':''}" onclick="App.setLeagueTab('${k}')">${lb}</button>`).join('')}</div>
    ${body}`;
}

function leagueSeasonHTML(l){
  const ds = divisionsSorted(l);
  const issues = leagueIssues(l);
  const started = leagueSeasonStarted(l);
  const done = leagueSeasonFinished(l);
  if(!ds.length) return `<div class="empty-state" style="padding:30px 16px;"><span class="em">📋</span><b>Esta liga no tiene divisiones</b>Edítala para agregar al menos una.</div>
    <button class="btn btn-secondary" onclick="App.editLeagueForm('${l.id}')">Editar liga</button>`;
  if(!started && issues.length){
    return `<div class="issue-box"><b>Falta resolver esto antes de empezar</b><ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <button class="btn btn-secondary" onclick="App.editLeagueForm('${l.id}')">Editar liga</button>`;
  }
  const cards = ds.map(d=>{
    const c = divisionComp(d);
    const ms = c ? allMatchesOf(c).filter(m=>!m.isBye) : [];
    const played = ms.filter(m=>m.played).length;
    const pct = ms.length ? Math.round(played/ms.length*100) : 0;
    let lead = '';
    if(c){
      if(c.status==='finalizada'){
        const ch = compChampionId(c);
        lead = ch ? `<div class="div-lead">🏆 <b>${esc(teamName(ch))}</b> <span class="dim">campeón</span></div>` : '';
      } else if(played){
        const st = computeStandings(c);

    actions = `<button class="btn btn-gold" onclick="App.startSeason('${l.id}')">▶ Empezar ${esc(seasonName(l))}</button>`;
  } else if(done){
    const nextLbl = seasonName(l, l.season+1);
    actions = `<div class="card" style="padding:14px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:22px;">Temporada terminada</div>
        <p class="hint" style="margin:6px 0 12px;">Al cerrarla se aplican los ascensos y descensos y arranca ${esc(nextLbl)}.</p>
        <button class="btn btn-gold" onclick="App.closeSeason('${l.id}')">🏁 Cerrar temporada y aplicar ascensos</button>
      </div>`;

        <button class="btn btn-gold" onclick="App.simulateLeagueSeason('${l.id}')">⏩ Simular toda la temporada</button>

/* ---------- Premios de la temporada y once ideal ---------- */
function awardCandidates(stats){
  const list = stats.map(st=>{
    const f = findPlayerGlobal(st.id); if(!f) return null;
    return Object.assign({}, st, {pos:f.player.position, age:f.player.age||24, teamId:f.team.id, player:f.player, team_:f.team});
  }).filter(Boolean);
  const maxN = list.reduce((m,x)=>Math.max(m,x.ratingN),0);
  return {list, minN: Math.max(1, Math.ceil(maxN*0.5))};
}
function seasonAwards(stats){
  const {list, minN} = awardCandidates(stats);
  const rated = list.filter(x=>x.ratingN>=minN);
  const best = (arr, fn)=> arr.length ? arr.slice().sort((a,b)=>fn(b)-fn(a))[0] : null;
  const rk = x=> x.avgRating*1000 + x.motm*10 + x.contrib;
  return {
    ballon: best(rated, rk),
    boot: best(list.filter(x=>x.goals>0), x=>x.goals*1000 + x.assists*10 - x.apps*0.01),
    assist: best(list.filter(x=>x.assists>0), x=>x.assists*1000 + x.goals*10),
    glove: best(rated.filter(x=>x.pos==='POR'), x=>x.avgRating*1000 + x.saves),
    young: best(rated.filter(x=>x.age<=21), rk),
    figura: best(list.filter(x=>x.motm>0), x=>x.motm*1000 + x.avgRating)
  };
}
/* El mejor once: prueba todas las formaciones y se queda con la que suma más puntuación media */
function bestXI(stats){
  const {list, minN} = awardCandidates(stats);
  const rated = list.filter(x=>x.ratingN>=minN).sort((a,b)=>(b.avgRating-a.avgRating)||(b.contrib-a.contrib));
  if(rated.length<11) return null;
  let bestPick = null;
  Object.keys(FORMATIONS).forEach(f=>{
    const need = FORMATIONS[f]; const chosen = []; let sum = 0, ok = true;
    Object.keys(need).forEach(pos=>{
      const cand = rated.filter(x=>x.pos===pos).slice(0, need[pos]);
      if(cand.length<need[pos]) ok = false;
      cand.forEach(x=>{ chosen.push(x); sum += x.avgRating; });
    });
    if(ok && (!bestPick || sum > bestPick.sum + 1e-9)) bestPick = {formation:f, players:chosen, sum};
  });
  return bestPick;
}

/* ---------- Camisetas, cancha y alineaciones ---------- */
function kitColors(team, opp){
  let shirt = (team.crest && team.crest.bg) || '#1B7A4A';
  if(opp && opp.crest && colorDist(shirt, opp.crest.bg)<90){
    const alt = team.crest.bg2 || shade(shirt,-35);
    shirt = colorDist(alt, opp.crest.bg)>=90 ? alt : '#F4F1EA';
  }
  return {shirt, gk: luminance(shirt)>0.5 ? '#1F2937' : '#F2C94C'};
}
function evBadgesHTML(ps){
  if(!ps) return '';
  let tl='', bl='', br='';
  if(ps.goals) tl += `<span class="pl-b">⚽${ps.goals>1?`<i>${ps.goals}</i>`:''}</span>`;
  if(ps.assists) tl += `<span class="pl-b">👟${ps.assists>1?`<i>${ps.assists}</i>`:''}</span>`;
  if(ps.red) bl += `<span class="pl-b">🟥</span>`; else if(ps.yellow) bl += `<span class="pl-b">🟨</span>`;
  if(ps.injured) bl += `<span class="pl-b">🩹</span>`;
  if(ps.penMissed) bl += `<span class="pl-b">❌</span>`;
  if(ps.subOut!=null) br += `<span class="pl-b sub">↓${ps.subOut}'</span>`;
  return `${tl?`<div class="pl-tl">${tl}</div>`:''}${bl?`<div class="pl-bl">${bl}</div>`:''}${br?`<div class="pl-br">${br}</div>`:''}`;
}
function markerHTML(p, x, y, kit, ps){

  const chip = ps
    ? (ps.rating!=null ? `<span class="pl-rate ${ratingClass(ps.rating)}">${ps.rating.toFixed(1)}</span>` : '')

  return `<div class="pl" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" onclick="App.showPlayer('${p.id}')">
    <div class="pl-shirt" style="background:${shirt};color:${txt};border-color:${txt==='#FFFFFF'?'rgba(255,255,255,.75)':'rgba(0,0,0,.35)'}">${p.number!=null?p.number:''}${chip}${evBadgesHTML(ps)}</div>
    <div class="pl-name">${esc(shortName(p))}</div>
  </div>`;
}
function renderPitch(sides, stadium, pid, pstats, extraHtml){
  const markers = sides.map(s=>{
    const rows = layoutLineup(s.lineup); const n = rows.length; let html='';

      const k = n>1 ? r/(n-1) : 0;

      row.forEach((p,i)=>{ html += markerHTML(p, (i+0.5)*100/row.length, y, s.kit, pstats ? pstats[p.id] : null); });
    });
    return html;
  }).join('');
  return `<div class="pitch">${pitchSVG(stadium,pid)}${markers}${extraHtml||''}</div>`;
}

function ballMarkerHTML(x, y){

const ATTACK_EVENT_TYPES = new Set(['gol','gol_penal','gol_anulado','autogol','var_penal','penal_concedido','penal_fallado','salvada_linea','desviado','ocasion_fallada','corner','regate','fuera_de_juego','hat_trick']);
const MIDFIELD_EVENT_TYPES = new Set(['amarilla','roja','tangana','discusion_arbitro','golpe','lesion','expulsion_dt']);
function ballPositionFor(L){
  const ctx = L.ctx, mom = clamp(ctx.mom||0, -1, 1);
  const t = L.moments[Math.max(0, L.idx-1)] || 0;
  const events = ctx.events;
  const lastEv = events.length ? events[events.length-1] : null;
  const fresh = lastEv && Math.abs(lastEv.minute - t) < 0.05;
  const seed = Math.abs(Math.round((t||0)*137)) % 61;
  let x = 20 + (seed/61)*60;
  let y = clamp(50 - mom*34, 8, 92);
  if(fresh){
    if(ATTACK_EVENT_TYPES.has(lastEv.type) || lastEv.type==='gol'){
      y = lastEv.side==='home' ? 10 : 90;
      x = 30 + (seed/61)*40;
    } else if(MIDFIELD_EVENT_TYPES.has(lastEv.type)){
      y = clamp(y, 32, 68);
    }
  }
  return {x: clamp(x,5,95), y: clamp(y,5,95)};
}
function zoneLabelHTML(L){
  const {A,B} = L, pos = ballPositionFor(L);
  let txt;
  if(pos.y<=22) txt = `⚔️ Ataca ${esc(A.name)}`;
  else if(pos.y>=78) txt = `⚔️ Ataca ${esc(B.name)}`;
  else txt = '🔄 Se disputa en el mediocampo';
  return `<div class="ball-zone-row">${txt}</div>`;
}

  if(ps.yellow && ps.red && ps.redType==='segunda') s += '🟨🟥 ';
  else if(ps.red) s += '🟥 ';
  else if(ps.yellow) s += '🟨 ';

  if(ps.saves) s += `🧤${ps.saves} `;

/* ---------- Crónica generada a partir de lo que pasó ---------- */
function matchReportHTML(m, A, B){
  const P = id=>{ const f=id?findPlayerGlobal(id):null; return f?esc(f.player.name):'un jugador'; };
  const ev = m.events||[];
  const wx = m.weather ? weatherOf(m.weather) : null;
  const att = m.venue && m.venue.attendance ? m.venue.attendance : null;
  const H = m.homeGoals, Aw = m.awayGoals;
  const goals = ev.filter(e=>e.type==='gol'||e.type==='gol_penal'||e.type==='autogol');
  const scorerOf = e=> e.type==='autogol' ? `${P(e.playerId)} (en contra)` : P(e.playerId);
  const paras = [];

  const venueName = (m.venue&&m.venue.name)||getStadium(A).name;
  const venueNick = m.venue&&m.venue.nickname;
  let p1 = `${esc(A.name)} y ${esc(B.name)} se vieron las caras en ${esc(venueName)}${venueNick?` ("${esc(venueNick)}")`:''}`;
  if(att) p1 += `, con ${fmtNum(att)} personas en las tribunas`;
  if(wx && wx.v!=='nublado' && wx.v!=='sol'){
    p1 += m.venue && m.venue.sheltered ? `. ${esc(wx.note)} Por suerte, las tribunas techadas resguardaron buena parte del juego.` : `. ${esc(wx.note)}`;
  } else p1 += '.';
  paras.push(p1);

  const first = goals.filter(e=>e.minute<46), second = goals.filter(e=>e.minute>=46 && e.minute<91);
  const extraGoals = m.extraTime ? goals.filter(e=>e.minute>=91) : [];
  const describe = (list, when)=>{
    if(!list.length) return `${when} terminó sin goles.`;
    return `${when}: ` + list.map(e=>{
      const side = (e.creditTeamId||e.teamId)===A.id ? A : B;
      return `${scorerOf(e)} para ${esc(side.name)} (${esc(e.display)})`;
    }).join(', ') + '.';
  };
  paras.push(describe(first, 'En el primer tiempo'));
  paras.push(describe(second, 'En el complemento'));
  if(m.extraTime) paras.push(describe(extraGoals, 'Como siguieron igualados, en la prórroga'));

  const reds = ev.filter(e=>e.type==='roja');
  const extras = [];
  if(reds.length) extras.push(reds.map(e=>`${P(e.playerId)} se fue expulsado a los ${esc(e.display)}`).join(' y ')+'.');
  const missed = ev.filter(e=>e.type==='penal_fallado');
  if(missed.length) extras.push(`Quedó pendiente el penal que erró ${P(missed[0].playerId)}.`);
  const varOut = ev.filter(e=>e.type==='gol_anulado');
  if(varOut.length) extras.push(`El VAR anuló ${varOut.length===1?'un gol':varOut.length+' goles'}.`);
  const ht = ev.find(e=>e.type==='hat_trick');
  if(ht) extras.push(`Noche redonda para ${P(ht.playerId)}, que se llevó la pelota con tres goles.`);
  if(extras.length) paras.push(extras.join(' '));

  let close;
  if(m.penA!=null) close = `Ni en los 120 minutos se sacaron ventaja (${H}-${Aw}) y todo se definió desde los doce pasos: ${m.penA}-${m.penB}.`;
  else if(H>Aw) close = `Ganó ${esc(A.name)} por ${H}-${Aw}${m.extraTime?' tras la prórroga':''}.`;
  else if(Aw>H) close = `Se lo llevó ${esc(B.name)} por ${Aw}-${H} de visitante${m.extraTime?' tras la prórroga':''}.`;
  else close = `Repartieron puntos: ${H}-${Aw}.`;
  if(m.motmPlayerId) close += ` La figura fue ${P(m.motmPlayerId)}.`;
  if(m.box && m.box.home) close += ` La pelota la tuvo más ${m.box.home.possession>=m.box.away.possession?esc(A.name):esc(B.name)} (${Math.max(m.box.home.possession,m.box.away.possession)}%).`;
  paras.push(close);

  return paras.map(t=>`<p>${t}</p>`).join('');
}
/* ---------- Historial entre los dos equipos ---------- */
function h2hStats(idA, idB){
  const r = {p:0, wa:0, d:0, wb:0, gfa:0, gfb:0, last:[]};
  data.competitions.forEach(c=>{
    allMatchesOf(c).forEach(m=>{
      if(!m.played || m.isBye) return;
      const direct = (m.teamAId===idA && m.teamBId===idB) || (m.teamAId===idB && m.teamBId===idA);
      if(!direct) return;
      const aHome = m.teamAId===idA;
      const ga = aHome ? m.homeGoals : m.awayGoals, gb = aHome ? m.awayGoals : m.homeGoals;
      r.p++; r.gfa+=ga; r.gfb+=gb;
      if(ga>gb) r.wa++; else if(gb>ga) r.wb++; else if(m.winnerId) (m.winnerId===idA ? r.wa++ : r.wb++); else r.d++;
      r.last.push({m, c});
    });
  });
  r.last.sort((x,y)=>(y.m.playedAt||0)-(x.m.playedAt||0));
  return r;
}
function h2hHTML(A, B){
  const h = h2hStats(A.id, B.id);
  if(!h.p) return '';
  return `<h2 class="section-title" style="font-size:19px;">Historial entre ambos</h2>
    <div class="card" style="padding:12px;">
      <div class="h2h">
        <div><b>${h.wa}</b><span>Gana ${esc(A.name)}</span></div>
        <div><b>${h.d}</b><span>Empates</span></div>
        <div><b>${h.wb}</b><span>Gana ${esc(B.name)}</span></div>
      </div>
      <div class="mc-venue" style="margin-top:10px;">${h.p} ${h.p===1?'partido jugado':'partidos jugados'} · goles ${h.gfa}-${h.gfb}</div>
    </div>`;
}
/* ---------- Pronóstico: el motor de partido corrido cientos de veces ---------- */
const PRED_RUNS = 240;
const predCache = {};
let predToken = 0;
function predSignature(c, m, A, B){
  const sq = t=>t.players.map(p=>p.id+':'+(p.fit??100)+':'+(p.form??65)+':'+playerOverall(p)).join(',');
  const un = [...unavailSet(c,A), ...unavailSet(c,B)].sort().join(',');
  return [m.id, A.tactic, A.mentality, B.tactic, B.mentality, sq(A), sq(B), un].join('|');
}
function predVerdict(pa, pb, A, B){
  const d = Math.abs(pa-pb), fav = pa>=pb ? A : B;
  if(d<0.07) return 'Partido parejo: cualquiera se lo puede llevar.';
  if(d<0.2) return `Ligero favorito: ${esc(fav.name)}.`;
  if(d<0.38) return `Favorito claro: ${esc(fav.name)}.`;
  return `Gran favorito: ${esc(fav.name)}. Si tropieza, será un batacazo.`;
}
function predictionHTML(P, A, B, decisive, running){
  const n = Math.max(1, P.n);
  const cH = kitColors(A,null).shirt, cA = kitColors(B,A).shirt;
  const pa = P.a/n, pd = P.d/n, pb = P.b/n;
  const a = Math.round(pa*100);
  const d = decisive ? 0 : Math.round(pd*100);
  const b = 100 - a - d;
  const sub = running ? `Simulando… ${P.n} de ${PRED_RUNS}` : `${P.n} simulaciones`;
  let out = `<div class="sec-head"><b>🔮 Pronóstico</b><span>${sub}</span></div>
    <div class="pred-bar"><i style="width:${(pa*100).toFixed(1)}%;background:${cH}"></i>${decisive?'':`<i class="pd" style="width:${(pd*100).toFixed(1)}%"></i>`}<i style="width:${(pb*100).toFixed(1)}%;background:${cA}"></i></div>
    <div class="pred-nums">
      <div><b>${a}%</b><span>${decisive?'Avanza ':'Gana '}${esc(A.name)}</span></div>
      ${decisive?'':`<div><b>${d}%</b><span>Empate</span></div>`}
      <div><b>${b}%</b><span>${decisive?'Avanza ':'Gana '}${esc(B.name)}</span></div>
    </div>`;
  if(P.n>=40){
    const top = Object.entries(P.scores).sort((x,y)=>y[1]-x[1]).slice(0,3);
    const extra = decisive ? `<div style="margin-top:6px;">${Math.round(P.et/n*100)}% necesita prórroga y ${Math.round(P.pens/n*100)}% se define en penales.</div>` : '';
    out += `<div class="pred-foot">
      <div class="verdict">${predVerdict(pa, pb, A, B)}</div>
      <div class="pred-scores">${top.map(([k,v])=>`<span class="pred-score"><b>${k}</b>${Math.round(v/n*100)}%</span>`).join('')}</div>
      <div style="margin-top:8px;color:var(--text-dim);">Goles esperados: <b style="color:var(--text);">${(P.gA/n).toFixed(1)} - ${(P.gB/n).toFixed(1)}</b></div>
      ${extra}
      <div class="mc-venue" style="text-align:left;margin-top:8px;">Sale de correr el motor de partido ${P.n} veces con las alineaciones de hoy.</div>
    </div>`;
  }
  return out;
}
function startPrediction(){
  const info = ui.matchInfo || {};
  const found = findMatchById(ui.selectedCompId, info.matchId, info.isBracket);
  const c = found.c, m = found.m, loc = found.loc;
  if(!el('predCard') || !c || !m || m.played) return;
  const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
  if(!A || !B || !A.players.length || !B.players.length) return;
  const decisive = !!(loc ? loc.isBracket : info.isBracket);
  const sig = predSignature(c, m, A, B);
  const cached = predCache[m.id];
  if(cached && cached.sig===sig){ el('predCard').innerHTML = predictionHTML(cached.P, A, B, decisive, false); return; }
  const token = ++predToken;
  const opts = {
    rules: compRules(c), unavailA: unavailSet(c,A), unavailB: unavailSet(c,B),
    stakes: matchStakes(c, m, loc || {idx:0, isBracket:decisive}), decisive
  };
  const P = {n:0, a:0, d:0, b:0, gA:0, gB:0, et:0, pens:0, scores:{}};
  function one(){
    const res = simulateMatchEngine(A, B, opts);
    const hg = res.homeGoals, ag = res.awayGoals;
    P.n++; P.gA += hg; P.gB += ag;
    const key = hg+'-'+ag; P.scores[key] = (P.scores[key]||0)+1;
    if(res.extraTime) P.et++;
    if(hg>ag) P.a++; else if(ag>hg) P.b++;
    else if(decisive){ const pn = simulatePenalties(A, B, res); P.pens++; if(pn.a>pn.b) P.a++; else P.b++; }
    else P.d++;
  }
  function step(){
    const box = el('predCard');
    if(token!==predToken || !box) return;                 // ya se cambió de pantalla
    try{
      const t0 = performance.now();
      while(P.n<PRED_RUNS && performance.now()-t0<12) one();
    }catch(e){ box.innerHTML = `<div class="sec-head"><b>🔮 Pronóstico</b></div><p class="hint" style="margin:0;">No se pudo calcular para este partido.</p>`; return; }
    if(P.n<PRED_RUNS){ box.innerHTML = predictionHTML(P, A, B, decisive, true); setTimeout(step, 0); return; }
    predCache[m.id] = {sig, P};
    box.innerHTML = predictionHTML(P, A, B, decisive, false);
    // Se guarda para poder decir después si fue un batacazo
    const a = Math.round(P.a/P.n*100), d = decisive ? 0 : Math.round(P.d/P.n*100);
    m.pred = {a, d, b:100-a-d, dec:decisive?1:0, n:P.n};
    persist();
  }
  step();
}
function predResultHTML(m, A, B){
  const p = m.pred; if(!p || !m.played) return '';
  const w = m.penA!=null ? (m.penA>m.penB?'a':'b') : m.homeGoals>m.awayGoals ? 'a' : m.awayGoals>m.homeGoals ? 'b' : 'd';
  const pw = w==='a' ? p.a : w==='b' ? p.b : p.d;
  let tag = '';
  if(w!=='d' && pw<=18) tag = `<span class="pred-tag up">😱 Batacazo</span>`;
  else if(w!=='d' && pw>=55) tag = `<span class="pred-tag">Lo esperado</span>`;
  const side = (t, v, k)=>`<span style="display:inline-flex;align-items:center;gap:5px;">${k==='l'?teamCrestMini(t.id,'pr'+m.id+k,18):''}<b>${v}%</b>${k==='r'?teamCrestMini(t.id,'pr'+m.id+k,18):''}</span>`;
  return `<div class="pred-line"><span>🔮 Pronóstico previo</span>${side(A,p.a,'l')}${p.dec?'':`<span class="dim">· ${p.d}% empate ·</span>`}${side(B,p.b,'r')}${tag}</div>`;
}

/* Corre una tanda de partidos mostrando progreso real; doOne procesa un item y decide si contó como jugado */
async function simulateWithLoader(title, items, doOne){
  if(!items.length) return 0;
  const reduced = prefersReduced();
  showSimLoader(title, `0 de ${items.length} partidos`);
  await simDelay(reduced?0:120);
  const total = items.length;
  const chunk = Math.max(1, Math.ceil(total/24));
  let processed = 0, done = 0;
  for(let i=0;i<total;i++){
    if(doOne(items[i])) processed++;
    done++;
    if(done%chunk===0 || done===total){
      updateSimLoader(`${done} de ${total} partidos`, done/total*100);
      await simDelay(reduced?0:55);
    }
  }
  await simDelay(reduced?0:260);
  await hideSimLoader();
  return processed;
}

/* ---------- Sonido de estadio: todo sintetizado con Web Audio, sin archivos ---------- */
const SFX = (function(){
  let ctx = null, master = null, noiseBuf = null, amb = null;
  let enabled = true;
  try{ if(localStorage.getItem('lmSound')==='0') enabled = false; }catch(e){}

  function ensure(){
    if(ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.6;
      const comp = ctx.createDynamicsCompressor();      // evita saturar cuando se pisan varios sonidos
      master.connect(comp); comp.connect(ctx.destination);
      const len = ctx.sampleRate*2;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ctx = null; }
    return ctx;
  }
  function unlock(){
    if(!enabled) return;
    const c = ensure();
    if(c && c.state==='suspended'){ try{ c.resume(); }catch(e){} }
  }
  /* Un tono con envolvente; `to` desliza la frecuencia, `lp` lo suaviza */
  function tone(freq, t0, dur, o){
    o = o||{};
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0+dur);
    const vol = o.gain==null ? 0.2 : o.gain, a = o.attack==null ? 0.01 : o.attack;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g);
    let out = g;
    if(o.lp){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); out = f; }
    out.connect(master);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }
  /* Ruido filtrado con envolvente: es la base del público, los golpes y los suspiros */
  function noise(t0, dur, o){
    o = o||{};
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.freq||800, t0); f.Q.value = o.q==null ? 0.7 : o.q;
    if(o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t0+dur*(o.sweepAt||0.6));
    const g = ctx.createGain();
    const vol = o.gain==null ? 0.3 : o.gain, a = o.attack==null ? 0.05 : o.attack, r = o.release==null ? dur*0.5 : o.release;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+a);
    g.gain.setValueAtTime(vol, Math.max(t0+a, t0+dur-r));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0, Math.random()); src.stop(t0+dur+0.05);
  }
  /* Silbato de bolita: dos tonos casi iguales con trino rápido y un poco de aire */
  function whistle(t0, dur, pitch){
    pitch = pitch || 2850;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 32;
    const am = ctx.createGain(); am.gain.value = 0.06;
    const fm = ctx.createGain(); fm.gain.value = 55;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.15, t0+0.03);
    g.gain.setValueAtTime(0.15, Math.max(t0+0.03, t0+dur-0.06));
    g.gain.linearRampToValueAtTime(0.0001, t0+dur);
    lfo.connect(am); am.connect(g.gain); lfo.connect(fm);

      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(fr*0.985, t0); o.frequency.linearRampToValueAtTime(fr, t0+0.05);
      fm.connect(o.frequency); o.connect(g); o.start(t0); o.stop(t0+dur+0.05);
    });

      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 0.45;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(level, now+1.6);

    } else if(amb){
      const a = amb; amb = null;
      a.g.gain.cancelScheduledValues(now);
      a.g.gain.setTargetAtTime(0.0001, now, 0.35);

    half(t){ whistle(t, 0.95); },
    final(t){ whistle(t, 0.34); whistle(t+0.5, 0.34); whistle(t+1.0, 1.0); },

    own(t){

    },
    penalty(t){ whistle(t, 0.4); tone(58, t+0.55, 0.22, {to:44, gain:0.5}); tone(58, t+0.85, 0.22, {to:44, gain:0.5}); },

    pen_miss(t){ noise(t, 1.0, {freq:470, sweep:300, gain:0.26, attack:0.1, release:0.6}); tone(90, t, 0.2, {to:50, gain:0.28}); },

  };

    const c = ensure(); if(!c) return;
    if(c.state==='suspended'){ try{ c.resume(); }catch(e){} }

    try{ fn(c.currentTime+0.02, arg); }catch(e){}

    get enabled(){ return enabled; },
    unlock, play, ambience,
    set(v){ enabled = !!v; try{ localStorage.setItem('lmSound', enabled?'1':'0'); }catch(e){} if(!enabled) ambience(false); },

    ev(name, arg){ if(live()) play(name, arg); },
    amb(on, level){ if(!on) ambience(false); else if(live()) ambience(true, level); }
  };
})();

function realWait(fx, ms){

  });

/* Devuelve los puntos clave (en % de pantalla) del vuelo de la pelota según ángulo + resultado */
function scShotPlan(angle, kind, side){
  const R = side==='left';
  const P = {}; // {start, mid, end, endScale, corner}
  if(angle==='broadcast'){
    P.start = {x:50,y:79,s:1.35};
    if(kind==='poste'){ P.mid={x:R?38:62,y:35,s:.75}; P.end={x:R?32:68,y:15,s:.55}; P.deflect={x:R?18:82,y:11,s:.4}; }
    else if(kind==='afuera'){ P.mid={x:R?40:60,y:34,s:.7}; P.end={x:R?14:86,y:3,s:.32}; }
    else if(kind==='atajada'||kind==='atajadon'){ P.mid={x:52,y:33,s:.72}; P.end={x:R?40:60,y:16,s:.5}; P.keeperDive=R?'dive-l':'dive-r'; }
    else { P.mid={x:R?44:56,y:32,s:.72}; P.end={x:R?34:66,y:13,s:.5}; P.keeperDive=R?'dive-r':'dive-l'; }
  } else if(angle==='goalcam'){
    P.start = {x:50,y:24,s:.32};
    if(kind==='poste'){ P.mid={x:R?38:62,y:52,s:.85}; P.end={x:R?24:76,y:80,s:1.5}; P.deflect={x:R?8:92,y:70,s:1.1}; }
    else if(kind==='afuera'){ P.mid={x:R?36:64,y:48,s:.8}; P.end={x:R?4:96,y:96,s:1.6}; }
    else if(kind==='atajada'||kind==='atajadon'){ P.mid={x:50,y:50,s:.9}; P.end={x:R?38:62,y:74,s:1.3}; P.keeperDive='dive-c'; }
    else { P.mid={x:R?46:54,y:50,s:.9}; P.end={x:R?42:58,y:82,s:1.45}; P.keeperDive='dive-c'; }
  } else { // side
    const gx = R ? 15 : 85, dir = R ? -1 : 1;
    P.start = {x:R?32:68,y:57,s:1};
    if(kind==='poste'){ P.mid={x:gx-dir*20,y:44,s:.9}; P.end={x:gx-dir*3,y:36,s:.82}; P.deflect={x:gx-dir*10,y:20,s:.7}; }
    else if(kind==='afuera'){ P.mid={x:gx-dir*22,y:40,s:.88}; P.end={x:gx+dir*8,y:10,s:.65}; }
    else if(kind==='atajada'||kind==='atajadon'){ P.mid={x:gx-dir*16,y:40,s:.85}; P.end={x:gx-dir*6,y:34,s:.78}; P.keeperDive='dive-c'; }
    else { P.mid={x:gx-dir*18,y:42,s:.86}; P.end={x:gx-dir*4,y:32,s:.8}; P.keeperDive='dive-c'; }
  }
  return P;
}

    trail.animate([
      {left:plan.start.x+'%',top:plan.start.y+'%',opacity:.5,transform:'scale(.65)'},
      {left:plan.mid.x+'%',top:plan.mid.y+'%',opacity:.2,transform:'scale(.9)'},
      {left:plan.end.x+'%',top:plan.end.y+'%',opacity:0,transform:'scale(1.5)'}
    ], {duration:900,easing:'ease-out',fill:'forwards'});
  }catch(err){ setBall(plan.end); }
  if(plan.keeperDive) setTimeout(()=>{ keeper.classList.add(plan.keeperDive); keeper.classList.add('sc-saved'); }, kind==='gol'?470:430);
  if(kind==='gol') ball.classList.add('sc-goal'); else if(kind==='atajada'||kind==='atajadon') ball.classList.add('sc-save');
  await realWait(fx, 940);
  // Resolución del impacto
  if(kind==='gol'){ SFX.ev('goal'); impact.classList.add('go'); net.classList.add('go'); ball.classList.add('sc-hit'); buzz([30,40,90]); }
  else if(kind==='poste'){ SFX.ev('post'); clank.classList.add('go'); buzz([50]);
    if(plan.deflect){ try{ ball.animate([{left:plan.end.x+'%',top:plan.end.y+'%'},{left:plan.deflect.x+'%',top:plan.deflect.y+'%',transform:'scale('+plan.deflect.s+') rotate(940deg)'}], {duration:420, easing:'ease-out', fill:'forwards'}); }catch(err){} } }
  else if(kind==='afuera'){ SFX.ev('ooh'); buzz([70]); }
  else { SFX.ev('save'); impact.classList.add('go'); buzz([60]); if(kind==='atajadon'){ keeper.classList.add('sc-savehero'); } }
  const [t1,t2] = SC_CAPTION[isPenalty && kind!=='gol' ? 'penal' : kind] || SC_CAPTION.gol;
  const cap = scEl('div','sc-cap'); cap.innerHTML = '<b>'+esc(t1)+'</b><span>'+esc(t2)+'</span>'; fx.appendChild(cap);
  await realWait(fx, 950);
  fx.classList.add('out');
  await realWait(null, 220);
  fx.remove();
}

async function animateMatchReveal(){
  const info = ui.matchInfo || {};
  const {m} = findMatchById(ui.selectedCompId, info.matchId, info.isBracket);
  if(!m){ ui.justSimulated=null; return; }
  const A = findTeam(m.teamAId), B = findTeam(m.teamBId);
  const evList = el('eventsList'), scoreHome = el('scoreHome'), scoreAway = el('scoreAway');
  const motmSlot = el('motmSlot'), clockEl = el('matchClock'), phaseEl = el('matchPhase');
  if(!evList || !clockEl || !A || !B){ ui.justSimulated=null; return; }
  animSkip = false;
  let h=0, a=0;
  const half1Events = (m.events||[]).filter(e=>e.minute<46);
  const half2Events = (m.events||[]).filter(e=>e.minute>=46 && e.minute<91);
  const et1Events = (m.events||[]).filter(e=>e.minute>=91 && e.minute<106);
  const et2Events = (m.events||[]).filter(e=>e.minute>=106);
  const pop = node=>{ if(!node) return; node.classList.remove('pop'); void node.offsetWidth; node.classList.add('pop'); };
  const box = m.box && m.box.home ? m.box : null;

  const clockFill = el('clockFill'), momPin = el('momPin'), commentary = el('commentary');
  const possH = el('possH'), possA = el('possA'), possHL = el('possHL'), possAL = el('possAL');
  const lsShots = el('lsShots'), lsOn = el('lsOn'), lsCor = el('lsCor'), lsFouls = el('lsFouls');

  function say(min, text){
    if(!commentary || !text) return;
    commentary.innerHTML = `<span class="cm-min">${esc(min)}</span><span class="cm-tx">${esc(text)}</span>`;
    commentary.classList.remove('flash'); void commentary.offsetWidth; commentary.classList.add('flash');
  }
  function setLv(node, v){
    if(!node || node.textContent===v) return;
    node.textContent = v;
    const b = node.parentElement;
    if(b && !animSkip){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  }
  /* Los contadores crecen de forma proporcional al minuto jugado */
  function updateLive(minute, mom){
    const f = clamp(minute/(m.extraTime?120:90), 0, 1);
    if(clockFill) clockFill.style.width = (f*100).toFixed(1)+'%';
    if(momPin) momPin.style.left = (50 + clamp(mom||0,-1,1)*46).toFixed(1)+'%';
    if(!box) return;
    const ease = Math.pow(f, 0.92);
    const g = (k)=>[Math.round((box.home[k]||0)*ease), Math.round((box.away[k]||0)*ease)];
    const [sh,sa] = g('shots'), [oh,oa] = g('on'), [ch,ca] = g('corners'), [fh,fa] = g('fouls');
    setLv(lsShots, sh+' - '+sa);
    setLv(lsOn, oh+' - '+oa);
    setLv(lsCor, ch+' - '+ca);
    setLv(lsFouls, fh+' - '+fa);
    const ph = Math.round(50 + (box.home.possession-50)*Math.min(1, f*1.5));
    if(possH) possH.style.width = ph+'%';
    if(possA) possA.style.width = (100-ph)+'%';
    if(possHL) possHL.textContent = ph+'%';
    if(possAL) possAL.textContent = (100-ph)+'%';
  }

  async function revealEvent(e){
    const credit = e.creditTeamId || e.teamId;
    const isGoal = e.type==='gol' || e.type==='gol_penal' || e.type==='autogol';
    if(isGoal){
      const team = credit===A.id ? A : B;
      const prevH = h, prevA = a;
      if(credit===A.id){ h++; if(scoreHome){ scoreHome.textContent=h; pop(scoreHome); } }
      else { a++; if(scoreAway){ scoreAway.textContent=a; pop(scoreAway); } }
      sbFlash(credit===A.id ? 'a' : 'b', credit===A.id ? kitColors(A,null).shirt : kitColors(B,A).shirt);
      say(e.display, commentaryFor(e,A,B));
      await playShotCinema('gol', team, e, {isPenalty: e.type==='gol_penal'});
      await playGoalFx(e.type==='autogol' ? (credit===A.id?A:B) : team, e);
      // Dio vuelta el partido
      if((prevH<prevA && h>a) || (prevA<prevH && a>h)){
        await playComebackFx(credit===A.id ? A : B);
      }
    } else if(e.type==='gol_anulado' || e.type==='var_penal'){
      say(e.display, commentaryFor(e,A,B));
      await playVarFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='roja'){
      say(e.display, commentaryFor(e,A,B));
      await playCardFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='penal_concedido'){
      say(e.display, commentaryFor(e,A,B));
      await playPenAwardFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='penal_fallado'){
      say(e.display, commentaryFor(e,A,B));
      await playShotCinema(e.reason==='atajado' ? 'atajada' : 'afuera', e.teamId===A.id?A:B, e, {isPenalty:true});
      await playPenMissFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='hat_trick'){
      say(e.display, commentaryFor(e,A,B));
      await playHatTrickFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='tangana'){
      say(e.display, commentaryFor(e,A,B));
      await playScuffleFx(A, B, e);
    } else if(e.type==='invasion_cancha'){
      say(e.display, commentaryFor(e,A,B));
      await playInvasionFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='objeto_cancha'){
      say(e.display, commentaryFor(e,A,B));
      await playObjectFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='bengalazo'){
      say(e.display, commentaryFor(e,A,B));
      await playFlareFx(e.teamId===A.id?A:B, e);
    } else if(e.type==='tension_final'){
      say(e.display, commentaryFor(e,A,B));
      await playBrawlFx(A, B, e);
    } else {
      say(e.display, commentaryFor(e,A,B));
      const SHOT_KIND = {poste:'poste', travesano:'poste', atajada:'atajada', atajadon:'atajadon', desviado:'afuera', nervios:'afuera', ocasion_fallada:'afuera'};
      if(SHOT_KIND[e.type]){
        const owner = (e.creditTeamId || e.teamId) === A.id ? A : B;
        await playShotCinema(SHOT_KIND[e.type], owner, e);
      } else {
        const snd = {salvada_linea:'save', amarilla:'yellow'}[e.type];
        if(snd) SFX.ev(snd);
      }
    }
    if(e.mom!=null) updateLive(e.minute, e.mom);
    const row = document.createElement('div');
    const sa = evSideAttrs(e, A, B);
    row.className = 'event-row ev-in'+(e.type==='cambio'?' ev-sub':'')+(BIG_EVENTS.has(e.type)?' big':'')+sa.cls;
    if(sa.color) row.style.setProperty('--tc', sa.color);
    row.innerHTML = `<div class="event-min">${e.display}</div><div class="event-ic">${iconForEvent(e)}</div>${eventTextHtml(e,A,B)}`;
    evList.appendChild(row);
    await sleep(380);
  }

  async function runHalf(halfNum, baseMinute, stoppage, halfEvents, startMinute, labels){
    labels = labels || {play:halfNum===1?'PRIMER TIEMPO':'SEGUNDO TIEMPO', stoppage:halfNum===1?'Primer':'Segundo'};
    if(phaseEl) phaseEl.textContent = labels.play;
    let idx=0;
    // A velocidad x1: 1 segundo real ≈ 1 minuto de partido (60 "segundos" simulados por segundo real)
    const SEC_PER_TICK=4, TICK_MS=1000*SEC_PER_TICK/60;
    let simSeconds = startMinute*60;
    const endSeconds = baseMinute*60;
    let lastFiller = startMinute;
    let mom = 0;
    while(simSeconds<=endSeconds){
      const mm=Math.floor(simSeconds/60), ss=simSeconds%60;
      clockEl.textContent = pad2(mm)+':'+pad2(ss);
      if(ss===0){
        mom *= 0.9; updateLive(mm, mom);
        // El marcador late cuando el partido está caliente sobre el final
        const sb = el('scoreboardBox');
        if(sb) sb.classList.toggle('tense', (m.stakes||0)>=0.65 && mm>=78 && Math.abs(h-a)<=1);
      }
      while(idx<halfEvents.length && Math.floor(halfEvents[idx].minute)===mm){
        mom = halfEvents[idx].mom||0;
        await revealEvent(halfEvents[idx]); idx++;
      }
      // Relleno narrativo en los tramos sin incidencias
      if(mm-lastFiller>=9 && ss===0 && !animSkip){ say(mm+"'", pick(FILLER_LINES)); lastFiller = mm; }
      simSeconds+=SEC_PER_TICK;
      await sleep(TICK_MS);
    }
    clockEl.textContent = baseMinute+":00";
    if(stoppage>0){
      for(let k=1;k<=stoppage;k++){
        if(phaseEl) phaseEl.textContent = labels.stoppage+' tiempo · +'+stoppage+"'";
        clockEl.textContent = baseMinute+"+"+k+"'";
        await sleep(320);
        while(idx<halfEvents.length && Math.round((halfEvents[idx].minute-baseMinute)*10)===k){ await revealEvent(halfEvents[idx]); idx++; }
      }
    }
    // Lo que queda son eventos post-partido (ej. gresca tras el pitazo): no son parte del descuento real,
    // así que se marcan aparte en vez de sumarse a la cuenta de "+X'" que ya terminó.
    let postShown = false;
    while(idx<halfEvents.length){
      if(halfEvents[idx].post && !postShown){ postShown = true; if(phaseEl) phaseEl.textContent = 'TRAS EL PITAZO FINAL'; clockEl.textContent = 'FINAL'; }
      await revealEvent(halfEvents[idx]); idx++;
    }
  }

  /* Tanda de penales, uno por uno */
  async function runShootout(){
    if(!m.penSeq || !m.penSeq.length) return;
    if(phaseEl) phaseEl.textContent = 'DEFINICIÓN POR PENALES';
    const div = document.createElement('div');
    div.className='half-divider'; div.textContent='🥅 Tanda de penales';
    evList.appendChild(div);
    let pa=0, pb=0;
    for(const k of m.penSeq){
      const t = k.side==='home' ? A : B;
      const f = k.playerId ? findPlayerGlobal(k.playerId) : null;
      if(k.scored){ if(k.side==='home') pa++; else pb++; }
      clockEl.textContent = pa+' - '+pb;
      say('PEN', `${f?shortName(f.player):'El ejecutor'} (${t.name}): ${k.scored?'¡gol!':(k.reason==='atajado'?'se lo atajan':'la tira afuera')}`);
      const row = document.createElement('div');
      row.className='event-row ev-in'+(k.scored?' big':'');
      row.innerHTML = `<div class="event-min">${k.num}</div><div class="event-ic">${k.scored?'⚽':(k.reason==='atajado'?'🧤':'❌')}</div>
        <div class="event-txt"><div class="who">${esc(f?f.player.name:'Jugador')} <span class="event-side-tag">(${esc(t.name)})</span></div>
        <div class="sub">${k.scored?'Convierte':(k.reason==='atajado'?'Se lo ataja el arquero':(k.reason==='al palo'?'Al palo':'Afuera'))} · ${pa}-${pb}</div></div>`;
      evList.appendChild(row);
      buzz(k.scored?[25]:[60]);
      SFX.ev(k.scored?'pen_goal':'pen_miss');
      await sleep(700);
    }
  }

  if(scoreHome) scoreHome.textContent='0';
  if(scoreAway) scoreAway.textContent='0';
  evList.innerHTML='';
  updateLive(0, 0);
  SFX.ev('kickoff'); SFX.amb(true, 0.05);
  await playKickoffFx(m, A, B);
  await runHalf(1, 45, m.stoppage1||0, half1Events, 0);
  const divider = document.createElement('div'); divider.className='half-divider'; divider.textContent='⏸ Entretiempo'; evList.appendChild(divider);
  if(phaseEl) phaseEl.textContent = 'ENTRETIEMPO';
  clockEl.textContent = '45:00';
  say("45'", `Se van al descanso con ${h}-${a} en el marcador.`);
  SFX.ev('half'); SFX.amb(true, 0.02);
  await sleep(1100);
  SFX.ev('kickoff'); SFX.amb(true, 0.05);
  await runHalf(2, 90, m.stoppage2||0, half2Events, 45);
  if(m.extraTime){
    const divET = document.createElement('div'); divET.className='half-divider'; divET.textContent='⏱️ Va a la prórroga'; evList.appendChild(divET);
    if(phaseEl) phaseEl.textContent = 'PRÓRROGA';
    clockEl.textContent = '90:00';
    say("90'", `Sigue empatado ${h}-${a}: hay que jugar 30 minutos más.`);
    SFX.ev('half');
    await sleep(1100);
    await runHalf(3, 105, m.stoppageET1||0, et1Events, 90, {play:'PRIMER TIEMPO EXTRA', stoppage:'Primer'});
    const divET2 = document.createElement('div'); divET2.className='half-divider'; divET2.textContent='⏸ Descanso en la prórroga'; evList.appendChild(divET2);
    if(phaseEl) phaseEl.textContent = 'DESCANSO DE LA PRÓRROGA';
    clockEl.textContent = '105:00';
    await sleep(1000);
    await runHalf(4, 120, m.stoppageET2||0, et2Events, 105, {play:'SEGUNDO TIEMPO EXTRA', stoppage:'Segundo'});
  }
  if(phaseEl) phaseEl.textContent = m.extraTime ? 'FIN DE LA PRÓRROGA' : 'FINAL DEL PARTIDO';
  { const sb = el('scoreboardBox'); if(sb) sb.classList.remove('tense'); }
  if(scoreHome) scoreHome.textContent = m.homeGoals;
  if(scoreAway) scoreAway.textContent = m.awayGoals;
  updateLive(m.extraTime?120:90, 0);
  await runShootout();
  say(m.extraTime?"120'":"90'", `Final: ${A.name} ${m.homeGoals} - ${m.awayGoals} ${B.name}${m.penA!=null?` (penales ${m.penA}-${m.penB})`:''}.`);
  await playFinalFx(m, A, B);
  if(motmSlot) motmSlot.innerHTML = motmCardHtml(m);
  if(m.penA!=null){
    const sc = document.querySelector('.scoreboard');
    if(sc && !sc.querySelector('.pens')){
      const d = document.createElement('div'); d.className='pens';
      d.textContent = 'Penales: '+m.penA+' - '+m.penB; sc.appendChild(d);
    }
  }
  SFX.amb(false);
  { const lb = el('liveBadge'); if(lb){ lb.classList.add('ended'); lb.innerHTML = '<i></i>FINAL'; } }
  { const wk = matchWinnerKey(m), ts = document.querySelectorAll('#scoreboardBox .tside');
    if(wk!=='d' && ts.length===2){ ts[0].classList.add(wk==='a'?'win':'lose'); ts[1].classList.add(wk==='b'?'win':'lose'); } }
  const skipBtn = el('skipBtn'); if(skipBtn) skipBtn.remove();
  const post = el('postSlot');
  if(post) post.innerHTML = `<div class="btn-row" style="margin-top:4px;">
    <button class="btn btn-primary" onclick="App.setMatchTab('stats')">📊 Estadísticas</button>
    <button class="btn btn-secondary" onclick="App.setMatchTab('alineaciones')">📋 Puntuaciones</button></div>`;
  ui.justSimulated = null;
}

/* ---------- Overlay: confirmaciones y ficha de jugador ---------- */
function overlayKey(x){
  const sh = x.querySelector('.confirm-sheet'), h = x.querySelector('h3');
  return (sh ? sh.className : x.className) + '|' + (h ? h.textContent : '');
}
function renderOverlay(){
  const root = el('overlayRoot');
  const prev = new Map();
  root.querySelectorAll('.confirm-overlay').forEach(x=>{
    if(x.classList.contains('leaving')) return;
    if(x.classList.contains('sim-loader-overlay')){ x.remove(); return; }
    prev.set(overlayKey(x), x); x.remove();
  });
  const settle = ()=>{
    const keep = new Set();
    root.querySelectorAll('.confirm-overlay:not(.leaving):not(.sim-loader-overlay)').forEach(n=>{
      const k = overlayKey(n);
      if(prev.has(k)){ n.classList.add('static'); keep.add(k); }
    });
    prev.forEach((old, k)=>{
      if(keep.has(k) || prefersReduced()) return;
      old.classList.add('leaving'); old.classList.remove('static');
      old.removeAttribute('id'); old.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
      old.removeAttribute('onclick'); old.querySelectorAll('[onclick]').forEach(n=>n.removeAttribute('onclick'));
      root.insertBefore(old, root.firstChild);
      setTimeout(()=>old.remove(), 300);
    });
  };
  let html = '';
  if(ui.champCelebration) html += champCelebrationHTML(ui.champCelebration);
  if(ui.roundSummary) html += roundSummaryHTML(ui.roundSummary);
  if(ui.promo) html += promoSheetHTML(ui.promo);
  if(ui.playerCard) html += playerCardHTML(ui.playerCard);
  if(ui.confirm){
    html += `<div class="confirm-overlay" onclick="if(event.target===this) App.closeConfirm()">
      <div class="confirm-sheet">
        <h3>${esc(ui.confirm.title)}</h3>
        <p>${esc(ui.confirm.body)}</p>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn btn-secondary" onclick="App.closeConfirm()">Cancelar</button>
          <button class="btn btn-danger" style="border-color:var(--danger);" onclick="App.confirmYes()">Confirmar</button>
        </div>
      </div>
    </div>`;
  }
  if(ui.boardNotice){
    const bn = ui.boardNotice;
    html += `<div class="confirm-overlay" onclick="if(event.target===this) ${bn.kind==='fired'?'App.acceptFired()':'App.closeBoardNotice()'}">
      <div class="confirm-sheet">
        <h3>${esc(bn.title)}</h3>
        <p>${esc(bn.body)}</p>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn ${bn.kind==='fired'?'btn-danger':'btn-primary'}" style="width:100%;" onclick="${bn.kind==='fired'?'App.acceptFired()':'App.closeBoardNotice()'}">${bn.kind==='fired'?'Buscar otro club':'Entendido'}</button>
        </div>
      </div>
    </div>`;
  }
  if(html) root.insertAdjacentHTML('beforeend', html);
  settle();
}

document.addEventListener('keydown', function(e){
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(e.key==='Escape'){
    if(ui.champCelebration){ App.closeChampCelebration(); return; }
    if(ui.roundSummary){ App.closeRoundSummary(); return; }
    if(ui.promo){ App.closePromo(); return; }
    if(ui.playerCard){ App.closePlayer(); return; }
    if(ui.confirm){ App.closeConfirm(); return; }
    if(BACK_SCREENS.indexOf(ui.screen)>=0){ App.__back(); }
    return;
  }
  if((e.key===' ' || e.key==='Enter') && ui.justSimulated){ e.preventDefault(); App.skipAnimation(); return; }
  if(e.key==='1'){ App.setTab('teams'); }
  else if(e.key==='2'){ App.setTab('leagues'); }
  else if(e.key==='3'){ App.setTab('competitions'); }
  else if(e.key==='4'){ App.setTab('stats'); }
});

(function initScrollTopBtn(){
  const btn = document.getElementById('scrollTopBtn');
  if(!btn) return;
  let ticking = false;
  function update(){
    ticking = false;
    const app = el('app');
    const y = Math.max(window.scrollY || document.documentElement.scrollTop || 0, app ? app.scrollTop : 0);
    const overlayOpen = !!document.querySelector('.confirm-overlay') || !!(el('overlayRoot') && el('overlayRoot').children.length);
    btn.classList.toggle('show', y>360 && !overlayOpen);
  }
  // La app puede scrollear la ventana o el propio <main>, según el navegador: se escuchan ambos
  document.addEventListener('scroll', function(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }, {passive:true, capture:true});

})();

  '.round-title','.cup-banner','.champion-banner','.motm-card','.pred-line','.venue-card','.venue-line','.finance-card','.live-strip','.commentary',
  '.speed-row','.poss-bar','.div-card','.divi-editor','.stadium-preview','.crest-preview-wrap','.empty-state','.btn-row','.pitch',
  '.hist-season','.h2h','.search-wrap','.sort-row','.chip-wrap','.zone-key','.team-head','.rating-badge','.lu-card','.trophy-cabinet'].join(',');
const UX_COUNT_SEL = '.stat-val, .rb-num, .aw-v, .h2h b, .ps-career b, .tm-score, .div-badge';

/* Pantalla nueva = cambia la pantalla o lo seleccionado; sub-pestaña = solo cambia una pestaña interna */
function uxAfterRender(){
  const app = el('app'); if(!app) return;
  if(UX.io) UX.io.disconnect();
  const sel = [ui.screen, ui.selectedTeamId, ui.selectedCompId, ui.selectedLeagueId].join('|');
  const sub = [ui.teamTab, ui.compTab, ui.leagueTab, ui.matchTab, ui.statsScope].join('|');
  const screenChanged = sel !== UX.lastSel;
  const subChanged = !screenChanged && sub !== UX.lastSub;
  UX.lastSel = sel; UX.lastSub = sub;
  if((!screenChanged && !subChanged) || prefersReduced()) return;
  const cls = screenChanged ? (UX.navDir==='back' ? 'scr-back' : UX.navDir==='tab' ? 'scr-tab' : 'scr-fwd') : 'scr-sub';
  const all = ['scr-fwd','scr-back','scr-tab','scr-sub','is-entering'];
  app.classList.remove(...all);
  void app.offsetWidth;
  app.classList.add(cls, 'is-entering');
  clearTimeout(UX.enterT);
  UX.enterT = setTimeout(()=>app.classList.remove(...all), 1300);
  uxStagger(app);
  uxCountUp(app);
}
/* Lo visible entra escalonado; lo que está más abajo aparece al scrollear */
function uxStagger(app){
  const vh = window.innerHeight || 800;
  const nodes = Array.from(app.querySelectorAll(UX_STG_SEL)).filter(n=>{
    const p = n.parentElement && n.parentElement.closest(UX_STG_SEL);
    return !(p && app.contains(p));
  }).slice(0, 160);
  const canIO = 'IntersectionObserver' in window;
  if(canIO && !UX.io){
    UX.io = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        const t = en.target; UX.io.unobserve(t);
        t.classList.add('rv-in');
        setTimeout(()=>t.classList.remove('rv','rv-in'), 700);
      });
    }, {rootMargin:'0px 0px -6% 0px', threshold:0.04});
  }
  let k = 0;
  nodes.forEach(n=>{
    const top = n.getBoundingClientRect().top;
    if(top < vh){
      n.style.setProperty('--d', Math.min(k++, 12)*45+'ms');
      n.classList.add('stg');
      n.addEventListener('animationend', function done(ev){ if(ev.target!==n) return; n.classList.remove('stg'); n.removeEventListener('animationend', done); });
    } else if(canIO){
      n.classList.add('rv');
      UX.io.observe(n);
    }
  });
}
/* Los números grandes cuentan hacia arriba al entrar */
function uxCountUp(app){
  const nodes = Array.from(app.querySelectorAll(UX_COUNT_SEL)).slice(0, 40);
  nodes.forEach(n=>{
    if(n.children.length) return;
    const txt = n.textContent.trim();
    if(!/^\d{1,4}$/.test(txt)) return;
    const to = Number(txt); if(to<2) return;
    const t0 = performance.now(), dur = 650 + Math.min(500, to*4);
    const step = now=>{
      const f = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-f, 3);
      n.textContent = String(Math.round(to*e));
      if(f<1 && n.isConnected) requestAnimationFrame(step); else n.textContent = txt;
    };
    n.textContent = '0';
    requestAnimationFrame(step);
  });
}
/* Píldora de vidrio que se desliza bajo la pestaña activa del dock */
function uxTabIndicator(){
  const bar = el('tabbar'); if(!bar) return;
  let ind = bar.querySelector('.tab-indicator');
  if(!ind){ ind = document.createElement('span'); ind.className = 'tab-indicator'; ind.setAttribute('aria-hidden','true'); bar.insertBefore(ind, bar.firstChild); }
  const act = bar.querySelector('button.active');
  if(!act || !act.offsetWidth){ ind.classList.remove('ready'); return; }
  const first = !ind.classList.contains('ready');
  if(first) ind.style.transition = 'none';
  ind.style.width = act.offsetWidth+'px';
  ind.style.transform = 'translateX('+act.offsetLeft+'px)';
  if(first){ void ind.offsetWidth; ind.style.transition = ''; ind.classList.add('ready'); }
  if(UX.lastTab!==null && UX.lastTab!==ui.tab && !prefersReduced()){
    const ic = act.querySelector('.ic');
    if(ic){ ic.classList.remove('bounce'); void ic.offsetWidth; ic.classList.add('bounce'); }
  }
  UX.lastTab = ui.tab;
}
window.addEventListener('resize', ()=>requestAnimationFrame(uxTabIndicator), {passive:true});
/* Dirección de la transición: atrás desliza desde la izquierda, el dock hace un fundido */
{
  const back = App.__back;
  App.__back = function(){ UX.navDir = 'back'; try{ return back.apply(this, arguments); } finally{ UX.navDir = null; } };
  const setTab = App.setTab;
  if(typeof setTab==='function') App.setTab = function(){ UX.navDir = 'tab'; try{ return setTab.apply(this, arguments); } finally{ UX.navDir = null; } };
}
/* Onda al tocar botones */
document.addEventListener('pointerdown', e=>{
  if(prefersReduced()) return;
  const b = e.target.closest && e.target.closest('.btn, .chip, .sp-chip, .seg button, .icon-btn, .batch-btn, .toggle-row button');
  if(!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height)*2.2;
  const s = document.createElement('span');
  s.className = 'rp';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);
  setTimeout(()=>s.remove(), 650);
}, {passive:true});
/* La barra superior gana sombra al scrollear */
(function(){
  let ticking = false;
  const upd = ()=>{ ticking = false; const t = el('topbar'), a = el('app'); if(t) t.classList.toggle('scrolled', Math.max(window.scrollY||0, a ? a.scrollTop : 0) > 6); };
  document.addEventListener('scroll', ()=>{ if(!ticking){ ticking = true; requestAnimationFrame(upd); } }, {passive:true, capture:true});
})();
/* Equipos con poca memoria o pocos núcleos: vidrio sin desenfoque en las tarjetas */
try{
  const lowEnd = (navigator.deviceMemory && navigator.deviceMemory<=2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency<=2);
  if(lowEnd) document.documentElement.classList.add('lite-glass');
}catch(e){}

/* Partido: destello del color del club en el marcador cuando entra un gol */
function sbFlash(sideKey, color){
  const sb = el('scoreboardBox'); if(!sb || animSkip || prefersReduced()) return;
  const f = document.createElement('div');
  f.className = 'sb-flash';
  f.style.cssText = `left:${sideKey==='a'?'22%':'78%'};--fc:${color}`;
  sb.appendChild(f);
  setTimeout(()=>f.remove(), 1400);
}
/* Color y lado de cada incidencia para la línea de tiempo */
function evSideAttrs(e, A, B){
  const id = e.creditTeamId || e.teamId;
  const k = id===A.id ? 'home' : id===B.id ? 'away' : (e.side==='home' || e.side==='away') ? e.side : null;
  if(!k) return {cls:'', style:'', color:''};
  const c = k==='home' ? kitColors(A,null).shirt : kitColors(B,A).shirt;
  return {cls:' ev-'+k, style:` style="--tc:${c}"`, color:c};
}

/* ---------- Inicio ---------- */
applyTheme();
try{ history.replaceState({lm:true}, ''); }catch(e){}
persist();
render();

/* Animación de inicio: se oculta sola una vez que la app ya renderizó */
try{
  const splash = document.getElementById('splash');
  if(splash){
    const hideSplash = ()=>{
      if(!splash.parentNode) return;
      splash.classList.add('splash-out');
      setTimeout(()=>{ if(splash.parentNode) splash.remove(); }, 550);
    };
    const minDelay = prefersReduced() ? 250 : 1150;
    setTimeout(hideSplash, minDelay);
  }
}catch(e){}

})();
</script>
