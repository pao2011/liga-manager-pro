<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E4D2B">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F17">
<meta name="mobile-web-app-capable" content="yes">
<title>Liga Manager Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1FAEE; --surface:#FFFFFF; --surface-2:#E7F3EA; --text:#10231C; --text-dim:#4E6459;
    --accent:#1B7A4A; --accent-strong:#0F5C36; --gold:#C6941B; --silver:#8A96A3; --danger:#D6293A; --warn:#B9790E;
    --border:#D7E5DC; --shadow:rgba(16,35,28,0.08);
    --font-display:'Teko','Arial Narrow',sans-serif; --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1F17; --surface:#132C21; --surface-2:#173626; --text:#EAF4EE; --text-dim:#93B0A2;
      --accent:#4CC38A; --accent-strong:#6FDA9F; --gold:#E9C46A; --silver:#C9D3DC; --danger:#FF6B6B; --warn:#FFC862;
      --border:#20402F; --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1F17; --surface:#132C21; --surface-2:#173626; --text:#EAF4EE; --text-dim:#93B0A2;
    --accent:#4CC38A; --accent-strong:#6FDA9F; --gold:#E9C46A; --silver:#C9D3DC; --danger:#FF6B6B; --warn:#FFC862;
    --border:#20402F; --shadow:rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    display:flex; justify-content:center; min-height:100vh;
  }
  #shell{ width:100%; max-width:520px; min-height:100vh; display:flex; flex-direction:column; position:relative; background:var(--bg);}
  header.topbar{
    display:flex; align-items:center; gap:8px; padding:14px 16px 12px; position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  header.topbar .back-btn{
    background:none; border:none; color:var(--text); font-size:22px; line-height:1; padding:4px 6px 4px 0; cursor:pointer;
  }
  header.topbar h1{
    font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:0.3px; margin:0; flex:1;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px; padding:0 6px;
    background:var(--accent); color:#fff; font-family:var(--font-body); font-weight:700; font-size:12px;
    border-radius:999px; vertical-align:middle; margin-left:6px; animation:countPop .35s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes countPop{ 0%{ transform:scale(.4); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  header.topbar .top-actions{ display:flex; gap:6px; }
  header.topbar .icon-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px;
    width:36px; height:36px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  main{ flex:1; padding:14px 16px 90px; overflow-x:hidden; }
  nav.tabbar{
    position:sticky; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 2px; color:var(--text-dim); font-family:var(--font-body); font-size:11.5px; cursor:pointer; border-radius:10px;
  }
  nav.tabbar button .ic{ font-size:20px; }
  nav.tabbar button.active{ color:var(--accent-strong); }
  nav.tabbar button.active .ic{ transform:translateY(-1px); }

  h2.section-title{ font-family:var(--font-display); font-weight:600; font-size:22px; margin:2px 0 12px; color:var(--text);}
  p.hint{ color:var(--text-dim); font-size:13.5px; line-height:1.5; margin:0 0 14px;}
  .empty-state{ text-align:center; padding:48px 16px; color:var(--text-dim);}
  .empty-state .em{ font-size:40px; display:block; margin-bottom:10px;}
  .empty-state b{ color:var(--text); display:block; margin-bottom:4px; font-size:15px;}

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px;}
  .team-row{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .team-row .meta{ flex:1; min-width:0;}
  .team-row .meta .name{ font-weight:600; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .team-row .meta .sub{ color:var(--text-dim); font-size:12.5px; margin-top:2px;}
  .chev{ color:var(--text-dim); font-size:18px;}
  .team-row-new{ animation:teamNewIn .6s cubic-bezier(.22,1,.36,1) both, teamNewGlow 1.6s ease-out both; border-color:var(--accent); }
  @keyframes teamNewIn{
    0%{ opacity:0; transform:translateY(22px) scale(.9); }
    55%{ opacity:1; transform:translateY(-4px) scale(1.03); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes teamNewGlow{
    0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
    55%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); }
    100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
  }

  .form-group{ margin-bottom:16px; }
  .form-group label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:none;}
  .form-group input[type=text], .form-group input[type=number], .form-group select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); font-size:15px; font-family:var(--font-body); transition:border-color .2s ease, box-shadow .2s ease;
  }
  .form-group input:focus, .form-group select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:12px;
    border:none; font-family:var(--font-body); font-weight:600; font-size:14.5px; cursor:pointer; width:100%;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background-color .18s ease, opacity .18s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border:1.5px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
  .btn-gold{ background:var(--gold); color:#fff; border:none; box-shadow:0 4px 10px rgba(198, 148, 27, 0.3); }
  .btn-row{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .btn-row > *{ flex:1; min-width:120px;}

  .shape-grid, .icon-grid, .color-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
  .shape-grid{ grid-template-columns:repeat(3,1fr); }
  .icon-grid{ grid-template-columns:repeat(5,1fr); }
  .pick{
    display:flex; align-items:center; justify-content:center; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); padding:10px 0; font-size:20px; cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
  }
  .pick:active{ transform:scale(.9); }
  .pick.selected{ border-color:var(--accent); background:var(--surface-2); box-shadow:0 0 0 1px var(--accent) inset; transform:scale(1.05);}
  .swatch{ width:100%; aspect-ratio:1; border-radius:10px; border:2px solid transparent; cursor:pointer; transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .18s ease;}
  .swatch:active{ transform:scale(.9); }
  .swatch.selected{ border-color:var(--text); transform:scale(1.05); }
  .crest-preview-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px;}
  .crest-preview-wrap img, .crest-strip img, .team-chip img, .gfx-crest img{ display:block; }
  .img-upload-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .img-upload-row > *{ flex:1; min-width:150px; }
  .img-upload-btn{ cursor:pointer; position:relative; display:inline-flex; align-items:center; }
  .img-upload-btn input[type="file"]{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .toggle-row{ display:flex; gap:8px; margin-bottom:14px;}
  .toggle-row button{ flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer;}
  .toggle-row button.active{ background:var(--accent); color:#fff; border-color:var(--accent);}

  .player-row{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border);}
  .player-row:last-child{ border-bottom:none;}
  .dorsal{ width:32px; height:32px; border-radius:8px; background:var(--surface-2); color:var(--text); font-family:var(--font-display);
    font-weight:600; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .player-row .pname{ flex:1; font-size:14.5px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pos-badge{ font-size:10.5px; font-weight:700; color:var(--text-dim); background:var(--surface-2); padding:3px 7px; border-radius:6px; letter-spacing:0.3px;}
  .row-actions{ display:flex; gap:4px;}
  .icon-mini{ background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer; padding:4px;}
  .icon-mini:disabled{ opacity:0.3; cursor:not-allowed;}

  .seg{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; margin-bottom:16px; gap:3px;}
  .seg button{ flex:1; border:none; background:none; padding:9px 4px; border-radius:9px; font-weight:600; font-size:13px; color:var(--text-dim); cursor:pointer;
    transition:background-color .2s cubic-bezier(.4,0,.2,1), color .2s ease, box-shadow .2s ease, transform .12s ease;}
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px var(--shadow);}
  .seg button:active{ transform:scale(.95); }

  .comp-card{ cursor:pointer; }
  .comp-card .top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .comp-card .title{ font-weight:700; font-size:15.5px;}
  .tag{ font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:20px; letter-spacing:0.3px;}
  .tag-liga{ background:#DCF0E4; color:var(--accent-strong);}
  .tag-elim{ background:#F3E3CE; color:var(--warn);}
  :root[data-theme="dark"] .tag-liga{ background:#173626; }
  :root[data-theme="dark"] .tag-elim{ background:#3A2B12; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag-liga{ background:#173626; }
    :root:not([data-theme="light"]) .tag-elim{ background:#3A2B12; }
  }
  .tag-done{ background:var(--surface-2); color:var(--text-dim);}
  .crest-strip{ display:flex; align-items:center; gap:6px; margin-top:4px;}
  .crest-strip svg{ display:block; }
  .team-chip{ display:flex; align-items:center; gap:8px; padding:10px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer;}
  .team-chip input{ margin-left:auto; width:18px; height:18px;}

  .jornada-header{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px; }
  .jornada-label{ font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px;}
  .batch-btn{ font-size:11.5px; padding:4px 10px; border-radius:8px; background:var(--surface-2); color:var(--accent-strong); border:1px solid var(--border); font-weight:700; cursor:pointer;}
  
  .match-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:9px;}
  .match-card.clasico{ border:1.5px solid #E24C3A; box-shadow:0 0 0 1px rgba(226,76,58,.18) inset; background:linear-gradient(180deg, rgba(226,76,58,.07), var(--surface) 60%); }
  .clasico-tag{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px; color:#fff; background:linear-gradient(90deg,#E24C3A,#B8291A); border-radius:6px; padding:3px 8px; margin-bottom:8px; }
  .next-up.clasico{ border:1.5px solid #E24C3A; }
  .match-teams{ display:flex; align-items:center; gap:8px;}
  .match-teams .side{ flex:1; display:flex; align-items:center; gap:8px; min-width:0;}
  .match-teams .side.right{ flex-direction:row-reverse; text-align:right;}
  .match-teams .tname{ font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-box{ font-family:var(--font-display); font-size:24px; font-weight:600; padding:0 8px; min-width:64px; text-align:center;}
  .vs-box{ font-size:13px; color:var(--text-dim); font-weight:700; min-width:64px; text-align:center;}
  .match-card .actions{ margin-top:10px;}
  .pen-note{ text-align:center; font-size:11.5px; color:var(--text-dim); margin-top:2px;}

  table.standings{ width:100%; border-collapse:collapse; font-size:12.5px;}
  table.standings th, table.standings td{ padding:8px 4px; text-align:center; border-bottom:1px solid var(--border);}
  table.standings th{ color:var(--text-dim); font-weight:700; font-size:11px; text-transform:uppercase;}
  table.standings td.team-cell{ text-align:left; display:flex; align-items:center; gap:6px; font-weight:600;}
  table.standings tr.pos1 td.team-cell{ color:var(--gold); font-weight:700; }
  table.standings tr.pos2 td.team-cell{ color:var(--silver); font-weight:700; }
  table.standings td.pos-cell{ line-height:1.15; }
  .pos-delta{ display:block; font-size:9.5px; font-weight:700; margin-top:1px;}
  .pos-delta.up{ color:#1B9E5A; }
  .pos-delta.down{ color:var(--danger); }
  .pos-delta.same{ color:var(--text-dim); }
  .pos-delta.na{ color:var(--text-dim); opacity:.5; }
  .form-dots{ display:flex; gap:2px; justify-content:center; }
  .fdot{ width:15px; height:15px; border-radius:4px; font-size:9px; font-weight:700; color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .fdot.ok{ background:var(--accent); }
  .fdot.dr{ background:var(--text-dim); }
  .fdot.lo{ background:var(--danger); }
  .form-none{ color:var(--text-dim); font-size:11px; }
  .streak-badge{ font-size:10.5px; font-weight:700; margin-left:4px; white-space:nowrap; }
  .streak-badge.hot{ color:var(--warn); }
  .streak-badge.safe{ color:var(--accent-strong); }
  .share-standings-btn{ margin-top:8px; }
  .fairplay-note{ font-size:11px; color:var(--text-dim); margin:2px 0 0; }

  .round-block{ margin-bottom:18px;}
  .round-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;}
  .bracket-match{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px;}
  .bracket-side{ display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:13.5px;}
  .bracket-side.winner{ font-weight:700; color:var(--accent-strong);}
  .bracket-side .g{ font-family:var(--font-display); font-size:17px;}
  .bracket-vs-line{ height:1px; background:var(--border); margin:2px 0;}
  .bye-note{ font-size:11.5px; color:var(--text-dim); text-align:center; padding:4px 0;}
  .champion-banner{ text-align:center; background:linear-gradient(135deg,var(--gold),#8a6a15); color:#3a2c05; border-radius:16px; padding:20px 14px; margin-bottom:18px;}
  :root[data-theme="dark"] .champion-banner{ color:#2a1f04; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .champion-banner{ color:#2a1f04; } }
  .champion-banner .cup{ font-size:34px;}
  .champion-banner .lbl{ font-size:12px; font-weight:700; letter-spacing:0.6px; opacity:0.85; margin-top:2px;}
  .champion-banner .cname{ font-family:var(--font-display); font-size:26px; font-weight:600; margin-top:2px;}

  .scoreboard{ background:var(--surface-2); border-radius:16px; padding:16px 14px 18px; margin-bottom:14px;}
  .matchclock-row{ text-align:center; margin-bottom:12px;}
  .phase-label{ font-size:11.5px; font-weight:700; letter-spacing:0.8px; color:var(--accent-strong); text-transform:uppercase; min-height:14px;}
  .matchclock{ font-family:var(--font-display); font-size:34px; font-weight:600; letter-spacing:1px; color:var(--text); font-variant-numeric:tabular-nums;}
  .scoreboard .teams{ display:flex; align-items:center; justify-content:center; gap:14px;}
  .scoreboard .tside{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  .scoreboard .tname{ font-size:13px; font-weight:700; text-align:center;}
  .scoreboard .score{ font-family:var(--font-display); font-size:42px; font-weight:600; letter-spacing:1px;}
  .scoreboard .pens{ text-align:center; font-size:12px; color:var(--text-dim); margin-top:8px;}
  .skip-btn{ width:auto; padding:8px 14px; margin:0 auto 14px; display:block; font-size:12.5px;}
  .half-divider{ text-align:center; font-size:11.5px; font-weight:700; color:var(--text-dim); letter-spacing:0.4px; text-transform:uppercase; padding:12px 0 10px; }

  .event-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13.5px;}
  .event-row:last-child{ border-bottom:none;}
  .event-min{ font-family:var(--font-display); font-size:15px; color:var(--text-dim); width:34px; flex-shrink:0;}
  .event-ic{ width:20px; text-align:center; flex-shrink:0;}
  .event-txt{ flex:1; min-width:0;}
  .event-txt .who{ font-weight:600;}
  .event-txt .sub{ color:var(--text-dim); font-size:12px;}
  .event-side-tag{ font-size:10.5px; color:var(--text-dim);}

  .motm-card{ border:1.5px solid var(--gold); border-radius:14px; padding:14px; margin:16px 0; display:flex; align-items:center; gap:12px; background:var(--surface);}
  .motm-card .em{ font-size:26px;}
  .motm-card .lbl{ font-size:11px; font-weight:700; color:var(--gold); letter-spacing:0.4px;}
  .motm-card .nm{ font-weight:700; font-size:15.5px;}

  .stat-list .stat-row{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border);}
  .stat-list .stat-row:last-child{ border-bottom:none;}
  .stat-rank{ width:22px; font-family:var(--font-display); font-size:17px; color:var(--text-dim); flex-shrink:0;}
  .stat-list .nm{ flex:1; min-width:0;}
  .stat-list .nm .n{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stat-list .nm .t{ font-size:11.5px; color:var(--text-dim);}
  .stat-val{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--accent-strong); min-width:28px; text-align:right;}

  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .confirm-sheet{ background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  .confirm-sheet p{ font-size:14.5px; color:var(--text-dim); margin:4px 0 18px;}
  .confirm-sheet h3{ margin:0; font-family:var(--font-display); font-size:21px; font-weight:600;}

  /* Overlay animado mientras se simulan varios partidos de una */
  .sim-loader-overlay{ align-items:center; background:rgba(8,18,14,0.55); backdrop-filter:blur(2px); animation:simOverlayIn .22s ease both; z-index:60;}
  .sim-loader-overlay.out{ animation:simOverlayOut .22s ease both; }
  @keyframes simOverlayIn{ 0%{ opacity:0; } 100%{ opacity:1; } }
  @keyframes simOverlayOut{ 0%{ opacity:1; } 100%{ opacity:0; } }
  .sim-loader{
    background:var(--surface); border-radius:20px; padding:28px 26px 24px; width:min(88%,340px); text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,0.35); animation:simSheetIn .32s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes simSheetIn{ 0%{ opacity:0; transform:translateY(18px) scale(.94); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
  .sim-loader-pitch{

  @keyframes lightsPulse{50%{opacity:.75;transform:scale(1.02)}}
  .goal-fx{ position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; overflow:hidden; color:var(--fg,#fff);
    background:radial-gradient(circle at 50% 38%, var(--c2), var(--c1) 78%); animation:gfxIn .32s ease-out both; pointer-events:none; }
  .goal-fx.out{ animation:gfxOut .26s ease-in forwards; }
  @keyframes gfxIn{ from{ opacity:0; transform:scale(.86);} to{ opacity:1; transform:scale(1);} }
  @keyframes gfxOut{ to{ opacity:0; transform:scale(1.06);} }
  .gfx-rays{ position:absolute; left:50%; top:38%; width:560px; height:560px; margin:-280px 0 0 -280px; opacity:.28;
    background:repeating-conic-gradient(from 0deg, var(--fg,#fff) 0 7deg, transparent 7deg 20deg); animation:gfxSpin 6s linear infinite; -webkit-mask-image:radial-gradient(circle, #000 8%, transparent 62%); mask-image:radial-gradient(circle, #000 8%, transparent 62%); }
  @keyframes gfxSpin{ to{ transform:rotate(360deg);} }
  .gfx-crest{ position:relative; animation:gfxCrest .9s cubic-bezier(.2,1.5,.4,1) .05s both; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  @keyframes gfxCrest{ 0%{ transform:translateY(40px) scale(.3); opacity:0;} 60%{ transform:translateY(-8px) scale(1.15); opacity:1;} 100%{ transform:translateY(0) scale(1);} }
  .gfx-title{ position:relative; font-family:var(--font-display); font-size:52px; font-weight:700; letter-spacing:2px; line-height:1; margin-top:2px; text-shadow:0 3px 0 rgba(0,0,0,.22); }
  .gfx-title span{ display:inline-block; animation:gfxLetter .6s cubic-bezier(.2,1.7,.4,1) both; }
  @keyframes gfxLetter{ 0%{ transform:translateY(-60px) scale(.2) rotate(-25deg); opacity:0;} 100%{ transform:translateY(0) scale(1) rotate(0); opacity:1;} }
  .gfx-who{ position:relative; font-weight:800; font-size:15px; margin-top:2px; animation:gfxFade .4s ease-out .55s both; }
  .gfx-sub{ position:relative; font-size:12px; opacity:.92; animation:gfxFade .4s ease-out .7s both; min-height:15px; padding:0 10px; }
  @keyframes gfxFade{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .gfx-goal{ position:absolute; right:12px; bottom:8px; width:74px; height:34px; opacity:.95; }
  .gfx-net{ position:absolute; inset:0; border:3px solid var(--fg,#fff); border-bottom:none; border-radius:4px 4px 0 0;
    background:repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.35) 5px 6px), repeating-linear-gradient(-45deg, transparent 0 5px, rgba(255,255,255,.35) 5px 6px); animation:gfxNet .5s ease-out 1.05s both; }
  @keyframes gfxNet{ 0%{ transform:scaleY(1);} 40%{ transform:scale(1.08,1.18);} 100%{ transform:scale(1);} }
  .gfx-ball{ position:absolute; left:26px; top:6px; font-size:20px; animation:gfxBall 1.1s cubic-bezier(.3,.7,.4,1) both; }
  @keyframes gfxBall{ 0%{ transform:translate(-260px,60px) scale(2) rotate(0); opacity:0;} 15%{ opacity:1;} 85%{ transform:translate(0,0) scale(1) rotate(900deg);} 100%{ transform:translate(0,0) scale(1) rotate(900deg);} }
  .gfx-confetti{ position:absolute; left:50%; top:38%; width:0; height:0; }
  .gfx-confetti i{ position:absolute; width:8px; height:12px; border-radius:2px; opacity:0; animation:gfxConf 1.7s cubic-bezier(.15,.7,.3,1) var(--dl) both; }
  @keyframes gfxConf{ 0%{ transform:translate(0,0) rotate(0); opacity:1;} 100%{ transform:translate(var(--dx), calc(var(--dy) + 90px)) rotate(var(--r)); opacity:0;} }
  .goal-fx.var-fx{ background:radial-gradient(circle at 50% 40%, #3A1116, #1a0508 80%); color:#fff; }
  .goal-fx.var-fx .gfx-title{ color:#FF6B6B; animation:gfxLetter .5s ease-out both; }
  .goal-fx.reduce *{ animation:none !important; }
  @media (prefers-reduced-motion: reduce){
    .goal-fx *, .scoreboard.shake, .scoreboard .score.pop, .cc-trophy{ animation:none !important; }
  }

  /* ====== v6 · Compatibilidad móvil / escritorio ====== */
  html{ -webkit-text-size-adjust:100%; }
  body{ min-height:100dvh; overscroll-behavior-y:contain; }
  #shell{ min-height:100dvh; }
  header.topbar{ padding-top:calc(14px + env(safe-area-inset-top)); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  button, .pick, .swatch, .chip, .team-chip, .card, .pl, .seg button, .tlink, .stat-row, .kv{ touch-action:manipulation; }
  main{ -webkit-overflow-scrolling:touch; }
  button:focus-visible, select:focus-visible, input:focus-visible, .pick:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }
  .seg{ overflow-x:auto; scrollbar-width:none; }
  .seg::-webkit-scrollbar{ display:none; }
  .seg button{ white-space:nowrap; min-width:0; }
  @media (min-width:560px){ .seg button{ font-size:13.5px; } }
  @media (max-width:380px){
    nav.tabbar button{ font-size:10px; }
    nav.tabbar button .ic{ font-size:18px; }
    .seg button{ font-size:11.5px; padding:9px 2px; }
    .scoreboard .score{ font-size:36px; }
    .scoreboard .teams{ gap:8px; }
    .gfx-title{ font-size:42px; }
  }
  @media (hover:hover){
    .card.team-row:hover, .comp-card:hover, .tm-row:hover{ border-color:var(--accent); }
    .btn:hover:not(:disabled){ filter:brightness(1.06); }
    .chip:hover{ border-color:var(--accent); }
  }

  /* ====== v6 · Marcador en vivo ====== */
  .wx-row{ text-align:center; font-size:11.5px; color:var(--text-dim); margin:-4px 0 10px; }
  .clock-track{ height:4px; border-radius:4px; background:var(--border); margin:8px auto 0; max-width:230px; overflow:hidden; }
  .clock-track i{ display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); transition:width .18s linear; }
  .mom-wrap{ position:relative; height:7px; border-radius:6px; margin-top:12px; overflow:hidden;
    background:linear-gradient(90deg, var(--mom-a,#1B7A4A) 0 50%, var(--mom-b,#1D5FA8) 50% 100%); opacity:.28; }
  .mom-wrap i{ position:absolute; top:0; bottom:0; left:50%; width:3px; margin-left:-1.5px; background:var(--text); border-radius:3px; transition:left .5s cubic-bezier(.4,0,.2,1); opacity:.85; }
  .mom-lbl{ display:flex; justify-content:space-between; font-size:10px; font-weight:700; color:var(--text-dim); letter-spacing:.4px; margin-top:4px; }

  .live-strip{ display:flex; gap:6px; margin-bottom:10px; }
  .ls-box{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:7px 4px; text-align:center; min-width:0; }
  .ls-box .lv{ font-family:var(--font-display); font-size:19px; font-weight:600; line-height:1; }
  .ls-box .ll{ font-size:9.5px; color:var(--text-dim); margin-top:3px; letter-spacing:.2px; }
  .poss-bar{ display:flex; height:9px; border-radius:6px; overflow:hidden; margin-bottom:4px; border:1px solid var(--border); }
  .poss-bar i{ display:block; height:100%; transition:width .6s cubic-bezier(.4,0,.2,1); }
  .poss-row{ display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-dim); margin-bottom:10px; }

  .commentary{ background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.45; min-height:42px;
    margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .commentary .cm-min{ font-family:var(--font-display); font-size:15px; color:var(--accent-strong); flex-shrink:0; min-width:30px; }
  .commentary .cm-tx{ flex:1; min-width:0; }
  .commentary.flash{ animation:cmFlash .5s ease-out; }
  @keyframes cmFlash{ 0%{ background:var(--accent); color:#fff;} 100%{ background:var(--surface-2); } }

  .speed-row{ display:flex; gap:6px; align-items:center; margin-bottom:12px; }
  .speed-row .sp-lbl{ font-size:11px; color:var(--text-dim); font-weight:700; margin-right:2px; }
  .sp-chip{ border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:9px; padding:6px 9px;
    font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font-body); }
  .sp-chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .speed-row .skip-inline{ margin-left:auto; width:auto; padding:7px 12px; font-size:12.5px; }

  /* Entrada de cada incidencia */
  .event-row.ev-in{ animation:evIn .34s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes evIn{ from{ opacity:0; transform:translateX(-14px);} to{ opacity:1; transform:none;} }
  .event-row.big{ background:var(--surface-2); border-radius:10px; padding-left:8px; padding-right:8px; }

  /* ====== v6 · Efectos a pantalla ====== */
  .goal-fx.own-fx{ color:#fff; }
  .goal-fx.own-fx .gfx-title{ color:#FFD9D9; }
  .fx-card-wrap{ position:relative; perspective:600px; }
  .fx-card{ width:54px; height:76px; border-radius:7px; box-shadow:0 8px 20px rgba(0,0,0,.45); animation:cardSpin .9s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes cardSpin{ 0%{ transform:translateY(70px) rotateZ(-40deg) rotateY(180deg); opacity:0;} 55%{ transform:translateY(-10px) rotateZ(8deg) rotateY(0); opacity:1;} 100%{ transform:translateY(0) rotateZ(0) rotateY(0);} }
  .goal-fx.card-fx{ background:radial-gradient(circle at 50% 40%, #3b0d12, #14050a 80%); }
  .goal-fx.yellow-fx{ background:radial-gradient(circle at 50% 40%, #4a3a06, #140f02 80%); }
  .fx-whistle{ font-size:44px; animation:whistleShake .7s ease-out both; }
  @keyframes whistleShake{ 0%{ transform:scale(.4) rotate(-20deg); opacity:0;} 60%{ transform:scale(1.2) rotate(8deg); opacity:1;} 100%{ transform:scale(1) rotate(0);} }
  .fx-spot{ position:relative; width:120px; height:60px; margin-top:6px; }
  .fx-spot .dot{ position:absolute; left:50%; bottom:6px; width:9px; height:9px; margin-left:-4.5px; border-radius:50%; background:var(--fg,#fff); opacity:.9; }
  .fx-spot .ball{ position:absolute; left:50%; bottom:2px; margin-left:-11px; font-size:22px; animation:penRun 1s cubic-bezier(.3,.8,.4,1) .25s both; }
  @keyframes penRun{ 0%{ transform:translate(0,0) scale(1) rotate(0);} 100%{ transform:translate(0,-44px) scale(.7) rotate(540deg);} }
  .fx-gloves{ font-size:34px; animation:gloveIn .6s cubic-bezier(.2,1.5,.4,1) .3s both; }
  @keyframes gloveIn{ 0%{ transform:translateX(-40px) rotate(-30deg) scale(.5); opacity:0;} 100%{ transform:none; opacity:1;} }
  .goal-fx.final-fx{ background:radial-gradient(circle at 50% 38%, #10382a, #05130d 80%); color:#fff; }
  .fx-final-score{ font-family:var(--font-display); font-size:56px; font-weight:700; letter-spacing:2px; line-height:1; margin-top:6px;
    animation:gfxCrest .8s cubic-bezier(.2,1.4,.4,1) both; }
  .fx-crests{ display:flex; align-items:center; gap:18px; }
  .goal-fx.var-fx .var-scan{ position:absolute; left:0; right:0; height:3px; background:#FF6B6B; box-shadow:0 0 14px 3px rgba(255,107,107,.8); animation:varScan 1.3s ease-in-out infinite; }
  @keyframes varScan{ 0%{ top:12%;} 50%{ top:86%;} 100%{ top:12%;} }
  .var-box{ position:relative; border:2.5px dashed rgba(255,255,255,.55); border-radius:10px; width:128px; height:78px; margin-bottom:8px; overflow:hidden; }
  .var-box .var-ball{ position:absolute; left:50%; top:50%; margin:-10px 0 0 -10px; font-size:20px; animation:varPulse 1.1s ease-in-out infinite; }
  @keyframes varPulse{ 0%,100%{ transform:scale(1); opacity:.9;} 50%{ transform:scale(1.25); opacity:1;} }
  .fx-ht{ font-size:40px; letter-spacing:6px; animation:gfxCrest .8s cubic-bezier(.2,1.5,.4,1) both; }

  /* ====== v6 · Estadísticas del partido ====== */
  .mstat{ margin-bottom:11px; }
  .mstat .mt{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; margin-bottom:4px; }
  .mstat .mt b{ font-family:var(--font-display); font-size:17px; font-weight:600; }
  .mstat .mt span{ color:var(--text-dim); font-size:11.5px; letter-spacing:.3px; }
  .mstat .mbar{ display:flex; height:8px; border-radius:5px; overflow:hidden; background:var(--surface-2); }
  .mstat .mbar i{ display:block; height:100%; transition:width .7s cubic-bezier(.4,0,.2,1); }
  .cronica{ font-size:14px; line-height:1.62; }
  .cronica p{ margin:0 0 11px; }
  .cronica p:last-child{ margin-bottom:0; }
  .h2h{ display:flex; gap:8px; text-align:center; }
  .h2h div{ flex:1; background:var(--surface-2); border-radius:11px; padding:9px 4px; }
  .h2h b{ display:block; font-family:var(--font-display); font-size:22px; font-weight:600; }
  .h2h span{ font-size:10.5px; color:var(--text-dim); }

  /* ====== v6 · Estado físico y racha ====== */
  .fit-bar{ width:42px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; flex-shrink:0; }
  .fit-bar i{ display:block; height:100%; border-radius:4px; }
  .fit-hi{ background:#1B9E5A; } .fit-mid{ background:#E08A1E; } .fit-lo{ background:#D6293A; }
  .ps-meters{ display:flex; gap:8px; margin:12px 0 2px; }
  .ps-meters > div{ flex:1; background:var(--surface-2); border-radius:11px; padding:9px 10px; }
  .ps-meters .mv{ font-family:var(--font-display); font-size:20px; font-weight:600; }
  .ps-meters .ml{ font-size:10.5px; color:var(--text-dim); }
  .search-wrap{ position:relative; margin-bottom:12px; }
  .search-wrap input{ width:100%; padding:11px 12px 11px 34px; border-radius:11px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family:var(--font-body); }
  .search-wrap .si{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.6; }
  .sort-row{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; }
  .sort-row::-webkit-scrollbar{ display:none; }

  /* ====== v7 · Animaciones extra ====== */
  .scoreboard.tense{ animation:tensePulse 1.8s ease-in-out infinite; }
  @keyframes tensePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(214,41,58,0); } 50%{ box-shadow:0 0 0 3px rgba(214,41,58,.35); } }
  .goal-fx.kick-fx{ background:radial-gradient(circle at 50% 42%, #123726, #05120c 82%); color:#fff; }
  .kick-crests{ display:flex; align-items:center; gap:10px; }
  .kick-crests .kc-l{ animation:kcLeft .7s cubic-bezier(.2,1.4,.4,1) both; }
  .kick-crests .kc-r{ animation:kcRight .7s cubic-bezier(.2,1.4,.4,1) both; }
  .kick-crests .kc-vs{ font-family:var(--font-display); font-size:26px; opacity:.8; animation:gfxFade .4s ease-out .5s both; }
  @keyframes kcLeft{ from{ transform:translateX(-120px) rotate(-20deg); opacity:0;} to{ transform:none; opacity:1;} }
  @keyframes kcRight{ from{ transform:translateX(120px) rotate(20deg); opacity:0;} to{ transform:none; opacity:1;} }
  .goal-fx.comeback-fx .gfx-title{ color:#FFE9A8; }
  .fx-flip{ font-size:40px; animation:flipSpin 1s cubic-bezier(.3,1.2,.4,1) both; }
  @keyframes flipSpin{ 0%{ transform:rotateY(0) scale(.4); opacity:0;} 100%{ transform:rotateY(720deg) scale(1); opacity:1;} }
  /* ====== v8 · Incidencias con animación propia (peleas, invasiones, clásicos) ====== */
  .goal-fx.scuffle-fx{ background:radial-gradient(circle at 50% 40%, #4a1608, #160402 82%); color:#fff; }
  .goal-fx.scuffle-fx .gfx-title{ color:#FFB199; }
  .fx-fists{ font-size:40px; letter-spacing:10px; animation:fistShake .55s cubic-bezier(.36,.07,.19,.97) 3 both; }
  @keyframes fistShake{ 0%,100%{ transform:translateX(0) rotate(0);} 20%{ transform:translateX(-8px) rotate(-8deg);} 40%{ transform:translateX(7px) rotate(7deg);} 60%{ transform:translateX(-6px) rotate(-5deg);} 80%{ transform:translateX(5px) rotate(4deg);} }
  .goal-fx.invasion-fx{ background:radial-gradient(circle at 50% 40%, #123018, #030d06 82%); color:#fff; }
  .goal-fx.invasion-fx .gfx-title{ color:#FFE9A8; }
  .fx-runners{ font-size:32px; letter-spacing:8px; animation:runIn .8s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes runIn{ 0%{ transform:translateX(-70px); opacity:0;} 60%{ opacity:1;} 100%{ transform:translateX(0); opacity:1;} }
  .fx-tape{ position:relative; width:150px; height:10px; margin-top:8px; background:repeating-linear-gradient(-45deg,#F2C94C 0 10px,#181818 10px 20px); border-radius:3px; animation:tapeSnap 1.4s ease-in-out infinite; opacity:.9; }
  @keyframes tapeSnap{ 0%,100%{ transform:scaleX(1);} 50%{ transform:scaleX(.92);} }
  .goal-fx.object-fx{ background:radial-gradient(circle at 50% 40%, #3a2a06, #100b02 82%); color:#fff; }
  .goal-fx.object-fx .gfx-title{ color:#FFD9A8; }
  .fx-object{ position:relative; width:140px; height:70px; }
  .fx-object span{ position:absolute; left:0; bottom:0; font-size:26px; animation:objArc 1s cubic-bezier(.3,.5,.4,1) both; }
  @keyframes objArc{ 0%{ transform:translate(0,0) rotate(0); opacity:0;} 12%{ opacity:1;} 50%{ transform:translate(60px,-60px) rotate(220deg);} 100%{ transform:translate(120px,0) rotate(420deg); opacity:1;} }
  .goal-fx.flare-fx{ background:radial-gradient(circle at 50% 40%, #5a1108, #160302 82%); color:#fff; animation:gfxIn .32s ease-out both, flareGlow 1.1s ease-in-out infinite; }
  @keyframes flareGlow{ 0%,100%{ box-shadow:inset 0 0 60px 10px rgba(214,41,58,0);} 50%{ box-shadow:inset 0 0 60px 10px rgba(214,41,58,.45);} }
  .goal-fx.flare-fx .gfx-title{ color:#FF8A6B; }
  .fx-flare{ font-size:40px; animation:flarePulse .7s ease-in-out infinite; }
  @keyframes flarePulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }
  .gfx-smoke{ position:absolute; left:50%; top:52%; width:0; height:0; }
  .gfx-smoke i{ position:absolute; bottom:0; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle, rgba(200,200,200,.55), rgba(200,200,200,0) 70%); opacity:0; animation:gfxSmoke 2.2s ease-out var(--dl) both; }
  @keyframes gfxSmoke{ 0%{ transform:translate(0,0) scale(.4); opacity:0;} 15%{ opacity:.85;} 100%{ transform:translate(var(--dx),-140px) scale(2.1); opacity:0;} }
  .goal-fx.brawl-fx{ background:radial-gradient(circle at 50% 40%, #5a0a10, #1a0206 82%); color:#fff; animation:gfxIn .32s ease-out both, brawlShake .5s cubic-bezier(.36,.07,.19,.97) 3; }
  @keyframes brawlShake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-3px);} 40%{ transform:translateX(3px);} 60%{ transform:translateX(-2px);} 80%{ transform:translateX(2px);} }
  .goal-fx.brawl-fx .gfx-title{ color:#FF9A9A; }
  .fx-brawl{ font-size:38px; letter-spacing:8px; animation:fistShake .5s cubic-bezier(.36,.07,.19,.97) 4 both; }
  .goal-fx.clasico-fx{ background:radial-gradient(circle at 50% 34%, #6a2410, #1a0602 82%); }
  .goal-fx.clasico-fx::before{ content:'🔥'; position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:20px; animation:flarePulse .8s ease-in-out infinite; opacity:.9; }
  .goal-fx.clasico-fx .gfx-title{ color:#FFC24C; }

  /* ====== v8 · Botón "subir arriba" ====== */
  html{ scroll-behavior:smooth; }
  #scrollTopBtn{ position:fixed; right:16px; bottom:86px; z-index:30; width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; box-shadow:0 6px 16px rgba(0,0,0,.28); font-size:19px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transform:translateY(16px) scale(.7);
    pointer-events:none; transition:opacity .28s cubic-bezier(.2,.9,.3,1), transform .28s cubic-bezier(.2,.9,.3,1); }
  #scrollTopBtn.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  #scrollTopBtn:active{ transform:scale(.86); }
  @media (max-width:520px){ #scrollTopBtn{ right:max(16px, calc((100vw - 520px)/2 + 16px)); } }

  /* ====== v8 · Más feedback táctil ====== */
  .icon-btn{ transition:transform .15s cubic-bezier(.2,.9,.3,1); }
  .icon-btn:active{ transform:scale(.88); }
  .card.team-row, .comp-card, .tm-row, .team-chip{ transition:transform .15s cubic-bezier(.2,.9,.3,1); }
  .card.team-row:active, .comp-card:active, .tm-row:active, .team-chip:active{ transform:scale(.97); }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    #scrollTopBtn{ transition:opacity .01s linear; }
    .goal-fx.scuffle-fx *, .goal-fx.invasion-fx *, .goal-fx.object-fx *, .goal-fx.flare-fx *, .goal-fx.brawl-fx *{ animation:none !important; }
  }

  /* ====== v8 · Celebración de campeón ====== */
  .champ-cele{ position:relative; text-align:center; overflow:hidden; padding-top:6px; }
  .champ-cele .cc-trophy{ font-size:52px; animation:trophyDrop .8s cubic-bezier(.2,1.4,.4,1) both, trophyFloat 2.2s ease-in-out 1s infinite; filter:drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
  @keyframes trophyDrop{ 0%{ transform:translateY(-60px) scale(.4) rotate(-15deg); opacity:0;} 60%{ transform:translateY(6px) scale(1.12) rotate(6deg); opacity:1;} 100%{ transform:translateY(0) scale(1) rotate(0);} }
  .champ-cele .cc-title{ font-family:var(--font-display); font-size:30px; letter-spacing:1px; color:var(--gold); margin-top:4px; }
  .champ-cele .cc-title span{ display:inline-block; animation:gfxLetter .55s cubic-bezier(.2,1.7,.4,1) both; }
  .champ-cele .cc-team{ font-weight:800; font-size:16px; margin-top:2px; }
  .champ-cele .cc-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .champ-cele .gfx-confetti{ top:6%; }
  .promo-sheet .ps-crown{ text-align:center; font-size:38px; animation:gfxCrest .8s cubic-bezier(.2,1.5,.4,1) both; }
  .round-sheet{ max-height:84vh; overflow-y:auto; }
  .rs-div{ font-size:11.5px; font-weight:700; color:var(--text-dim); letter-spacing:.4px; margin:12px 0 4px; }
  .rs-row{ display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer; }
  .rs-row:last-child{ border-bottom:none; }
  .rs-row .rs-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rs-row .rs-t.r{ text-align:right; }
  .rs-row .rs-sc{ font-family:var(--font-display); font-size:18px; min-width:46px; text-align:center; }
  .rs-row .rs-w{ font-weight:700; }
  .stake-chip{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.4px; background:var(--danger);
    color:#fff; padding:3px 9px; border-radius:20px; }
  .next-up{ display:flex; align-items:center; gap:9px; padding:10px; }
  .next-up .nu-body{ flex:1; min-width:0; }
  .next-up .nu-lbl{ font-size:10.5px; font-weight:700; color:var(--text-dim); letter-spacing:.5px; }
  .next-up .nu-vs{ font-size:13.5px; font-weight:600; margin-top:2px; }

  /* ====== v7 · Sistema de ligas ====== */
  table.standings tr.z-camp td:first-child{ box-shadow:inset 3px 0 0 var(--gold); }
  table.standings tr.z-camp td.team-cell{ color:var(--gold); font-weight:700; }
  table.standings tr.z-pl td:first-child{ box-shadow:inset 3px 0 0 #1D8FE1; }
  table.standings tr.z-asc td:first-child{ box-shadow:inset 3px 0 0 #1B9E5A; }
  table.standings tr.z-des td:first-child{ box-shadow:inset 3px 0 0 var(--danger); }
  table.standings tr.z-des td.team-cell{ color:var(--danger); }
  table.standings td.pos-cell{ font-family:var(--font-display); font-size:15px; color:var(--text-dim); width:22px; }
  .zone-key{ display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--text-dim); margin:8px 2px 0; }
  .zone-key span{ display:flex; align-items:center; gap:5px; }
  .zone-key i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  .div-card{ padding:12px; cursor:pointer; position:relative; overflow:hidden; }
  .div-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .div-badge{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:19px; font-weight:600; color:#fff; flex-shrink:0; }
  .div-name{ flex:1; min-width:0; font-weight:700; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .div-sub{ font-size:12px; color:var(--text-dim); margin-top:1px; }
  .div-prog{ height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
  .div-prog i{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); transition:width .5s ease; }
  .div-lead{ display:flex; align-items:center; gap:6px; font-size:12.5px; margin-top:8px; }
  .div-lead b{ font-weight:700; }

  .season-pill{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:20px;
    padding:5px 12px; font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .hist-season{ margin-bottom:16px; }
  .hist-row{ display:flex; align-items:center; gap:9px; padding:9px 2px; border-bottom:1px solid var(--border); font-size:13px; }
  .hist-row:last-child{ border-bottom:none; }
  .hist-row .hr-lvl{ font-family:var(--font-display); font-size:15px; color:var(--text-dim); width:20px; flex-shrink:0; }
  .hist-row .hr-body{ flex:1; min-width:0; }
  .hist-row .hr-div{ font-size:11px; color:var(--text-dim); }
  .mv-list{ font-size:11.5px; margin-top:2px; }
  .mv-up{ color:#1B9E5A; font-weight:600; } .mv-down{ color:var(--danger); font-weight:600; }

  .divi-editor{ border:1.5px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px; background:var(--surface);
    animation:diviIn .38s cubic-bezier(.22,1,.36,1) both; transition:border-color .2s ease, box-shadow .2s ease; }
  .divi-editor:focus-within{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .divi-editor .de-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .divi-editor .de-top input{ flex:1; min-width:0; }
  .divi-editor .de-del{ background:none; border:none; color:var(--danger); font-size:17px; cursor:pointer; padding:4px 6px; width:auto;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1); }
  .divi-editor .de-del:active{ transform:scale(.85) rotate(-8deg); }
  .format-extra{ animation:formatIn .32s cubic-bezier(.22,1,.36,1) both; }
  @keyframes diviIn{ from{ opacity:0; transform:translateY(12px) scale(.98);} to{ opacity:1; transform:none;} }
  @keyframes formatIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:none;} }
  .assign-row{ display:flex; align-items:center; gap:9px; padding:8px 2px; border-bottom:1px solid var(--border);
    animation:rowIn .3s cubic-bezier(.22,1,.36,1) both; }
  .assign-row:last-child{ border-bottom:none; }
  .assign-row .ar-meta{ flex:1; min-width:0; }
  .assign-row .ar-name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .assign-row .ar-sub{ font-size:11.5px; color:var(--text-dim); }
  .assign-row select{ width:auto; max-width:46%; padding:7px 8px; font-size:12.5px; border-radius:9px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-family:var(--font-body);
    transition:border-color .18s ease; }
  @keyframes rowIn{ from{ opacity:0; transform:translateX(-10px);} to{ opacity:1; transform:none;} }
  .issue-box{ background:rgba(214,41,58,.1); border:1px solid var(--danger); border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:13px;
    animation:issueIn .3s cubic-bezier(.22,1,.36,1) both; }
  .issue-box b{ display:block; margin-bottom:4px; }
  .issue-box ul{ margin:0; padding-left:18px; } .issue-box li{ margin:2px 0; }
  @keyframes issueIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:none;} }
  .cup-preview{ transition:box-shadow .2s ease; }
  .cup-preview.pv-pulse{ animation:pvPulse .32s cubic-bezier(.22,1,.36,1); }
  @keyframes pvPulse{ from{ opacity:.45; transform:scale(.985);} to{ opacity:1; transform:none;} }

  .promo-sheet{ max-height:86vh; overflow-y:auto; }
  .promo-block{ margin-bottom:14px; }
  .promo-block h4{ margin:0 0 6px; font-size:12.5px; color:var(--text-dim); font-weight:700; }
  .promo-team{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; }


  /* ====== v7 · Pronóstico, carrera de posiciones, premios, progresión y sonido ====== */
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:2px 10px; margin-bottom:10px; }
  .sec-head b{ font-family:var(--font-display); font-size:20px; font-weight:600; white-space:nowrap; }
  .sec-head span{ font-size:11.5px; color:var(--text-dim); text-align:right; }

  /* Pronóstico */
  .pred-card{ padding:14px 12px 12px; }
  .pred-bar{ display:flex; gap:3px; height:14px; }
  .pred-bar i{ display:block; height:100%; min-width:0; border-radius:4px; transition:width .3s cubic-bezier(.22,1,.36,1); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--text) 22%, transparent); }
  .pred-bar i.pd{ background:var(--silver); opacity:.55; }
  .pred-nums{ display:flex; gap:8px; margin-top:10px; text-align:center; }
  .pred-nums > div{ flex:1; min-width:0; }
  .pred-nums b{ display:block; font-family:var(--font-display); font-size:27px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .pred-nums span{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:11px; line-height:1.25; color:var(--text-dim); margin-top:3px; overflow:hidden; }
  .pred-foot{ margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; line-height:1.45; }
  .pred-foot .verdict{ font-weight:700; }
  .pred-scores{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pred-score{ background:var(--surface-2); border-radius:9px; padding:4px 9px; font-size:11.5px; color:var(--text-dim); }
  .pred-score b{ font-family:var(--font-display); font-size:17px; color:var(--text); margin-right:4px; font-weight:600; }
  .pred-line{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:12.5px; background:var(--surface-2); border-radius:12px; padding:9px 12px; margin-bottom:12px; }
  .pred-line b{ font-family:var(--font-display); font-size:16px; font-weight:600; }
  .pred-tag{ margin-left:auto; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface); border:1.5px solid var(--border); }
  .pred-tag.up{ background:var(--gold); border-color:var(--gold); color:#fff; }

  /* Carrera por posiciones */
  .pc-card{ padding:12px 10px 12px; margin-top:14px; }
  .pc-svg{ width:100%; height:auto; display:block; }
  .pc-svg text{ font-family:var(--font-body); fill:var(--text-dim); font-size:9px; }
  .pc-svg .pc-grid{ stroke:var(--border); stroke-width:.6; }
  .pc-svg .pc-line{ fill:none; stroke-linejoin:round; stroke-linecap:round; transition:opacity .25s ease; }
  .pc-legend{ display:flex; gap:6px; overflow-x:auto; padding:10px 2px 2px; scrollbar-width:none; }
  .pc-legend::-webkit-scrollbar{ display:none; }
  .pc-chip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 5px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer; font-family:var(--font-body); }
  .pc-chip.on{ border-color:var(--text); background:var(--surface-2); }
  .pc-note{ font-size:12.5px; margin:10px 2px 0; color:var(--text-dim); line-height:1.45; }
  .pc-note b{ color:var(--text); }

  /* Premios y once ideal */
  .award-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .award-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 12px; cursor:pointer; min-width:0; }
  .award-card.big{ grid-column:1 / -1; border:1.5px solid var(--gold); display:flex; align-items:center; gap:12px; padding:13px 14px; }
  .award-card .aw-ic{ font-size:26px; line-height:1; flex-shrink:0; }
  .award-card:not(.big) .aw-ic{ font-size:22px; margin-bottom:5px; }
  .award-card.big ~ .award-card:last-child:nth-child(even){ grid-column:1 / -1; }
  .award-card .aw-body{ min-width:0; flex:1; }
  .award-card .aw-t{ font-size:11.5px; font-weight:700; color:var(--gold); }
  .award-card .aw-n{ font-weight:700; font-size:14px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .award-card.big .aw-n{ font-size:16px; }
  .award-card .aw-s{ font-size:11.5px; color:var(--text-dim); margin-top:2px; display:flex; align-items:center; gap:5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .award-card .aw-v{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--accent-strong); flex-shrink:0; }
  .xi-wrap .pitch{ margin-top:4px; }
  .award-lines{ margin-top:4px; font-size:11.5px; line-height:1.5; }
  .award-lines div{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Progresión de plantillas */
  .prog-block{ margin:2px 0 14px; }
  .prog-block h4{ margin:0 0 4px; font-size:12.5px; color:var(--text-dim); font-weight:700; }
  .prog-row{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px; }
  .prog-row .pn{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog-row .pn em{ font-style:normal; color:var(--text-dim); font-size:11.5px; }
  .prog-row .pv{ font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .delta{ font-family:var(--font-display); font-size:17px; font-weight:600; min-width:34px; text-align:right; }
  .delta.up{ color:#1B9E5A; } .delta.down{ color:var(--danger); }
  .prog-tabs{ margin-bottom:8px; }
  .prog-sw{ display:flex; align-items:center; gap:12px; }
  .prog-sw .ps-txt{ flex:1; min-width:0; font-size:12.5px; color:var(--text-dim); line-height:1.45; }
  .prog-sw .ps-txt b{ display:block; color:var(--text); font-size:14px; margin-bottom:2px; }
  .prog-sw .btn{ width:auto; padding:9px 14px; font-size:13px; }
  .spark-box{ margin-top:12px; background:var(--surface-2); border-radius:12px; padding:10px 12px 8px; }
  .spark-box .sk-h{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-bottom:4px; }
  .spark-box .sk-h b{ color:var(--text); }
  .spark-box svg{ width:100%; height:auto; display:block; }
  .spark-box text{ font-family:var(--font-body); font-size:9.5px; fill:var(--text-dim); }
  .pot-line{ display:flex; align-items:center; gap:8px; margin:8px 0 2px; font-size:13px; }
  .pot-line .stars{ color:var(--gold); letter-spacing:1px; }
  .pot-line .cant{ margin-left:auto; font-size:11.5px; font-weight:700; color:var(--accent-strong); background:var(--surface-2); padding:3px 9px; border-radius:999px; }

  /* Sonido */
  .snd-chip{ border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:9px; padding:5px 9px; font-size:14px; line-height:1.2; cursor:pointer; font-family:var(--font-body); }
  .snd-chip.on{ border-color:var(--accent); color:var(--accent-strong); }

  @media (prefers-reduced-motion: reduce){
    .fx-card, .fx-whistle, .fx-spot .ball, .fx-gloves, .fx-final-score, .var-scan, .var-box .var-ball, .fx-ht,
    .scoreboard.tense, .kick-crests .kc-l, .kick-crests .kc-r, .fx-flip, .promo-sheet .ps-crown,
    .event-row.ev-in, .commentary.flash{ animation:none !important; }
    .clock-track i, .mom-wrap i, .poss-bar i, .mstat .mbar i{ transition:none !important; }
    .form-sec, .divi-editor, .format-extra, .assign-row, .issue-box, .cup-preview.pv-pulse{ animation:none !important; }
    .team-row-new{ animation:none !important; }
    .pred-bar i, .pc-svg .pc-line{ transition:none !important; }
    .btn, .chip, .pick, .swatch, .pal, .seg button, .divi-editor .de-del{ transition:none !important; }
    .btn:active, .chip:active, .pick:active, .swatch:active, .pal:active, .seg button:active, .divi-editor .de-del:active{ transform:none !important; }
    #splash, #splash *{ animation:none !important; transition:opacity .25s ease !important; }
  }

  /* ---------- Animación de inicio ---------- */
  #splash{
    position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 32%, #1E8E56 0%, #0E4D2B 62%, #0A3A20 100%); overflow:hidden;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash .splash-glow{
    position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.16), rgba(255,255,255,0) 70%);
    animation:splashGlow 1.8s ease-out both;
  }
  #splash .splash-badge{
    position:relative; width:96px; height:96px; border-radius:26px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.35);
    animation:splashBadge .75s cubic-bezier(.2,1.5,.4,1) both; background:#fff;
  }
  #splash .splash-badge img{ width:100%; height:100%; display:block; object-fit:cover; }
  #splash .splash-ball{ position:relative; font-size:34px; margin-top:14px; animation:splashBall 1.1s cubic-bezier(.3,1.6,.4,1) .15s both; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35)); }
  #splash .splash-title{
    font-family:var(--font-display); font-weight:600; font-size:34px; letter-spacing:0.5px; color:#fff; margin:16px 0 2px;
    animation:splashFade .6s ease .28s both;
  }
  #splash .splash-sub{ font-family:var(--font-body); font-size:13px; color:rgba(255,255,255,0.72); letter-spacing:1.5px; text-transform:uppercase;
    animation:splashFade .6s ease .4s both; }
  #splash .splash-track{ position:relative; width:120px; height:3px; border-radius:3px; background:rgba(255,255,255,0.18); margin-top:22px; overflow:hidden;
    animation:splashFade .5s ease .5s both; }
  #splash .splash-track i{ position:absolute; top:0; left:0; height:100%; width:40%; border-radius:3px; background:#fff; animation:splashBar 1.05s ease-in-out .55s infinite; }
  #splash.splash-out{ opacity:0; visibility:hidden; pointer-events:none; }
  @keyframes splashGlow{ 0%{ transform:scale(.4); opacity:0;} 60%{ opacity:1;} 100%{ transform:scale(1); opacity:.85;} }
  @keyframes splashBadge{ 0%{ transform:scale(.3) rotate(-25deg); opacity:0;} 60%{ transform:scale(1.08) rotate(4deg); opacity:1;} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  @keyframes splashBall{ 0%{ transform:translateY(-14px) scale(.6) rotate(0deg); opacity:0;} 50%{ opacity:1;} 100%{ transform:translateY(0) scale(1) rotate(340deg); opacity:1;} }
  @keyframes splashFade{ 0%{ opacity:0; transform:translateY(6px);} 100%{ opacity:1; transform:translateY(0);} }
  @keyframes splashBar{ 0%{ left:-40%;} 100%{ left:100%;} }

  /* ====== Cinemática de tiros a pantalla completa (v10) ====== */
  .shot-cinema{position:fixed;inset:0;z-index:9000;overflow:hidden;background:#06150d;touch-action:none;cursor:pointer;animation:scIn .16s ease both}
  .shot-cinema.out{animation:scOut .2s ease both}.shot-cinema.reduce{display:none}
  @keyframes scIn{from{opacity:0}to{opacity:1}} @keyframes scOut{from{opacity:1}to{opacity:0}}
  .shot-cinema .sc-skiphint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font-size:11px;color:#fff8;background:#0006;padding:6px 10px;border:1px solid #fff2;border-radius:99px;z-index:20}
  .shot-cinema .sc-bg{position:absolute;inset:0;overflow:hidden}
  .sc-bg:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff05,#0002 55%,#0007),radial-gradient(circle at 50% 55%,transparent 35%,#0008 100%);pointer-events:none}
  .sc-bg.ang-broadcast{background:linear-gradient(180deg,#10291e 0 12%,#16613a 12% 100%);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
  .sc-bg.ang-broadcast:after{content:"";position:absolute;inset:12% 0 0;background:repeating-linear-gradient(90deg,#fff0 0 9%,#ffffff09 9.2% 9.5%);transform:perspective(500px) rotateX(48deg);transform-origin:50% 0}
  .sc-bg.ang-goalcam{background:radial-gradient(circle at 50% 0,#2c8550,#0b3b24 48%,#061c12)}
  .sc-bg.ang-side{background:linear-gradient(180deg,#0b271a,#16633b 38%,#0b2b1b 100%)}
  .sc-bg.ang-side:after{content:"";position:absolute;inset:34% 0 35%;background:repeating-linear-gradient(90deg,#ffffff08 0 5%,transparent 5% 10%)}
  .sc-crowd{position:absolute;left:0;right:0;top:0;height:12%;background:repeating-linear-gradient(90deg,#17251f 0 4px,#2b4035 4px 8px);opacity:.95;box-shadow:0 5px 20px #0006}
  .sc-crowd.bottom{top:auto;bottom:0;height:7%}
  .sc-goal{position:absolute;border:5px solid #fff;box-shadow:0 0 0 2px #0006,0 0 25px #fff2;overflow:hidden}
  .sc-goal:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#fff8 0 1px,transparent 1px 10px),repeating-linear-gradient(-45deg,#fff8 0 1px,transparent 1px 10px);opacity:.55}
  .sc-goal.ang-broadcast{top:8%;left:27%;width:46%;height:16%;border-bottom:0}
  .sc-goal.ang-goalcam{inset:2% -8% -8%;border-width:4vw;border-bottom:0}

  /* =====================================================================
     v11 · Glass UI — glassmorphism, fondo aurora y animaciones suaves
     Esta capa va al final para pisar estilos anteriores sin tocarlos.
     ===================================================================== */
  :root{
    --bg:#E9F3EE; --surface:rgba(255,255,255,.64); --surface-2:rgba(16,58,38,.06); --surface-solid:#FFFFFF;
    --border:rgba(16,35,28,.10); --shadow:rgba(16,35,28,.10);
    --glass-bg:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.50));
    --glass-strong:linear-gradient(160deg, rgba(255,255,255,.92), rgba(246,252,248,.80));
    --glass-edge:rgba(255,255,255,.85);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.9);
    --glass-shadow:0 10px 30px -12px rgba(16,58,38,.22), 0 2px 6px -2px rgba(16,58,38,.08);
    --glass-blur:blur(18px) saturate(170%);
    --grad-primary:linear-gradient(135deg,#22B06A 0%,#147A4A 100%);
    --grad-gold:linear-gradient(135deg,#F3CF6A 0%,#C6941B 100%);
    --glow-primary:0 10px 24px -8px rgba(26,150,90,.6);
    --aurora-1:rgba(52,211,140,.42); --aurora-2:rgba(56,189,248,.30); --aurora-3:rgba(244,196,72,.32);
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#06130D; --surface:rgba(255,255,255,.065); --surface-2:rgba(255,255,255,.07); --surface-solid:#11271D;
      --border:rgba(255,255,255,.10); --shadow:rgba(0,0,0,.45);
      --glass-bg:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
      --glass-strong:linear-gradient(160deg, rgba(22,46,34,.92), rgba(10,26,19,.86));
      --glass-edge:rgba(255,255,255,.12);
      --glass-hi:inset 0 1px 0 rgba(255,255,255,.10);
      --glass-shadow:0 14px 36px -14px rgba(0,0,0,.7), 0 2px 8px -2px rgba(0,0,0,.4);
      --grad-primary:linear-gradient(135deg,#2FC07B 0%,#167E50 100%);
      --glow-primary:0 10px 26px -8px rgba(47,192,123,.55);
      --aurora-1:rgba(34,197,120,.26); --aurora-2:rgba(37,99,235,.20); --aurora-3:rgba(168,85,247,.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#06130D; --surface:rgba(255,255,255,.065); --surface-2:rgba(255,255,255,.07); --surface-solid:#11271D;
    --border:rgba(255,255,255,.10); --shadow:rgba(0,0,0,.45);
    --glass-bg:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    --glass-strong:linear-gradient(160deg, rgba(22,46,34,.92), rgba(10,26,19,.86));
    --glass-edge:rgba(255,255,255,.12);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.10);
    --glass-shadow:0 14px 36px -14px rgba(0,0,0,.7), 0 2px 8px -2px rgba(0,0,0,.4);
    --grad-primary:linear-gradient(135deg,#2FC07B 0%,#167E50 100%);
    --glow-primary:0 10px 26px -8px rgba(47,192,123,.55);
    --aurora-1:rgba(34,197,120,.26); --aurora-2:rgba(37,99,235,.20); --aurora-3:rgba(168,85,247,.14);
  }

  /* ---------- Fondo aurora animado ---------- */
  body{ background:var(--bg); }
  #shell{ background:transparent; z-index:1; }
  #bgFx{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  #bgFx i{ position:absolute; width:75vmax; height:75vmax; border-radius:50%; will-change:transform; }
  #bgFx .b1{ left:-30vmax; top:-28vmax; background:radial-gradient(circle, var(--aurora-1), transparent 62%); animation:aurora1 26s ease-in-out infinite alternate; }
  #bgFx .b2{ right:-34vmax; top:12vh; background:radial-gradient(circle, var(--aurora-2), transparent 62%); animation:aurora2 32s ease-in-out infinite alternate; }
  #bgFx .b3{ left:-12vmax; bottom:-40vmax; background:radial-gradient(circle, var(--aurora-3), transparent 62%); animation:aurora3 38s ease-in-out infinite alternate; }
  #bgFx .pitch-lines{ position:absolute; left:50%; top:50%; width:min(140vw,900px); aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
    border:1.5px solid color-mix(in srgb, var(--text) 5%, transparent); opacity:.9; }
  #bgFx .pitch-lines::before{ content:''; position:absolute; left:50%; top:-100vh; bottom:-100vh; width:1.5px; background:color-mix(in srgb, var(--text) 5%, transparent); }
  #bgFx .pitch-lines::after{ content:''; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:color-mix(in srgb, var(--text) 7%, transparent); }
  @keyframes aurora1{ 0%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(18vw,12vh) scale(1.15);} 100%{ transform:translate(6vw,26vh) scale(.95);} }
  @keyframes aurora2{ 0%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-16vw,20vh) scale(.9);} 100%{ transform:translate(-6vw,-8vh) scale(1.12);} }
  @keyframes aurora3{ 0%{ transform:translate(0,0) scale(1.05);} 50%{ transform:translate(20vw,-14vh) scale(.92);} 100%{ transform:translate(30vw,-4vh) scale(1.1);} }

  /* ---------- Superficies de vidrio ---------- */
  .card, .match-card, .form-sec, .bracket-match, .award-card, .divi-editor, .stadium-preview, .venue-card,
  .motm-card, .ls-box, .commentary, .pred-line, .finance-card, .h2h div, .ps-career div, .ps-meters > div,
  .spark-box, .team-chip, .issue-box{
    background:var(--glass-bg); border:1px solid var(--glass-edge);
    box-shadow:var(--glass-shadow), var(--glass-hi);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  }
  .card, .match-card, .bracket-match{ border-radius:18px; }
  .form-sec, .divi-editor{ border-radius:20px; }
  .issue-box{ background:linear-gradient(135deg, rgba(214,41,58,.16), rgba(214,41,58,.06)); border-color:color-mix(in srgb, var(--danger) 55%, transparent); }
  .team-chip.on{ background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent) 8%, transparent)); border-color:var(--accent); }
  .h2h div, .ps-career div, .ps-meters > div{ border-radius:14px; }
  .sim-loader-pitch::before{ background:var(--surface-solid); }
  .tag-liga{ background:color-mix(in srgb, var(--accent) 16%, transparent) !important; }
  .tag-elim{ background:color-mix(in srgb, var(--warn) 18%, transparent) !important; }

  /* Brillo especular que recorre las tarjetas al pasar el mouse */
  .card, .match-card, .award-card, .comp-card{ position:relative; }
  @media (hover:hover){
    .card.team-row, .comp-card, .tm-row, .match-card, .award-card, .div-card, .stadium-mini{
      transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .25s ease; }
    .card.team-row:hover, .comp-card:hover, .tm-row:hover, .match-card:hover, .award-card:hover, .div-card:hover, .stadium-mini:hover{
      transform:translateY(-3px); box-shadow:0 20px 40px -18px var(--shadow), var(--glass-hi); }
  }

  /* ---------- Barra superior de vidrio ---------- */
  header.topbar{
    background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 70%, transparent), color-mix(in srgb, var(--bg) 35%, transparent));
    -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
    border-bottom:1px solid var(--glass-edge); transition:box-shadow .3s ease, padding .3s var(--ease-out);
  }
  header.topbar.scrolled{ box-shadow:0 10px 30px -16px var(--shadow); }
  header.topbar h1{
    background:linear-gradient(90deg, var(--text) 30%, var(--accent-strong)); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; animation:titleIn .5s var(--ease-out) both;
  }
  header.topbar h1 .count-badge{ -webkit-text-fill-color:#fff; background:var(--grad-primary); box-shadow:var(--glow-primary); }
  @keyframes titleIn{ from{ opacity:0; transform:translateY(-6px); filter:blur(4px);} to{ opacity:1; transform:none; filter:none;} }
  header.topbar .back-btn{
    width:38px; height:38px; padding:0; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px;
    background:var(--glass-bg); border:1px solid var(--glass-edge); box-shadow:var(--glass-hi);
    transition:transform .2s var(--ease-spring), background-color .2s ease;
  }
  header.topbar .back-btn:active{ transform:scale(.88) translateX(-2px); }
  header.topbar .icon-btn{
    background:var(--glass-bg); border:1px solid var(--glass-edge); border-radius:12px; box-shadow:var(--glass-hi);
    transition:transform .2s var(--ease-spring), box-shadow .2s ease;
  }
  @media (hover:hover){ header.topbar .icon-btn:hover, header.topbar .back-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px -8px var(--shadow), var(--glass-hi); } }

  /* ---------- Dock inferior flotante ---------- */
  nav.tabbar{
    margin:0 10px 10px; padding:6px; border-radius:24px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--surface-solid) 78%, transparent), color-mix(in srgb, var(--surface-solid) 55%, transparent));
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--glass-edge); box-shadow:0 18px 40px -16px var(--shadow), var(--glass-hi); bottom:calc(10px + env(safe-area-inset-bottom));
  }
  nav.tabbar .tab-indicator{
    position:absolute; top:6px; bottom:6px; left:0; width:0; border-radius:18px; z-index:0; pointer-events:none;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, transparent), color-mix(in srgb, var(--accent) 10%, transparent));
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    box-shadow:0 6px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .5s var(--ease-spring), width .5s var(--ease-out), opacity .3s ease; opacity:0;
  }
  nav.tabbar .tab-indicator.ready{ opacity:1; }
  nav.tabbar button{ position:relative; z-index:1; border-radius:18px; transition:color .3s ease; }
  nav.tabbar button .ic{ display:inline-block; transition:transform .45s var(--ease-spring), filter .3s ease; filter:grayscale(.55) opacity(.75); }
  nav.tabbar button.active .ic{ transform:translateY(-2px) scale(1.14); filter:none; }
  nav.tabbar button.active .ic.bounce{ animation:icBounce .6s var(--ease-spring); }
  @keyframes icBounce{ 0%{ transform:translateY(0) scale(1);} 40%{ transform:translateY(-7px) scale(1.25) rotate(-6deg);} 100%{ transform:translateY(-2px) scale(1.14);} }

  /* ---------- Botones ---------- */
  .btn{ position:relative; overflow:hidden; isolation:isolate; border-radius:14px; letter-spacing:.1px; }
  .btn-primary{ background:var(--grad-primary); color:#fff; box-shadow:var(--glow-primary), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-gold{ background:var(--grad-gold); color:#3a2a03; box-shadow:0 10px 24px -8px rgba(198,148,27,.6), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn-secondary{ background:var(--glass-bg); border:1px solid var(--glass-edge); color:var(--text); box-shadow:var(--glass-hi), 0 4px 14px -8px var(--shadow);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .btn-danger{ background:color-mix(in srgb, var(--danger) 8%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .btn-primary::after, .btn-gold::after{
    content:''; position:absolute; top:0; bottom:0; left:-60%; width:40%; z-index:-1; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent); transform:skewX(-18deg); transition:left .7s var(--ease-out);
  }
  @media (hover:hover){
    .btn:hover:not(:disabled){ transform:translateY(-1px); filter:none; }
    .btn-primary:hover:not(:disabled)::after, .btn-gold:hover:not(:disabled)::after{ left:130%; }
    .btn-secondary:hover:not(:disabled){ border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  }
  .btn:active:not(:disabled){ transform:scale(.96); }
  .rp{ position:absolute; border-radius:50%; pointer-events:none; transform:scale(0); opacity:.35; background:currentColor; z-index:0;
    animation:rpOut .6s var(--ease-out) forwards; }
  @keyframes rpOut{ to{ transform:scale(1); opacity:0; } }
  .batch-btn{ background:var(--glass-bg); border:1px solid var(--glass-edge); border-radius:10px; box-shadow:var(--glass-hi); transition:transform .2s var(--ease-spring); }
  .batch-btn:active{ transform:scale(.94); }

  /* Segmentos, chips y selectores */
  .seg{ background:var(--surface-2); border:1px solid var(--glass-edge); border-radius:16px; padding:4px; box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .seg button{ border-radius:12px; }
  .seg button.active{ background:var(--glass-strong); color:var(--accent-strong); box-shadow:0 6px 16px -8px var(--shadow), var(--glass-hi); }
  .chip, .sp-chip, .snd-chip, .pc-chip, .toggle-row button{ background:var(--glass-bg); border-color:var(--glass-edge); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .chip.active, .sp-chip.active, .toggle-row button.active{ background:var(--grad-primary); border-color:transparent; color:#fff; box-shadow:var(--glow-primary); }
  .pick{ background:var(--glass-bg); border-color:var(--glass-edge); }
  .pick.selected{ background:color-mix(in srgb, var(--accent) 16%, transparent); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 8px 18px -10px var(--accent); }

  /* Campos de formulario */
  .form-group input[type=text], .form-group input[type=number], .form-group select, .form-group input[type=date], .search-wrap input, .assign-row select{
    background:var(--glass-bg); border:1px solid var(--glass-edge); box-shadow:inset 0 1px 2px rgba(0,0,0,.05); border-radius:12px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .form-group select option{ background:var(--surface-solid); color:var(--text); }
  .form-group input:focus, .form-group select:focus, .search-wrap input:focus{
    border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 20px -12px var(--accent); outline:none; }

  /* ---------- Hojas, overlays y toasts ---------- */
  .confirm-overlay{ background:rgba(4,14,9,.38); -webkit-backdrop-filter:blur(4px) saturate(120%); backdrop-filter:blur(4px) saturate(120%); animation:ovIn .28s ease both; }
  .confirm-sheet{
    position:relative; background:var(--glass-strong); border:1px solid var(--glass-edge); border-bottom:none; border-radius:26px 26px 0 0;

  .toast{

  #scrollTopBtn{ background:var(--grad-primary); border:1px solid rgba(255,255,255,.25); box-shadow:var(--glow-primary), inset 0 1px 0 rgba(255,255,255,.3);

  /* ---------- Transiciones entre pantallas ---------- */

  /* ---------- Banners de copa y campeón ---------- */
  .cup-banner{ box-shadow:0 18px 40px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25); border-radius:20px; }

  .motm-card{ border:1px solid color-mix(in srgb, var(--gold) 60%, transparent); background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 18%, transparent), color-mix(in srgb, var(--gold) 4%, transparent));
    position:relative; overflow:hidden; }

  .ps-bar .bar, .happy-bar, .div-prog, .fit-bar, .mstat .mbar{ background:var(--surface-2); box-shadow:inset 0 1px 2px rgba(0,0,0,.08); }
  .ps-bar .bar i, .div-prog i{ background:var(--grad-primary); box-shadow:0 0 10px -2px var(--accent); }
  .pitch{ border-radius:18px; border:1px solid var(--glass-edge); box-shadow:0 18px 40px -18px rgba(0,0,0,.55), var(--glass-hi); }
  .dorsal, .pos-badge, .ovr-chip, .lock-chip, .grp-tag, .season-pill, .pred-score, .ps-bio span{ background:var(--surface-2); border:1px solid var(--glass-edge); }

  /* =====================================================================
     Partidos
     ===================================================================== */
  /* Tarjeta de partido con los colores de cada club */
  .match-card{ overflow:hidden; padding:14px 14px 12px; }

    content:''; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.9;
    background:
      radial-gradient(120px 90px at 0% 30%, color-mix(in srgb, var(--ca, transparent) 26%, transparent), transparent 70%),

  }

    content:''; position:absolute; left:0; right:0; top:0; height:3px; pointer-events:none; z-index:0;

  }

  @keyframes clasicoGlow{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.18);} }
  .match-teams .side img, .match-teams .side svg{ filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)); transition:transform .35s var(--ease-spring); }
